<script>window.CLAREA_PUSH = {"url": "https://clarea-push.clarea.workers.dev", "key": "BFCmDhDzeeA-zo1OtcQMSYSlz-834PqEqDw1G3gEE9n1m90HRgG58GyISyHnzk8o87jduHTpFlCGP3Xu3YDW2cQ"}; window.CLAREA_VERSION = "20261113122439"; window.CLAREA_RELEASE = "1.6.2"; window.CLAREA_BETA = true; window.CLAREA_CHANGES = [{"v": "1.6.2", "date": "2026-11-13", "title": "El chat, a la manera de Clarea", "items": [["La cabecera no se mueve", "Arriba, Clarea se queda quieta: ya no rebota al deslizar ni salta al abrir el teclado en el iPhone."], ["El chat ocupa toda la pantalla", "Entre la barra de arriba y las pestañas, sin huecos. Al abrir el teclado no se mueve nada: solo suben los mensajes."], ["El chat, con el aspecto de Clarea", "Los mensajes, la lista de chats y la caja de escribir tienen los colores, la letra y los botones de Clarea, en claro y en oscuro."]]}, {"v": "1.6.1", "date": "2026-11-13", "title": "Chat con amigos y sin pedirte la sesión", "items": [["Dentro, no te pide nada", "Estando en Clarea, abrir un proyecto, unas preguntas o un aviso ya no te pide la contraseña ni Face ID."], ["«Recordarme» funciona siempre", "Con «Recordarme», abres Clarea y entras directamente, también si tienes Face ID activado."], ["Face ID, solo si quieres", "Face ID ya no te bloquea al abrir ni al volver. Sirve para volver a entrar sin escribir la contraseña si cierras sesión."], ["Arriba y abajo, siempre", "La cabecera de Clarea y las cinco pestañas se ven en todas las pantallas: en el chat, en las fotos, en Proyectos, en Preguntas y en Privacidad. Toca una pestaña y vas, aunque tengas algo abierto."], ["Cambia tu usuario", "En Yo → «Contraseña», cambia tu nombre de usuario sin perder nada: tu progreso, amigos y grupos siguen igual."], ["Un chat con cada amigo", "Escríbele a un amigo como en WhatsApp: mensajes, fotos con su asignatura, responder y la hoja de Notas. Entra desde su perfil («Enviar mensaje») o con «+ Nuevo» en Grupos."], ["Todos tus chats juntos", "En Grupos, los chats de tus grupos y de tus amigos, el más reciente arriba, con el último mensaje y los que no has leído."], ["Siempre a mano", "Dentro de un chat se siguen viendo la barra de arriba y las pestañas de abajo."]]}, {"v": "1.6", "date": "2026-11-13", "title": "Clarea, más ordenada", "items": [["Cinco pestañas abajo", "Inicio, Estudiar, Agenda, Grupos y Yo. Inicio solo tiene lo de hoy; lo demás está en su pestaña."], ["Más ordenada por dentro", "Todos los botones, letras y colores siguen la misma guía. Al pasar el ratón, solo cambia el color, y el idioma de las respuestas se elige con dos botones."], ["Proyectos y Preguntas, como el resto", "Ahora tienen los colores y la letra de Clarea, y las pestañas de abajo."], ["Tareas y deberes", "En Agenda → Tareas: apúntalas con asignatura y fecha, y márcalas como hechas. Las de hoy salen en Inicio («Por hacer») y en el calendario."], ["Un solo «Hoy» en Inicio", "Arriba tus clases y, debajo, «Por hacer»: tareas, entregas, exámenes cercanos y preguntas para repasar. Nada sale dos veces."], ["Chat de grupo", "Cada grupo tiene su chat. Al enviar una foto, Clarea te pregunta de qué asignatura es y sale marcada con ella."], ["Fotos por asignatura", "En cada grupo, y en Yo → Mi galería: eliges la asignatura y dentro tienes Exámenes, Apuntes, Ejercicios… Puedes crear tus propios tipos, con nombre y color."], ["Tareas de grupo", "Apunta una tarea en un grupo y la verán todos. Cada uno marca la suya como hecha."], ["Mensajes sin leer", "Un número en la pestaña Grupos y en cada grupo te dice cuántos mensajes no has visto."], ["Guarda fotos del grupo", "Abre una foto de un grupo y toca «Guardar en Mi galería»: se guarda en tus fotos, en su asignatura y su tipo."], ["Responder en el chat", "Mantén pulsado un mensaje y toca «Responder»: tu respuesta sale con el mensaje citado encima."], ["Una tarea desde el chat", "Mantén pulsado un mensaje y toca «Crear una tarea»: se apunta en el grupo, con su texto y, si es una foto, su asignatura."], ["Pasa las fotos", "Con una foto abierta, desliza a los lados para ver la anterior y la siguiente del mismo tipo."], ["Tu perfil, en una página", "Yo reúne tu cuenta, la sincronización, la configuración y el tema. Sin menús ni ventanas encima."], ["Avisos de amigos y grupos", "Te llega un aviso al móvil cuando alguien te manda una solicitud, acepta la tuya, te añade a un grupo o apunta algo en su calendario. Se pueden apagar en Grupos → Amigos."], ["Los exámenes del grupo te avisan", "Las entregas y exámenes de tus grupos te avisan el día antes y 30 minutos antes, aunque no hayas abierto Clarea desde que los apuntaron."], ["El perfil de tus amigos", "Toca a un amigo para ver los grupos que compartís y lo próximo en ellos, crear un grupo juntos o quitarlo."], ["Elige tu IA", "La primera vez, Clarea te deja elegir: Gemini (gratis, se hace solo) o tu cuenta de Claude (sin clave). Lo puedes cambiar en Configuración."], ["Pestaña ✦ IA más clara", "Dos caminos: «Generar» con Gemini o «Enviar a Claude». Copiar y pegar en tu chat sigue ahí, plegado en «Otras formas»."], ["Aviso cuando Claude termina", "Si tienes los avisos activados, te llega un aviso al móvil cuando Claude acaba lo que le enviaste."], ["Claude, en «Por hacer»", "Lo que le envías a Claude sale en Inicio, en «Por hacer», con cuántas partes lleva. Cuando termina, tócalo para verlo."], ["Todo a Claude de una vez", "¿Usas Claude? En Inicio, «Enviar a Claude lo pendiente» le manda en un solo mensaje todos tus proyectos y preguntas por preparar."], ["Guarda lo que te explica tu IA", "En «Pregúntale a tu IA», toca «Guardar para repasar»: la pregunta y la respuesta van a «Mis dudas» de esa asignatura y salen al repasar."], ["Cuánto Gemini gratis te queda", "En Yo → Configuración ves cuántas peticiones gratis de Gemini te quedan hoy (es una cuenta aproximada). Si no llegan para lo que falta, Clarea te avisa antes."], ["«Falté a esta clase»", "Toca una clase en Inicio o en el Horario y pulsa «Falté hoy»: Clarea suma sus horas a tus faltas. No se cuenta dos veces, y puedes deshacerlo al momento o quitarla luego. En Inicio, esa clase pone «Faltaste»."], ["Horario y faltas en cada asignatura", "En la página de cada asignatura, un bloque plegado te dice qué días y a qué hora toca, con qué profe y en qué aula, y cuántas horas de falta te quedan."], ["Tus faltas, día a día", "En Faltas, cada asignatura enseña los días que faltaste. Si te equivocaste, quita una con «Quitar»."], ["Aviso antes del límite", "Al apuntar una falta, si te acercas al límite de esa asignatura, Clarea te avisa de cuántas horas te quedan."], ["Faltas en el Horario", "Las clases a las que faltaste esta semana ponen «Faltaste» también en el Horario."], ["«Llegué tarde»", "En la hoja de cada clase, junto a «Falté», «Llegué tarde» apunta media hora. En Inicio y en el Horario pone «Tarde»."], ["Ahora y siguiente", "En Inicio, encima de tus clases de hoy: en qué clase estás y hasta cuándo, o cuál es la siguiente y en qué aula."], ["¿Faltaste hoy?", "Al acabar tu última clase, un aviso en el móvil para apuntar si faltaste o llegaste tarde. Se apaga en Configuración → Avisos."], ["Días sin clase", "En Agenda → Horario, guarda festivos y vacaciones. Esos días no salen clases en Inicio, no te llega «¿Faltaste hoy?» y no se apuntan faltas."], ["Tus faltas del domingo", "El aviso del domingo a las 20:00 te dice cuántas horas faltaste esa semana y en qué asignatura estás más cerca del límite."], ["Edita tus preguntas de examen", "En «Preguntas», pulsa «Editar preguntas» para corregir lo que se leyó mal, quitar las que sobran o añadir nuevas. Con clave de Gemini, las nuevas se preparan solas."], ["Tu IA te corrige al practicar", "En «Ponte a prueba», si escribes tu respuesta, tu IA te pone nota y te dice qué falta. El botón que propone sale marcado."], ["Repasa desde «Por hacer»", "Toca «Repasa X preguntas» en el inicio y empiezas la ronda directamente."], ["La IA prepara todo sola", "Con clave de Gemini ya no hace falta pulsar «Preparar» ni «Generar»: al importar preguntas, editarlas o crear un proyecto, tu IA empieza sola. Si pulsas «Parar», espera a que se lo pidas."], ["Añade preguntas desde fotos o PDF", "En «Editar preguntas», «Desde fotos o PDF»: tu IA las lee y las deja listas para revisar."], ["Tu última nota, a la vista", "Cada pregunta enseña la última nota que te puso tu IA (al practicar o en un simulacro), para ver cuáles flojean."], ["Simulacro con las que flojean", "En Simulacro, elige «Las que flojean»: salen primero las preguntas con nota baja de tu IA o las que aún no te sabes."], ["Responde hablando", "En «Ponte a prueba» y en Simulacro, pulsa «Dictar» y di tu respuesta: se escribe sola, como en un oral."], ["Clarea en tu calendario", "En el calendario, toca «Suscríbete»: tus entregas y exámenes (y los de tus grupos) salen solos en el calendario del iPhone o en Google Calendar, y se actualizan cuando cambias algo."], ["Los avisos que eliges, en todas partes", "Los avisos de cada evento (el día antes, 30 minutos antes…) son ahora los mismos en el móvil, dentro de Clarea y al añadir el evento a tu calendario."], ["Avisos de estudio", "El domingo a las 20:00, lo que tienes esa semana. Y la tarde antes de un examen, cuántas preguntas te quedan por repasar, con el repaso a un toque. Se quitan en Configuración."], ["Hoja compartida al día", "Si guardaste en Notas la hoja que te pasó un compañero y él la cambia, Clarea te avisa: «Hay una versión nueva». Un toque y la tienes, sin perder tus notas."], ["Actualiza el código de un proyecto", "¿Has cambiado tu proyecto? En sus ajustes (⚙), «Actualizar el código»: súbelo otra vez (GitHub, .zip o carpeta). Solo se vuelven a explicar los archivos que cambian."], ["Repasa tus fallos", "En Exámenes, «Repasar mis fallos» te pone solo las preguntas que fallaste. Cuando aciertas una, deja de salir. Y en las tarjetas salen primero los conceptos de esas preguntas."], ["Compartir sin tus claves", "Al compartir un proyecto, Clarea busca contraseñas y claves en tu código y las tapa con •••. Te enseña dónde estaban."], ["Mi progreso, más claro", "Ahora te lo dice con frases, por ejemplo: «Te sabes 12 de 38 preguntas»."], ["Entregada o por entregar", "En cada entrega, toca «Ya la he entregado»: se queda en el calendario marcada como entregada y ya no te avisa. Las que faltan pone «Por entregar»."], ["Importa fechas con tu IA", "En el calendario, «Impórtalas con tu IA»: pega el mensaje del profe o haz una foto, y tu IA saca las entregas y los exámenes. Tú marcas cuáles guardar."], ["Vista de semana", "En el calendario, elige «Semana»: cada día con sus clases, entregas y exámenes, más cómodo en el móvil."], ["Enlace para unirse a un grupo", "En un grupo → Grupo, «Invitar con un enlace»: quien lo abre entra en el grupo sin ser antes amigo de todos. Dura 14 días."], ["Silenciar un grupo", "En un grupo → Grupo → Avisos, apaga los avisos de ese grupo (chat, tareas y cambios del calendario). Sus exámenes te siguen avisando."], ["Quitar a alguien del grupo", "Quien creó el grupo puede quitar a un miembro desde Grupo → Miembros."], ["El chat, como WhatsApp", "Burbujas verdes (las tuyas) y blancas, el nombre de cada uno en su color, la hora en cada mensaje y la barra de escribir abajo. Toca el nombre del grupo para ver su información."], ["Por entregar y ya entregadas", "En la Agenda, «Por entregar» te pone todas las entregas que te faltan, también las que se te pasaron. Las entregadas quedan plegadas en «Ya entregadas»."], ["¿La entregaste?", "Si pasa la hora de una entrega y no la has marcado, Clarea te lo pregunta (a la mañana siguiente si era de noche)."], ["Importa fechas a un grupo", "Al importar fechas con tu IA, elige si van a tu calendario o al de un grupo, para que las vean todos."], ["Al actualizar, se guarda más", "Si un archivo cambia solo un poco, se guardan las explicaciones de lo que no cambió: la IA solo explica lo nuevo."], ["Examen de un archivo", "Abre un archivo en Código y toca «Examen de este archivo»: un test corto solo con sus preguntas."], ["Qué hay de nuevo en un repaso compartido", "Si vuelves a abrir un repaso que te pasaron y ha cambiado, Clarea te dice qué es nuevo y marca los archivos."], ["Cambia tu contraseña", "En Yo → «Contraseña». En tus otros dispositivos tendrás que entrar con la nueva."], ["Código de recuperación", "Crea un código y guárdalo. Si olvidas la contraseña, en la pantalla de entrada toca «¿Has olvidado la contraseña?» y pon una nueva con él."], ["Más protección en tu dispositivo", "La copia de tu contraseña que guarda el móvil para entrar sin internet ahora es mucho más difícil de adivinar."], ["Borrar la cuenta lo borra todo", "Al eliminar tu cuenta también se borran tus amigos, grupos y código. En tus otros dispositivos la sesión se cierra sola."], ["Face ID", "En Yo → «Contraseña», activa Face ID: te lo pide al abrir Clarea en ese móvil y al volver tras más de 5 minutos fuera, por si alguien lo coge."], ["Cerrar sesión en los demás", "¿Entraste en un ordenador del instituto? En Yo → «Contraseña», cierra tu cuenta en todos tus otros dispositivos a la vez."], ["Privacidad al día", "La página de Privacidad explica ahora todo lo que guarda Clarea, también amigos, grupos y Claude."], ["Examen unido a su actividad", "Al apuntar un examen o una entrega, elige a qué actividad de tus Notas corresponde. Cuando Clarea te pregunte qué has sacado, solo pones la nota."], ["La hoja de Notas, a tu grupo", "En «Compartir con tu clase», toca uno de tus grupos: la hoja llega a su chat y tus compañeros la guardan en sus Notas con un toque. Tus notas no se comparten."], ["¿Qué has sacado?", "Al día siguiente de un examen, a las 18:00, te llega un aviso para apuntar la nota. Al tocarlo, te la pide y va directa a tus Notas."], ["Tus avisos por defecto", "En Configuración → Avisos, elige qué avisos llevan tus eventos nuevos (por ejemplo, el día antes y 1 hora antes). También vale para los de tus grupos."], ["La hoja de Notas, en la nube", "Con tu clave de Gemini, Clarea lee la hoja de evaluación en la nube: puedes cerrar Clarea y te avisa al terminar. Se guarda sola en tus Notas."], ["Tarjetas de un archivo", "Abre un archivo en Código y toca «Tarjetas»: repasas solo los conceptos que salen en él."], ["Código nuevo en GitHub", "Si tu proyecto está en GitHub y subes commits nuevos, Clarea te avisa en Código y lo actualizas con un toque."], ["Más fácil de leer en oscuro", "En el chat «Pregúntale a tu IA», tus mensajes, quién responde (Claude o Gemini) y el botón «Abrir Claude» se leen mejor en modo oscuro."], ["Papelera", "¿Borraste algo sin querer? Eventos, tareas, proyectos, preguntas y notas se quedan 30 días en Yo → «Papelera», en todos tus dispositivos. Un toque en «Recuperar» y vuelve."], ["Tus dispositivos", "En Yo → «Contraseña», ves dónde tienes tu cuenta abierta (por ejemplo «Windows · Chrome · hace 5 min») y puedes cerrar uno solo."], ["Sincroniza al instante", "Con Clarea abierta en el móvil y en el PC, lo que cambias en uno aparece en el otro en unos segundos."], ["Aviso de nuevo inicio", "Si alguien entra en tu cuenta desde un dispositivo nuevo, te avisa en tus otros dispositivos (y en el móvil, si tienes los avisos activados)."], ["Copia cada semana", "Clarea guarda sola una copia de todo cada semana (las 4 últimas). En Yo → «Copias» eliges una fecha y todo vuelve como estaba."], ["¿Está todo subido?", "Si ves un punto naranja arriba, hay cambios que aún no están en tus otros dispositivos (o no hay internet). Tócalo para saber qué pasa."]]}, {"v": "1.5", "date": "2026-11-12", "title": "Amigos y grupos", "items": [["Amigos en Clarea", "Añade amigos de tres formas: por su nombre de usuario (y aceptan), con su código de amigo o con un enlace de invitación. Está en el menú de tu perfil → «Amigos y grupos»."], ["Grupos con calendario compartido", "Crea un grupo con tus amigos: lo que apunte uno en el calendario del grupo, lo veis todos. Sale en tu calendario con el nombre y el color del grupo, y puedes ocultarlo cuando quieras."], ["Explicado fácil", "En el glosario de tus proyectos, cada concepto tiene ahora «Explicado fácil» y «Explicado técnico»."]]}, {"v": "1.4.4", "date": "2026-11-12", "title": "Claude, paso a paso", "items": [["Sin escribir nada en Claude", "«Enviar a Claude» abre Claude (la app si la tienes; si no, la web) con el mensaje ya escrito: solo pulsas enviar. Antes, un aviso que puedes quitar con «No volver a preguntar»."], ["Pregúntale a Claude", "En «Pregúntale a tu IA», con Claude conectado, tu pregunta se abre en Claude ya escrita y con tu código o tu pregunta de examen delante. Claude te responde allí, y la respuesta llega también a Clarea."], ["Solo Gemini como clave", "Para que todo se haga solo, Clarea usa ahora una única IA con clave: Gemini, gratis. Claude se usa con tu cuenta, con el conector."], ["Ves cómo va Claude", "Al enviar algo a Claude, Clarea te enseña cada paso: enviado, Claude lo ha abierto, cuántas partes lleva guardadas y cuánto le queda. Si Claude no empieza, te dice qué revisar."], ["Cómo se usa", "En Configuración, debajo del conector, los pasos para añadirlo en Claude y para usarlo."]]}, {"v": "1.4.3", "date": "2026-11-12", "title": "Claude con tu cuenta", "items": [["Conecta Claude con Clarea", "¿Usas Claude (gratis, Pro o Max)? En Configuración, conecta Clarea con Claude una vez. Luego toca «Enviar a Claude» en un proyecto, unas preguntas o Notas, y en Claude escribe «Prepara lo que tengo pendiente en Clarea»: Claude lo hace con tu cuenta y lo guarda en Clarea solo. Sin clave, sin copiar y pegar y sin saturaciones."], ["Si tu IA está saturada, cambia de modelo", "Al leer la hoja de Notas o tus fotos de preguntas, si el modelo está saturado Clarea lo reintenta una vez y sigue con otro modelo de tu misma IA (nunca cambia de IA). Te dice cuál usa en cada momento."], ["Cancelar", "Mientras tu IA lee, puedes cancelar."], ["Notas con tu chat de IA", "¿IA saturada o tienes Claude Pro o ChatGPT? Copia un mensaje, pégalo en tu chat (con las fotos o el PDF si los tienes) y pega aquí lo que responda."]]}, {"v": "1.4.2", "date": "2026-11-12", "title": "Para hoy y comparte cómo se evalúa", "items": [["Con tu chat de IA, en un solo mensaje", "¿Tienes Claude Pro, ChatGPT Plus o Gemini? Copia un solo mensaje, pégalo en tu chat y pega aquí su respuesta. Si se corta, dile «sigue» y pega lo nuevo: Clarea guarda cada parte y te dice lo que falta."], ["Para hoy", "En Inicio, lo que toca hoy: las entregas de hoy y mañana, el próximo examen con lo que necesitas sacar, y las preguntas que te toca repasar."], ["Avisos con lo que necesitas", "El aviso de un examen te dice también qué media necesitas en lo que falta para aprobar (o para tu objetivo)."], ["Comparte la hoja de Notas", "Crea un enlace con cómo se evalúa una asignatura (actividades, porcentajes y criterios) para tu clase. Tus notas no se comparten, y quien lo abre lo guarda en sus Notas con un toque."], ["Notas, en su sitio", "Las Notas de cada asignatura se abren desde el apartado «Notas»: ya no aparecen dentro de cada asignatura."], ["El nombre del evento, ya escrito", "Al elegir asignatura y tipo, el nombre («Examen teórico SM7») ya queda escrito. Puedes cambiarlo; si pones uno tuyo, Clarea no lo toca."], ["«Hoy» más fino", "«Desliza» solo sale cuando las clases no caben, y la clase de ahora y los exámenes ya no se ven más grandes que las demás."]]}, {"v": "1.4.1", "date": "2026-11-12", "title": "Tus notas, en todas partes", "items": [["La nota en el calendario", "Cuando apuntas la nota de un examen o una entrega, se ve ese día en el calendario, y en el detalle pone «Sacaste un 7,5» con la actividad de tus Notas."], ["Notas en el buscador", "Busca una actividad («A12», «examen 2»…) y Clarea te lleva a tus Notas."], ["Añade cómo se evalúa", "Si una asignatura tiene exámenes en el calendario y aún no tiene Notas, su página te lo recuerda."]]}, {"v": "1.4", "date": "2026-11-12", "title": "Notas, simulacros y tu IA en un chat", "items": [["Simulacro de examen", "Con las preguntas del profe: preguntas al azar, por escrito y con tiempo si quieres. Al entregar, tu IA lo corrige y te pone nota."], ["Pregúntale a tu IA", "Un chat dentro de cada proyecto y de cada pregunta de examen: pregunta lo que no entiendas y tu IA responde con tu código o con esa pregunta delante."], ["Notas", "Pega el enlace, el PDF o unas fotos de cómo se evalúa cada asignatura y tu IA saca las actividades con su porcentaje. Pon tus notas y Clarea te dice cuánto llevas y qué media necesitas en lo que falta para aprobar o para tu objetivo. También tienes, para consultar, la nota por fases, los criterios, cómo se recupera y los módulos."], ["Mi progreso", "Cómo vas en cada asignatura: preguntas dominadas, notas de simulacros y exámenes, los próximos exámenes con los días que faltan y un botón para repasar cada uno."], ["¿Qué has sacado?", "Cuando pasa un examen o una entrega del calendario, Clarea te pregunta la nota y la apunta en la actividad que toca de tus Notas."], ["¿Y si saco…?", "En Notas, pon notas imaginarias en lo que te falta y mira al momento cómo quedaría tu nota final."], ["Faltas en tus Notas", "Si la asignatura pide un mínimo de asistencia, Notas te avisa cuando tus faltas se acercan al límite."], ["Pregúntale a tu IA sobre tus notas", "Un chat en Notas con la hoja de evaluación y tus notas delante: «¿cuánto necesito en el próximo examen para un 7?»."], ["Chuleta para imprimir", "En tus preguntas de examen: todas con su respuesta corta, sus conceptos clave y el glosario de tus proyectos, en dos columnas para imprimir o guardar en PDF."], ["Atajos en el icono", "Con Clarea instalada, mantén pulsado su icono para ir directo a Notas, Calendario o Mi progreso."], ["Preguntas desde fotos o PDF", "Haz fotos a las preguntas del profe o sube el PDF: tu IA las pasa a texto y tú solo las revisas antes de guardarlas."], ["Comparte tus preguntas", "Crea un enlace para que tu clase estudie tus preguntas con sus explicaciones, sin cuenta ni clave de IA. Quien tenga cuenta puede guardarlas en su Clarea."], ["Avisos que no tapan", "Los avisos de abajo ya no tapan lo último de la página, y «Sincroniza tu cuenta» se cierra para siempre con la X."], ["Todo en Tareas", "«Tareas en segundo plano» enseña también las preguntas de examen que se preparan en la nube."], ["Configuración en Mi cuenta", "La Configuración (tu IA, sus claves, la nube y los avisos) está ahora dentro de Mi cuenta."], ["Horario y faltas, a mano", "El horario y las faltas de asistencia salen directamente en el inicio, en «Tu curso», junto al calendario y tu progreso. Tutoría queda como una asignatura más."], ["Más accesible en modo oscuro", "Mejor contraste en modo oscuro, revisado con pruebas automáticas que GitHub pasa en cada cambio."], ["Primera visita sin sustos", "Clarea ya no se recarga sola la primera vez que la abres (borraba lo que estabas escribiendo)."]]}, {"v": "1.3.1", "date": "2026-11-12", "title": "Todo en la nube", "items": [["Todo en la nube", "Proyectos y preguntas de examen se preparan en el servidor de Clarea por defecto: puedes cerrar la app y te avisa al terminar."], ["Avisos más limpios", "Con los avisos ya activados, la campana solo enseña tus notificaciones; se gestionan en Configuración."], ["Errores en español", "Si tu IA falla en la nube, Clarea te dice qué ha pasado y qué hacer."]]}, {"v": "1.3", "date": "2026-11-12", "title": "Avisos con la app cerrada", "items": [["Configuración", "Una página para elegir tu IA (Gemini, OpenRouter, Claude o ChatGPT), con su clave y su modelo. Se guarda en tu cuenta: igual en el móvil y en el ordenador."], ["Generar en la nube", "Actívalo en Configuración y podrás cerrar Clarea mientras se genera un proyecto: lo hace el servidor de Clarea y te avisa al móvil al terminar."], ["Preguntas de examen", "En cada asignatura, importa el .txt con las preguntas del profe: Clarea prepara la respuesta de cada una, sus conceptos clave y su dificultad, y te pone a prueba."], ["Estudia con tus resultados", "«Dónde fallas más» en los exámenes de práctica y tarjetas de repaso con el glosario."], ["Buscador", "Busca en asignaturas, profes, eventos, proyectos, archivos, conceptos y preguntas."], ["Comparte un repaso", "Un enlace para que tu clase vea las explicaciones y haga los exámenes de tu proyecto, sin cuenta."], ["Campana de notificaciones", "Arriba, entre el tema y tu perfil."], ["Si la IA está saturada", "Clarea cambia sola a otro modelo de la misma IA, te avisa, y nunca cambia de IA por su cuenta."], ["Avisos en el móvil", "Actívalos en la campana y Clarea te avisa el día antes y 30 minutos antes de cada entrega y examen, aunque esté cerrada. En iPhone, con Clarea instalada."], ["Generar con IA más rápido", "Con tu clave, el código se envía en partes mucho más grandes: muchas menos peticiones, así que tarda menos y gasta mucho menos uso gratis."], ["Mucho más uso gratis", "Con Gemini, Clarea usa ahora «Flash-Lite», que tiene unas 25 veces más uso gratis al día que «Flash»."], ["OpenRouter", "Una cuarta IA para generar: da acceso gratis a varios modelos, sin tarjeta."], ["Avisos de cada evento", "Al apuntar un evento eliges si quieres aviso y cuándo: el día antes, ese mismo día, 2 horas, 1 hora, 30 o 15 minutos antes."], ["Seguir con otro modelo", "Si un modelo de Gemini no tiene uso gratis o se ha gastado el de hoy, un botón cambia a otro y sigue donde se quedó."], ["Descargar mis datos", "En Mi cuenta: todo lo tuyo en un archivo, también como copia de seguridad."], ["Bienvenida", "Al empezar, unas pantallas cortas te enseñan qué puedes hacer con Clarea."], ["Abre antes", "El inicio ya no carga la parte de la IA hasta que la necesitas."]]}, {"v": "1.2", "date": "2026-11-12", "title": "Generación con IA más clara", "items": [["Detalles de la generación", "En «Tareas en segundo plano», toca la tarjeta de la IA para ver la IA y el modelo, cuándo empezó, cuántas partes van hechas y cuál está haciendo ahora."], ["Más espacio en el ordenador", "En pantallas grandes, el panel usa todo el ancho: sincronización a un lado, generación al otro y las partes en dos columnas."], ["Errores de Gemini claros", "Clarea distingue si Gemini está saturada, si has llegado al límite por minuto, si has gastado el uso gratis del día o si el modelo no tiene uso gratis, y te dice qué hacer."], ["Cuenta atrás real", "Cuando la IA tiene que esperar, ves los segundos que faltan para volver a intentarlo."]]}, {"v": "1.1", "date": "2026-11-12", "title": "Notificaciones, recordatorios e instalar", "items": [["Tareas en segundo plano", "Un apartado nuevo en el menú para ver lo que Clarea está haciendo: la sincronización y la generación con IA, parte por parte, con botón para pararla."], ["Notificaciones", "Los avisos de Clarea en un solo sitio, con los que no has leído marcados. Se guardan en tu cuenta, así que los ves en todos tus dispositivos."], ["Recordatorios", "Al abrir Clarea te avisa de las entregas y exámenes de hoy y de mañana."], ["Añadir a mi calendario", "Cada evento se puede guardar en el calendario del iPhone, de Google o de Outlook, con avisos el día antes que llegan aunque Clarea esté cerrada."], ["Instalar", "Un botón en el móvil para tener Clarea en la pantalla de inicio, con una guía para cada navegador."], ["Guía para la clave de IA", "Paso a paso para conseguir tu clave de Gemini, Claude o ChatGPT, y mensajes de error claros que dicen qué hacer."], ["Novedades", "Esta pantalla: lo nuevo de cada versión."], ["Más limpio", "El tema y tu perfil juntos en la barra de arriba, sin la barra flotante de la IA, y si borras un proyecto que se estaba generando, se cancela solo."]]}, {"v": "1.0", "date": "2026-11-12", "title": "Primera versión", "items": [["Cuentas", "Sincronización entre dispositivos y opción de recordar la sesión."], ["Clases", "DAW-2A y ASIX-2A (Jesuitas Clot) y 1.º DAW (La Salle), con su horario."], ["Hoy", "Las clases del día con hora de inicio y fin, entregas y exámenes."], ["Asignaturas", "Con sus profes, el horario y las faltas de asistencia."], ["Calendario", "Entregas y exámenes (práctico, teórico y de código), con notas, edición y aviso de horas ocupadas."], ["Proyectos", "Sube tu código (carpeta, .zip o GitHub) y Clarea te prepara un repaso: código explicado, historial de Git, glosario y exámenes, con tu propia IA."], ["App", "Se instala en el móvil, funciona sin conexión y tiene modo claro y oscuro."]]}];</script>
<title>Clarea Beta</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Clarea home: brand blue/orange from the Clarea identity; each subject keeps its own colour from the school timetable */
:root{
  --clarea-blue:#1f5fbf; --clarea-orange:#b4561b;
  --bg:#f6f7f9; --surface:#ffffff; --sunk:#eef1f5; --fg:#18202b; --muted:#5b6574; --line:#dfe3ea;
  --accent:#1f5fbf; --accent-ink:#1f5fbf; --accent-soft:#e6eefb;
  --ok:#1f7a3f; --ok-soft:#e3f3e8; --warn:#8a5a00; --warn-soft:#fdf1d8; --lim:#b4561b; --lim-soft:#fbe9dc; --err:#b3261e; --err-soft:#fbe7e5;
  --f:"Inter", -apple-system, "Segoe UI", Roboto, sans-serif; --mono:ui-monospace, Menlo, Consolas, monospace;
  --r:14px; --r-s:8px; --r-m:10px;
  --t-xs:12px; --t-s:13.5px; --t-m:15px; --t-l:17px; --t-xl:21px; --t-xxl:28px;
  --btn:#1f5fbf; --btn-fg:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --clarea-blue:#76a7f2; --clarea-orange:#e3925a;
  --bg:#12161c; --surface:#181d25; --sunk:#20262f; --fg:#e3e7ec; --muted:#9aa4b1; --line:#2a313b;
  --accent:#76a7f2; --accent-ink:#9cc0f6; --accent-soft:#1d2a3d;
  --ok:#5fcf86; --ok-soft:#173222; --warn:#f0c060; --warn-soft:#352a12; --lim:#f0995a; --lim-soft:#3a2516; --err:#ff8a80; --err-soft:#3b1b19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --clarea-blue:#76a7f2; --clarea-orange:#e3925a;
  --bg:#12161c; --surface:#181d25; --sunk:#20262f; --fg:#e3e7ec; --muted:#9aa4b1; --line:#2a313b;
  --accent:#76a7f2; --accent-ink:#9cc0f6; --accent-soft:#1d2a3d;
  --ok:#5fcf86; --ok-soft:#173222; --warn:#f0c060; --warn-soft:#352a12; --lim:#f0995a; --lim-soft:#3a2516; --err:#ff8a80; --err-soft:#3b1b19;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;background:var(--btn);color:var(--btn-fg);border-radius:var(--r-m);padding:12px 16px;font-weight:700;font-size:var(--t-m);cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.cbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.cbar .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.clogo{display:flex;align-items:center;text-decoration:none}
.clogo svg{height:28px;width:auto;display:block}
.clogo .lg-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .clogo .lg-light{display:none}:root:not([data-theme="light"]) .clogo .lg-dark{display:block}}
:root[data-theme="dark"] .clogo .lg-light{display:none}:root[data-theme="dark"] .clogo .lg-dark{display:block}

main .wrap{padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2{margin:0;line-height:1.15;text-wrap:balance}
.hello h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.hello p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.sect{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 -6px}
.back{align-self:flex-start;background:none;border:0;color:var(--accent-ink);font-weight:700;font-size:15px;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:6px}

/* today strip */
.today{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 0 10px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden}
.today h2{font-size:15px;font-weight:700;padding:0 14px;display:flex;justify-content:space-between;align-items:baseline}
.today h2 small{font-size:12px;font-weight:600;color:var(--muted)}
.tdlist{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;scroll-snap-type:x proximity;scroll-padding:0 14px;padding:0 14px 8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;cursor:grab}
.tdlist.drag{cursor:grabbing;scroll-snap-type:none}
.tdlist::-webkit-scrollbar{height:5px}
.tdlist::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.tdi{flex:none;border-radius:10px;padding:7px 10px;background:var(--sbg);color:var(--sfg);display:flex;flex-direction:column;gap:1px;min-width:78px;border:0;text-align:left;cursor:pointer;scroll-snap-align:start}
.tdi b{font-size:14px}.tdi small{font-size:11.5px;font-weight:600;opacity:.8}
.tdi.now{box-shadow:inset 0 0 0 3px var(--clarea-orange)}
.tdempty{color:var(--muted);font-size:14px;margin:0;padding:0 14px}

/* subject cards (like the lab cards) */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.sgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.sgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.scard{display:flex;flex-direction:column;gap:4px;text-align:left;border:0;border-radius:var(--r);padding:14px 14px 13px;background:var(--sbg);color:var(--sfg);cursor:pointer;min-height:108px;min-width:0;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.scard:active{transform:scale(.98)}
.scard b{font-size:21px;font-weight:800;letter-spacing:-.01em}
.scard span{font-size:13.5px;font-weight:500;line-height:1.3}
.scard .sprof{margin-top:auto;padding-top:4px;font-style:normal;font-size:12px;font-weight:700;line-height:1.3;opacity:.9}
.scard .sprof + em{margin-top:6px}
.scard em{margin-top:auto;font-style:normal;font-size:11.5px;font-weight:700;align-self:flex-start;border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.55);color:#18202b}

/* subject page */
.sban{border-radius:var(--r);padding:18px 16px;background:var(--sbg);color:var(--sfg);display:flex;flex-direction:column;gap:4px}
.sban b{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.sban span{font-size:15px;font-weight:500}
.lcard{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;color:var(--fg);text-decoration:none;min-width:0}
.lcard:hover{border-color:var(--accent)}
.lcard .lico{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--sunk)}
.lcard .lico svg{width:30px;height:30px}
.lcard .ltx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.lcard .ltx b{font-size:17px;font-weight:800}
.lcard .ltx span{font-size:13.5px;color:var(--muted)}
.lcard .lgo{flex:none;color:var(--muted);font-size:20px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--muted);font-size:14.5px}

/* timetable: fits a phone screen without scrolling */
.thead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.thead h1{font-size:22px;font-weight:800}
.thead span{font-size:13px;color:var(--muted)}
.tt{display:grid;grid-template-columns:38px repeat(5,minmax(0,1fr));grid-template-rows:auto repeat(3,minmax(54px,1fr)) 16px repeat(3,minmax(54px,1fr));gap:4px;height:min(560px,calc(100dvh - 205px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));min-height:440px}
.tt .dh{font-size:12px;font-weight:700;text-align:center;color:var(--muted);padding-bottom:2px}
.tt .dh.td{color:var(--clarea-orange)}
.tt .tm{font-size:10.5px;font-weight:600;color:var(--muted);text-align:right;padding-right:4px;line-height:1.15;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;justify-content:flex-start;padding-top:3px}
.tt .tm small{font-weight:500}
.tt .brk{grid-column:1/-1;display:flex;align-items:center;font-size:10px;font-weight:700;color:var(--muted);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.tt .brk span{width:38px;text-align:right;padding-right:4px}
.tt .cl{border:0;border-radius:8px;background:var(--sbg);color:var(--sfg);padding:5px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;cursor:pointer;min-width:0;overflow:hidden;position:relative}
.tt .cl b{font-size:13px;font-weight:800;line-height:1.1}
.tt .cl span{font-size:10.5px;font-weight:600;line-height:1.15;overflow-wrap:break-word}
.tt .cl small{font-size:9.5px;font-weight:600;line-height:1.1;margin-top:1px}
@media (min-width:600px){.tt .cl small{font-size:11px}}
.tt .cl.now{box-shadow:0 0 0 3px var(--clarea-orange)}
.tt .cl.now::after{content:"ahora";position:absolute;top:2px;right:3px;font-size:8.5px;font-weight:800;background:var(--clarea-orange);color:#fff;border-radius:4px;padding:0 3px}
.tt .fr{border-radius:8px;background:var(--sunk);opacity:.55}

/* ---------- screen transitions + small motion ---------- */
.pg{display:flex;flex-direction:column;align-items:stretch;gap:16px;min-width:0;width:100%}
/* Safari: give every block the full width explicitly instead of relying on flex stretch */
.pg>*{width:100%;max-width:100%;box-sizing:border-box}
.pg>.back{width:auto;align-self:flex-start}
@keyframes pg-in{from{opacity:0;transform:translateX(var(--dx,22px))}to{opacity:1;transform:none}}
@keyframes it-in{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sh-bg{from{opacity:0}to{opacity:1}}
@keyframes sh-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: no-preference){
  .pg.enter{animation:pg-in .3s cubic-bezier(.2,.8,.2,1) both}
  .pg.enter.rev{--dx:-22px}
  .pg.enter .scard,.pg.enter .tdi,.pg.enter .lcard,.pg.enter .tt .cl,.pg.enter .tt .fr,.pg.enter .fr2{animation:it-in .38s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 28ms + 60ms)}
  .sheetbg{animation:sh-bg .22s ease both}
  .sheetbg .sheet{animation:sh-up .3s cubic-bezier(.2,.8,.2,1) both}
  .sheetbg.closing{animation:sh-bg .22s ease reverse both}
  .sheetbg.closing .sheet{animation:sh-up .22s ease-in reverse both}
  .fbar i{transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .step input.bump{animation:bump .3s ease}
  .stchip{transition:background-color .3s ease,color .3s ease}
}
.noanim>:not(summary){animation:none!important}

/* ---------- tablet and PC: use the extra width ---------- */

  /* absences: summary fixed on the left, subjects on the right */
  .pg.v-faltas{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);grid-template-areas:"back back" "head head" "sum note" "sum list";gap:14px 22px;align-items:start}

.socgrp{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gc);border-radius:14px;overflow:hidden}
.socgh{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);background:none;border:0;padding:12px 14px;cursor:pointer}
.socgt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.socgt b{font-size:15.5px}.socgt small{font-size:13px;color:var(--muted)}
.socdot,.gfilter i{flex:none;width:12px;height:12px;border-radius:50%;background:var(--gc)}
.socgb{display:flex;flex-direction:column;gap:10px;padding:0 14px 14px}
.socpick{display:flex;flex-wrap:wrap;gap:6px}
.socpick button{font:inherit;font-size:14px;font-weight:700;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;min-height:36px}
.socpick button:hover:not(:disabled){border-color:var(--accent)}
.socpick button.on{border-color:var(--gc,var(--accent));background:color-mix(in srgb,var(--gc,var(--accent)) 16%,var(--surface))}
.socpick button:disabled{cursor:default}
.socfr{width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer}
@media (hover:hover) and (pointer:fine){.socfr:hover{border-color:var(--accent)}}
.socph{display:flex;align-items:center;gap:14px;margin-bottom:16px}.socph .socgt b{font-size:18px}
.socav.big{width:52px;height:52px;font-size:22px}
.socchip{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;border:1.5px solid var(--gc);border-radius:999px;padding:6px 12px}
.socnext{display:flex;flex-direction:column;gap:8px}
.socev{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-left:5px solid var(--gc);border-radius:12px;padding:8px 12px}
.socevd{flex:none;width:34px;display:flex;flex-direction:column;align-items:center;line-height:1.1}.socevd b{font-size:17px}.socevd small{font-size:12px;color:var(--muted)}
.pkbody .pkl{display:block;margin:14px 0 6px}
.gfilter{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.gfilter .pkl{margin-right:2px}
.gfme{font-size:13.5px;font-weight:700;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.gfilter button:not(.linkbtn){display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.gfilter button.on{color:var(--fg);border-style:solid;border-color:var(--gc)}
.gfilter button:not(.on) i{opacity:.35}
.gfnone{margin:0}
.evgrp{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;color:#fff;background:var(--gc)}
.evc.evcg{box-shadow:inset 3px 0 0 var(--gc)}

/* ===================== five tabs (Inicio · Estudiar · Agenda · Grupos · Yo) ===================== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:3px max(6px,env(safe-area-inset-left,0px)) calc(3px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
.tabbar button{flex:1;max-width:128px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font:inherit;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;position:relative;transition:color .2s ease}
.tabbar svg{width:25px;height:25px}
.tabbar .on{color:var(--accent-ink)}
.tabbar .tbdot{position:absolute;top:4px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#b4561b;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}
.tabbar .aibusy::after{content:"";position:absolute;top:5px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--clarea-orange,#b4561b);border:2px solid var(--surface)}
@media (hover:hover) and (pointer:fine){.tabbar button:hover{color:var(--fg)}.tabbar .on:hover{color:var(--accent-ink)}}
main .wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
body.notabs .tabbar{display:none}
body:has(.tabbar:not([hidden])) .updbar{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
body:has(.tabbar) .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body.notabs .toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
body.chatting .toast{bottom:calc(var(--tabs,0px) + 64px)}
body.chatting:has(.tabbar:not([hidden])) .updbar{bottom:calc(var(--tabs,0px) + 70px)}   /* notices go above the box to write, never over it */
/* back: the same «← Somewhere» everywhere, a little bigger */
.back{font-size:17px;padding:6px 0;gap:7px}
/* a tab's own title */
.ttl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.ttl h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
@media (min-width:1024px){.ttl h1{font-size:32px}}
/* segmented control (Tareas · Calendario · Horario, Chat · Fotos · Grupo) */
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-width:0;border:0;background:none;padding:9px 6px;border-radius:10px;font:inherit;font-weight:700;font-size:14.5px;color:var(--muted);cursor:pointer;transition:color .2s ease,background-color .2s ease}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (hover:hover) and (pointer:fine){.seg button:not(.on):hover{color:var(--fg)}}
/* lists of rows (Yo, Estudiar, Grupos) */
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;font:inherit;font-size:16px;font-weight:600;color:var(--fg);cursor:pointer;text-decoration:none;min-height:56px;transition:background-color .2s ease}
.mrow:first-child{border-top:0}
.mic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
.mic svg{width:19px;height:19px}
.mtx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow em{font-style:normal;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
.mrow .lgo{flex:none;color:var(--muted);font-size:20px}
.mrow.danger{color:var(--err)}.mrow.danger .mic{background:var(--err-soft);color:var(--err)}
.mbad{flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#b4561b;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
@media (hover:hover) and (pointer:fine){.mrow:hover{background:var(--sunk)}}
.mehead{display:flex;align-items:center;gap:14px}
.meav{width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--surface);font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.mehead h1{font-size:26px;font-weight:800}
.mehead p{margin:3px 0 0;color:var(--muted);font-size:14.5px}
.mefoot{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:13.5px;color:var(--muted);text-align:center}
.mefoot .linkbtn{color:var(--muted)}
.mefoot .linkbtn.del{color:var(--err)}
.mepage{max-width:520px}
.mepage .authtxt,.mepage p.mtxt{margin:0;font-size:15px;line-height:1.5}
/* ===================== tasks ===================== */
.tklist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 14px}
.tkr{display:flex;align-items:center;gap:12px;padding:8px 0}
.tkr+.tkr{border-top:1px solid var(--line)}
.tkck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);background:none;color:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background-color .2s ease,border-color .2s ease,color .2s ease}
.tkck svg{width:17px;height:17px}
.tkr.done .tkck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
@media (hover:hover) and (pointer:fine){.tkck:hover{border-color:var(--ok)}}
.tkt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;color:var(--fg);background:none;border:0;padding:4px 0;cursor:pointer}
.tkt b{font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.tkr.done .tkt b{text-decoration:line-through;color:var(--muted)}
.tkt small{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;color:var(--muted)}
.tksb{font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--sbg);color:var(--sfg)}
.tkgrp{font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:999px;color:#fff;background:var(--gc)}
.tklate{color:var(--err);font-weight:700}
.tkhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tkdone>summary{list-style:none;cursor:pointer;font-weight:700;color:var(--accent-ink);padding:6px 0;font-size:15.5px}
.tkdone>summary::-webkit-details-marker{display:none}
.tkdone[open]>summary{margin-bottom:8px}
.tkempty{text-align:center;padding:26px 16px;color:var(--muted);font-size:15px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.tkwhen{display:flex;gap:8px;align-items:center}
.tkwhen .pkb{flex:1}
.calday .tkdot{display:block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin:2px auto 0}
.plan .tkr{padding:4px 0}
.plan .tkr+.planr,.plan .planr+.tkr,.plan .tkr+.tkr{border-top:1px solid var(--line)}
/* ===================== groups: list, chat, photos ===================== */
.grow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gc);border-radius:14px;padding:13px 14px;width:100%;text-align:left;font:inherit;color:var(--fg);cursor:pointer;transition:border-color .2s ease}
.grow b{font-size:16.5px;display:block}
.grow small{font-size:13px;color:var(--muted)}
.grow span.gtx{flex:1;min-width:0}
@media (hover:hover) and (pointer:fine){.grow:hover{border-color:var(--accent);border-left-color:var(--gc)}}
.ghd{display:flex;align-items:center;gap:10px}
.ghd i{width:14px;height:14px;border-radius:50%;background:var(--gc);flex:none}
.ghd h1{font-size:24px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== the chat of Clarea (groups and friends), as in the style guide («El chat de Clarea» in CLAUDE.md) =====
   One screen from the header to the tabs, side to side: the chat's bar, the messages (they're what scrolls) and the box to write.
   The header doesn't move (auth.html: fixed, --hdr / --vvtop); the box sits on the tabs or, with the keyboard, on the keyboard (--kb). */
:root{--who0:#a2366a;--who1:#1f6f8b;--who2:#8a5300;--who3:#2e7d32;--who4:#6a3fb5;--who5:#b23c17;--who6:#00796b;--who7:#3949ab}   /* each person's colour (names and circles): AA on --surface */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--who0:#f28fb5;--who1:#6fc8e6;--who2:#f0b35a;--who3:#7fd17f;--who4:#b79cf2;--who5:#f39a7a;--who6:#5fd1c1;--who7:#9fa8f0}}
:root[data-theme="dark"]{--who0:#f28fb5;--who1:#6fc8e6;--who2:#f0b35a;--who3:#7fd17f;--who4:#b79cf2;--who5:#f39a7a;--who6:#5fd1c1;--who7:#9fa8f0}
html:has(body.chatting),body.chatting{overflow:hidden}
.chpane{position:fixed;left:0;right:0;top:calc(var(--hdr,58px) + var(--vvtop,0px));bottom:max(var(--tabs,0px),var(--kb,0px));z-index:18;background:var(--bg);display:flex;flex-direction:column}
.chhead{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(4px,env(safe-area-inset-left,0px))}
.chhead .hib{flex:none;width:44px;height:44px;border:0;border-radius:var(--r-m);background:none;color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.chhead .hib svg{width:22px;height:22px}
.chhead .hib.end{color:var(--fg)}
.chwho{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--fg);font:inherit;text-align:left;cursor:pointer;padding:2px 0}
.chwho>span:last-child{min-width:0;display:flex;flex-direction:column}
.chwho b{font-size:var(--t-m);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chwho small{font-size:var(--t-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover) and (pointer:fine){.chwho:hover b,.chhead .hib.end:hover{color:var(--accent-ink)}}
.chav{flex:none;width:36px;height:36px;border-radius:50%;background:var(--gc);color:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--t-m)}
.chav.g{color:#fff}
.chrow .chav{width:40px;height:40px}
.chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:2px;padding:12px max(16px,calc((100% - 820px) / 2))}
.chat::before{content:"";margin-top:auto}
.chat:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.chnote,.chday{align-self:center;text-align:center;font-size:var(--t-xs);color:var(--muted)}
.chnote{margin:0 0 8px}
.chday{font-weight:700;margin:12px 0 4px}
.chfirst{align-self:center;text-align:center;font-size:var(--t-m);color:var(--muted);margin:auto 0;padding:24px 0}
.chm{max-width:min(82%,540px);align-self:flex-start;background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:var(--r);border-bottom-left-radius:4px;padding:8px 12px;font-size:var(--t-m);line-height:1.45;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chm.me{align-self:flex-end;background:var(--accent-soft);border-color:var(--accent-soft);border-radius:var(--r);border-bottom-right-radius:4px}
.chm.first{margin-top:10px}
.chm .chu{display:block;font-size:var(--t-xs);font-weight:700;color:var(--nc,var(--accent-ink));margin-bottom:2px}
.chtx{overflow-wrap:anywhere;white-space:pre-wrap}
.cht{float:right;font-size:var(--t-xs);color:var(--muted);margin:6px 0 -2px 12px}
.chm.pic{padding:4px}
.chm.pic .chu,.chm.pic .chtx{padding:4px 8px 2px}
.chimg{position:relative;display:block;border:0;border-radius:var(--r-m);padding:0;background:var(--sunk);cursor:pointer;overflow:hidden;width:min(260px,64vw)}
.chimg img{display:block;width:100%;height:auto;min-height:80px;object-fit:cover}
.chtag{position:absolute;left:6px;top:6px;font-size:var(--t-xs);font-weight:800;border-radius:var(--r-s);padding:2px 8px;background:var(--ac);color:var(--ai,#141414)}
.chsheet{display:flex;flex-direction:column;gap:4px;white-space:normal}.chsheet small{font-size:var(--t-s);color:var(--muted)}.chsheet .btn2{align-self:flex-start;margin-top:4px;text-decoration:none}
.chq{border-left:3px solid var(--accent);background:var(--sunk);border-radius:var(--r-s);padding:6px 10px;margin:2px 0 6px;font-size:var(--t-s);color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chq b{display:block;color:var(--fg);font-size:var(--t-xs)}
.chcomp{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.chfield{flex:1;min-width:0;display:flex;align-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-m);padding-left:12px}
.chfield:focus-within{border-color:var(--accent)}
.chfield input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:none;border:0;padding:11px 0}
.chfield input:focus{outline:none}
.chfield .hib{flex:none;width:44px;height:44px;border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;border-radius:var(--r-m)}
.chfield .hib svg{width:22px;height:22px}
.chsend{flex:none;width:44px;height:44px;border:0;border-radius:var(--r-m);background:var(--btn);color:var(--btn-fg);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.chsend svg{width:22px;height:22px}
.chsend:disabled{opacity:.45;cursor:default}
@media (hover:hover) and (pointer:fine){.chfield .hib:hover{color:var(--fg)}}
.chrep{flex:1 0 100%;display:flex;align-items:center;gap:8px;border-left:3px solid var(--accent);background:var(--sunk);border-radius:var(--r-s);padding:6px 6px 6px 10px;font-size:var(--t-s);min-width:0}
.chrep span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.chrep b{display:block;color:var(--fg)}
.chrepx{flex:none;width:34px;height:34px;border:0;border-radius:var(--r-m);background:none;color:var(--fg);cursor:pointer;font-size:15px}
/* the list of chats: .mlist + .mrow, a 40 px circle, the name and the last message; on the right, when and the unread */
.chrow .chrt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chrow .chrt b{font-size:var(--t-m);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrow .chrt small{font-size:var(--t-s);font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrow .chre{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.chrow .chre time{font-size:var(--t-xs);font-weight:500;color:var(--muted)}
.chrow .chn{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--btn);color:var(--btn-fg);font-size:var(--t-xs);font-weight:800;display:flex;align-items:center;justify-content:center}
.gshgt{display:block;font-size:15px;margin:4px 0 2px}.gshg{margin:6px 0 14px}
.phimg{position:relative}
.phnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:26px;line-height:1;cursor:pointer;z-index:1}
.phnav.prev{left:10px}.phnav.next{right:10px}
.phnav[disabled]{opacity:.25;cursor:default}
.phn{font-size:12px;color:#c9d1db;margin-left:6px}
/* photo galleries */
.galsubs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.galsubs{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1024px){.galsubs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.galsubs .scard{min-height:92px}
.galsubs .scard em{font-style:normal;font-size:13px;font-weight:700;opacity:.85;margin-top:auto}
.albs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.albs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.alb{display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-top:6px solid var(--ac);border-radius:var(--r);padding:14px;min-height:92px;cursor:pointer;transition:border-color .2s ease}
.alb b{font-size:17px}.alb small{font-size:13.5px;color:var(--muted)}
.alb.add{border-style:dashed;border-top:1.5px dashed var(--line);align-items:center;justify-content:center;color:var(--accent-ink);font-weight:700}
@media (hover:hover) and (pointer:fine){.alb:hover{border-color:var(--accent);border-top-color:var(--ac)}.alb.add:hover{border-top-color:var(--accent)}}
.galgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
@media (min-width:640px){.galgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}}
@media (min-width:1024px){.galgrid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.galgrid button{aspect-ratio:1;border:0;padding:0;border-radius:8px;overflow:hidden;background:var(--sunk);cursor:pointer;position:relative;box-shadow:inset 0 -4px 0 var(--ac)}
.galgrid img{width:100%;height:100%;object-fit:cover;display:block}
.galbar{display:flex;align-items:center;justify-content:space-between;gap:10px}

<script>
/* header and tabs always visible: measure them (CSS --hdr / --tabs), and a tap on them closes whatever layer is open */
(function(){
  const LAYERS = ".sheetbg,.pkw,.welc,.srch,.phv,.chatw,.cdlg";
  function measure(){
    const h = document.querySelector(".cbar"), t = document.querySelector(".tabbar");
    const root = document.documentElement.style;
    const shown = el => !!el && el.getClientRects().length > 0;   // (offsetParent is null for fixed elements)
    root.setProperty("--hdr", (shown(h) ? h.offsetHeight : 0) + "px");
    root.setProperty("--tabs", (shown(t) ? t.offsetHeight : 0) + "px");
    // the iOS keyboard: how far the visible part has moved down, and how tall the keyboard is
    const vv = window.visualViewport;
    root.setProperty("--vvtop", (vv ? Math.max(0, Math.round(vv.offsetTop)) : 0) + "px");
    root.setProperty("--kb", (vv ? Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop)) : 0) + "px");
  }
  function start(){
    measure();
    if (window.ResizeObserver){ const ro = new ResizeObserver(measure); [".cbar", ".tabbar"].forEach(q => { const el = document.querySelector(q); if (el) ro.observe(el); }); }
    new MutationObserver(measure).observe(document.body, {attributes: true, attributeFilter: ["class"]});
    addEventListener("resize", measure); addEventListener("scroll", measure, {passive: true});
    if (window.visualViewport){ visualViewport.addEventListener("resize", measure); visualViewport.addEventListener("scroll", measure); }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
  document.addEventListener("click", e => {
    if (!e.target.closest(".tabbar a,.tabbar button,.cbar a,.cbar button")) return;
    document.querySelectorAll(LAYERS).forEach(w => {
      w.dispatchEvent(new KeyboardEvent("keydown", {key: "Escape", bubbles: true}));
      if (w.isConnected) w.remove();
    });
  }, true);
})();

function calc(r){
  const max = r.tot * 0.2, rest = max - r.f, pct = r.tot ? r.f / r.tot : 0;

  return {max, rest, pct, st, use: max ? Math.min(1, r.f / max) : 0};
}

const clsKey = c => c[0] + "-" + c[1] + "-" + c[3];
function lastDateOf(wd){ const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() - 1 - wd + 7) % 7)); return d; }
const missLog = () => (lget("clarea-faltas") || {}).log || {};
const missEntry = (date, c) => missLog()[date + "|" + clsKey(c)];
const isMissed = (date, c) => !!missEntry(date, c);
// on: true = missed the class, "late" = arrived late (half an hour); false = take back what was noted
function setMissed(date, c, on){
  const code = c[3], cur = faltas()[code], prev = missEntry(date, c); if (!cur || !!prev === !!on) return false;
  const late = on === "late", hh = on ? (late ? 0.5 : c[2]) : prev.h;
  saveFalta(code, {f: Math.max(0, Math.round((cur.f + (on ? hh : -hh)) * 2) / 2)});
  const st = lget("clarea-faltas"), log = st.log || {}, old = ymd(new Date(Date.now() - 200 * 864e5));
  Object.keys(log).forEach(k => { if (k.slice(0, 10) < old) delete log[k]; });
  if (on) log[date + "|" + clsKey(c)] = late ? {c: code, h: hh, late: 1} : {c: code, h: hh}; else delete log[date + "|" + clsKey(c)];
  st.log = log; st.t = Date.now(); lset("clarea-faltas", st);
  return true;
}
// the history in «Faltas»: take one absence back by its key, or put it back again (undo)
function setMissKey(key, entry){
  const st = lget("clarea-faltas") || {t:0, rows:{}}, log = st.log || {}, e = entry || log[key];
  if (!e || !!log[key] === !!entry) return;
  const cur = faltas()[e.c]; if (!cur) return;
  saveFalta(e.c, {f: Math.max(0, Math.round((cur.f + (entry ? e.h : -e.h)) * 2) / 2)});
  const s2 = lget("clarea-faltas"); s2.log = Object.assign({}, log); if (entry) s2.log[key] = e; else delete s2.log[key];
  s2.t = Date.now(); lset("clarea-faltas", s2);
}

    + 'Asignaturas del alumno (usa siempre el código):\n' + evSubjects().map(c => '- ' + c + ': ' + (SUBJ[c] ? SUBJ[c].n : '')).join('\n') + '\n'
    + 'Tipos: "entrega", "practico" (examen práctico), "teorico" (examen teórico), "codigo" (examen de código teórico), "codigoprac" (examen de código práctico). Si no se sabe qué examen es, "teorico".\n'
    + 'Fechas en AAAA-MM-DD; si no pone el año, el primero que encaje desde hoy. Horas en HH:MM, o vacío si no lo dice. En una entrega, "from" es la hora límite.\n'
    + 'Solo entregas y exámenes: nada de festivos, excursiones ni clases normales. No inventes nada.\n\n'
    + 'Responde solo con JSON, sin texto alrededor. Forma exacta:\n'
    + '{"events":[{"type":"entrega","subj":"PJ6","name":"nombre corto y claro, máximo 60 caracteres","date":"2026-11-20","from":"23:59","to":"","notes":"un detalle útil o vacío"}]}'
    + (text ? '\n\nTexto:\n' + text : '');
}
// what your AI (or Claude, or your chat) found → the list to review
function impSet(data){
  const S = (v, n) => String(v == null ? "" : v).trim().slice(0, n), hm = v => { const m = S(v, 5).match(/^(\d{1,2}):(\d\d)$/); return m && +m[1] < 24 ? m[1].padStart(2, "0") + ":" + m[2] : ""; };
  const subs = evSubjects(), today = ymd(new Date()), raw = data && Array.isArray(data.events) ? data.events : []; let other = 0;
  const list = raw.slice(0, 40).map(x => {
    const type = EVT_LOOK[x && x.type] ? x.type : "teorico", subj = S(x && x.subj, 12).toUpperCase().replace(/\s/g, ""), date = /^\d{4}-\d\d-\d\d$/.test(S(x && x.date, 10)) ? S(x.date, 10) : "";
    if (!date || !subs.includes(subj)){ other++; return null; }
    let from = hm(x.from), to = hm(x.to), warn = "";
    if (type === "entrega"){ from = from || "23:59"; to = from; }
    else { const cl = classOn(subj, date);
      if (!from && cl){ from = cl.from; to = cl.to; }
      else if (!from){ from = "09:00"; to = "10:00"; warn = "No dice la hora: revísala"; }
      if (!to || to <= from) to = cl && cl.from === from ? cl.to : String(Math.min(23, +from.slice(0, 2) + 1)).padStart(2, "0") + from.slice(2); }
    const name = S(x.name, 80) || (EVT_TYPES.find(t => t[0] === type) || ["", "Evento"])[1] + " " + subj;
    const dup = allEvents().some(e => e.date === date && e.subj === subj && e.type === type), past = date < today;
    return {on: !dup && !past, dup, past, warn, ev: {type, subj, name, date, from, to, notes: S(x.notes, 300)}};
  }).filter(Boolean);
  if (!list.length){ IMP.busy = false; IMP.msg = {err: true, t: other ? "Tu IA ha encontrado fechas, pero no de tus asignaturas." : "Tu IA no ha encontrado entregas ni exámenes. Prueba con otro texto o con una foto más clara."}; return render(); }
  IMP.list = list.sort((a, b) => sortEv(a.ev, b.ev)); IMP.other = other; IMP.busy = false; IMP.msg = null; render();
}

const impText = () => { const f = document.getElementById("impf"); if (f) IMP.text = f.imptext.value; return IMP.text.trim(); };
async function impRead(){
  if (IMP.busy) return; const text = impText(); if (!text && !IMP.files.length) return;
  const fail = t => { IMP.busy = false; IMP.msg = {err: true, t}; render(); };
  try { if (!window.CLAI) await window.clareaLib(); } catch (e) { return fail("No se ha podido cargar Clarea IA. ¿Hay internet?"); }
  const C = window.CLAI;
  if (!C.ready()){ C.welcomeOnce(); return fail('Primero elige tu IA en <a href="configuracion" data-go="#/configuracion">Configuración</a>: Gemini (gratis) o tu cuenta de Claude.'); }
  IMP.busy = true; IMP.ctrl = new AbortController(); IMP.msg = {t: "Tu IA (" + esc(C.modelNow()) + ") está leyendo…"}; render();
  try {
    const out = await C.callSmart(impPrompt(text), true, {files: IMP.files.slice(), signal: IMP.ctrl.signal,
      onWait: w => { IMP.msg = {t: w ? "Tu IA está saturada: lo intento otra vez en " + w + " s…" : "Tu IA está leyendo…"}; render(); },
      onSwitch: (m, was) => { IMP.msg = {t: "«" + esc(was) + "» estaba saturado: sigo con «" + esc(m) + "»…"}; render(); }});
    impSet(C.parseJSON(out));
  } catch (e) {
    if (e && e.aborted){ IMP.busy = false; IMP.msg = {t: "Cancelado."}; return render(); }
    const m = String(e && e.message || e);
    fail(esc(C.errEs(m) || m) + (e && e.retry ? " Mientras tanto, puedes hacerlo con tu chat de IA (abajo)." : ""));
  }
}

// while the dates wait in Claude, Clarea looks every few seconds and shows them to review
function impWatch(){
  clearInterval(impWatch.t);
  const tick = async () => {
    if (route() !== "calendario/importar" || document.visibilityState !== "visible" || !window.CLAI || !lget("clarea-mcpt-cal") || impWatch.busy) return;
    impWatch.busy = true;
    try {
      const st = await window.CLAI.mcpCollect("cal", (p, data) => { if (!data || !Array.isArray(data.events)) throw new Error("x"); impSet(data); });
      if (st.gone || st.done){ try { localStorage.removeItem(ukey("clarea-mcpt-cal")); } catch (x) {} if (st.done) window.CLAI.mcpDrop("cal"); render(); }
    } catch (x) {} finally { impWatch.busy = false; }
  };
  impWatch.t = setInterval(tick, 5000); setTimeout(tick, 1200);
}

function openPicker(title, body, onMount){

    const w = document.createElement("div"); w.className = "pkw";
    w.innerHTML = '<div class="pkp" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="pkh"><b>' + esc(title) + '</b><button type="button" class="pkx" aria-label="Cerrar">✕</button></div><div class="pkbody">' + body + '</div></div>';
    const done = v => { document.removeEventListener("keydown", key); w.classList.add("closing"); setTimeout(() => w.remove(), 170); resolve(v); };
    const key = e => { if (e.key === "Escape") done(null); };
    w.addEventListener("click", e => { if (e.target === w || e.target.closest(".pkx")) done(null); });
    document.addEventListener("keydown", key);
    document.body.appendChild(w);
    if (onMount) onMount(w, done);

function parseQuestions(text){
  const out = []; let title = "";
  String(text || "").replace(/\r/g, "").split("\n").forEach(line => {
    const t = line.trim(); if (!t) return;
    const m = t.match(/^(\d{1,3})\s*[.)\-:º]?\s*(.*)$/);
    if (m && (m[2] || "").trim()){ out.push({n: out.length + 1, q: m[2].trim()}); return; }
    if (m) return;                                                         // «21.» with nothing after it
    if (!out.length){ if (!title) title = t; return; }
    out[out.length - 1].q += " " + t;
  });
  // text after the question mark is a hint from the teacher («…? DESACOPLAR LA LÓGICA…»)
  // (only if that text is not a second question, like «…WEB? E INCONVENIENTS?»)
  out.forEach(q => { const i = q.q.lastIndexOf("?"), rest = i > 0 ? q.q.slice(i + 1).trim() : ""; if (rest.length >= 8){ q.hint = rest; q.q = q.q.slice(0, i + 1).trim(); } });

}

    return Object.assign({}, t, {id, tid: t.id, grp: g.id, gname: g.name, gcolor: g.color, done: gd[id] || null}); })));

const sortTk = (a, b) => (a.date || "9999") < (b.date || "9999") ? -1 : (a.date || "9999") > (b.date || "9999") ? 1 : (a.created || 0) - (b.created || 0);

   + (k ? '<div class="kv"><div><small>Faltas</small><b>'+num(F.f)+' h</b></div><div><small>Máximo</small><b>'+num(k.max)+' h</b></div><div><small>Estado</small><b>'+STL[k.st]+'</b></div></div>'
        + (miss ? '<p class="smiss">Ya apuntaste que '+(miss.late ? 'llegaste tarde' : 'faltaste')+' '+whenTxt+' ('+num(miss.h)+' h).</p><button class="btn2" data-smiss="0">Quitar esa falta</button>'
                : noClass(date) ? '<p class="smiss">'+(ago === 0 ? 'Hoy' : 'Ese día')+' no hay clase: lo marcaste como día sin clase.</p>'
                : '<div class="qa sqa"><button class="btn" data-smiss="1">Falté '+whenTxt+' ('+c[2]+' h)</button><button class="btn2" data-smiss="late">Llegué tarde (0,5 h)</button></div>')
        : '')
   + '</div>';
  const close = ()=>{ bg.classList.add("closing"); setTimeout(()=>bg.remove(), 230); };
  bg.addEventListener("click", e=>{
    if (e.target === bg || e.target.closest("[data-close]")) { close(); return; }
    const a = e.target.closest("[data-smiss]");
    if (a){ const v = a.dataset.smiss, on = v === "1" ? true : v === "late" ? "late" : false, before = stOf(code), was = missEntry(date, c);
      setMissed(date, c, on); close(); render();
      const msg = on === "late" ? "Retraso apuntado: 0,5 h en "+code+"." : on ? "Falta apuntada: "+c[2]+" h en "+code+"." : "Falta quitada en "+code+".";
      toastUndo(msg + (on ? limitWarn(code, before) : ""), () => { setMissed(date, c, on ? false : (was && was.late ? "late" : true)); render(); }); }
  });
  document.body.appendChild(bg);
}

/* clicks + edits */

  const g = e.target.closest("[data-go]"); if (g){ e.preventDefault(); go(g.dataset.go); return; }
  const gp = e.target.closest("[data-grp]"); if (gp){ pickGroup(gp.dataset.grp); return; }
