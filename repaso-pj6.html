<script>window.CLAREA_PUSH = {"url": "https://clarea-push.clarea.workers.dev", "key": "BFCmDhDzeeA-zo1OtcQMSYSlz-834PqEqDw1G3gEE9n1m90HRgG58GyISyHnzk8o87jduHTpFlCGP3Xu3YDW2cQ"}; window.CLAREA_VERSION = "20261113003344"; window.CLAREA_RELEASE = "1.6"; window.CLAREA_BETA = true; window.CLAREA_CHANGES = [{"v": "1.6", "date": "", "title": "Clarea, más ordenada", "items": [["Cinco pestañas abajo", "Inicio, Estudiar, Agenda, Grupos y Yo. Inicio solo tiene lo de hoy; lo demás está en su pestaña."], ["Tareas y deberes", "En Agenda → Tareas: apúntalas con asignatura y fecha, y márcalas como hechas. Las de hoy salen en «Para hoy» y en el calendario."], ["Chat de grupo", "Cada grupo tiene su chat. Al enviar una foto, Clarea te pregunta de qué asignatura es y sale marcada con ella."], ["Fotos por asignatura", "En cada grupo, y en Yo → Mi galería: eliges la asignatura y dentro tienes Exámenes, Apuntes, Ejercicios… Puedes crear tus propios tipos, con nombre y color."], ["Tareas de grupo", "Apunta una tarea en un grupo y la verán todos. Cada uno marca la suya como hecha."], ["Tu perfil, en una página", "Yo reúne tu cuenta, la sincronización, la configuración y el tema. Sin menús ni ventanas encima."], ["Avisos de amigos y grupos", "Te llega un aviso al móvil cuando alguien te manda una solicitud, acepta la tuya, te añade a un grupo o apunta algo en su calendario. Se pueden apagar en Grupos → Amigos."], ["Los exámenes del grupo te avisan", "Las entregas y exámenes de tus grupos te avisan el día antes y 30 minutos antes, aunque no hayas abierto Clarea desde que los apuntaron."], ["El perfil de tus amigos", "Toca a un amigo para ver los grupos que compartís y lo próximo en ellos, crear un grupo juntos o quitarlo."], ["Elige tu IA", "La primera vez, Clarea te deja elegir: Gemini (gratis, se hace solo) o tu cuenta de Claude (sin clave). Lo puedes cambiar en Configuración."], ["Pestaña ✦ IA más clara", "Dos caminos: «Generar» con Gemini o «Enviar a Claude». Copiar y pegar en tu chat sigue ahí, plegado en «Otras formas»."], ["Aviso cuando Claude termina", "Si tienes los avisos activados, te llega un aviso al móvil cuando Claude acaba lo que le enviaste."], ["«Falté a esta clase»", "Toca una clase en Inicio o en el Horario y pulsa «Falté hoy»: Clarea suma sus horas a tus faltas. No se cuenta dos veces, y puedes deshacerlo al momento o quitarla luego. En Inicio, esa clase pone «Faltaste»."], ["Horario y faltas en cada asignatura", "En la página de cada asignatura, un bloque plegado te dice qué días y a qué hora toca, con qué profe y en qué aula, y cuántas horas de falta te quedan."], ["Tus faltas, día a día", "En Faltas, cada asignatura enseña los días que faltaste. Si te equivocaste, quita una con «Quitar»."], ["Aviso antes del límite", "Al apuntar una falta, si te acercas al límite de esa asignatura, Clarea te avisa de cuántas horas te quedan."], ["Faltas en el Horario", "Las clases a las que faltaste esta semana ponen «Faltaste» también en el Horario."], ["«Llegué tarde»", "En la hoja de cada clase, junto a «Falté», «Llegué tarde» apunta media hora. En Inicio y en el Horario pone «Tarde»."], ["Ahora y siguiente", "En Inicio, encima de tus clases de hoy: en qué clase estás y hasta cuándo, o cuál es la siguiente y en qué aula."], ["¿Faltaste hoy?", "Al acabar tu última clase, un aviso en el móvil para apuntar si faltaste o llegaste tarde. Se apaga en Configuración → Avisos."], ["Edita tus preguntas de examen", "En «Preguntas», pulsa «Editar preguntas» para corregir lo que se leyó mal, quitar las que sobran o añadir nuevas. Con clave de Gemini, las nuevas se preparan solas."], ["Tu IA te corrige al practicar", "En «Ponte a prueba», si escribes tu respuesta, tu IA te pone nota y te dice qué falta. El botón que propone sale marcado."], ["Repasa desde «Para hoy»", "Toca «Repasa X preguntas» en el inicio y empiezas la ronda directamente."], ["La IA prepara todo sola", "Con clave de Gemini ya no hace falta pulsar «Preparar» ni «Generar»: al importar preguntas, editarlas o crear un proyecto, tu IA empieza sola. Si pulsas «Parar», espera a que se lo pidas."], ["Añade preguntas desde fotos o PDF", "En «Editar preguntas», «Desde fotos o PDF»: tu IA las lee y las deja listas para revisar."], ["Tu última nota, a la vista", "Cada pregunta enseña la última nota que te puso tu IA (al practicar o en un simulacro), para ver cuáles flojean."], ["Clarea en tu calendario", "En el calendario, toca «Suscríbete»: tus entregas y exámenes (y los de tus grupos) salen solos en el calendario del iPhone o en Google Calendar, y se actualizan cuando cambias algo."], ["Los avisos que eliges, en todas partes", "Los avisos de cada evento (el día antes, 30 minutos antes…) son ahora los mismos en el móvil, dentro de Clarea y al añadir el evento a tu calendario."], ["Avisos de estudio", "El domingo a las 20:00, lo que tienes esa semana. Y la tarde antes de un examen, cuántas preguntas te quedan por repasar, con el repaso a un toque. Se quitan en Configuración."], ["Hoja compartida al día", "Si guardaste en Notas la hoja que te pasó un compañero y él la cambia, Clarea te avisa: «Hay una versión nueva». Un toque y la tienes, sin perder tus notas."], ["Actualiza el código de un proyecto", "¿Has cambiado tu proyecto? En sus ajustes (⚙), «Actualizar el código»: súbelo otra vez (GitHub, .zip o carpeta). Solo se vuelven a explicar los archivos que cambian."], ["Repasa tus fallos", "En Exámenes, «Repasar mis fallos» te pone solo las preguntas que fallaste. Cuando aciertas una, deja de salir. Y en las tarjetas salen primero los conceptos de esas preguntas."], ["Compartir sin tus claves", "Al compartir un proyecto, Clarea busca contraseñas y claves en tu código y las tapa con •••. Te enseña dónde estaban."], ["Mi progreso, más claro", "Ahora te lo dice con frases, por ejemplo: «Te sabes 12 de 38 preguntas»."], ["Entregada o por entregar", "En cada entrega, toca «Ya la he entregado»: se queda en el calendario marcada como entregada y ya no te avisa. Las que faltan pone «Por entregar»."], ["Importa fechas con tu IA", "En el calendario, «Impórtalas con tu IA»: pega el mensaje del profe o haz una foto, y tu IA saca las entregas y los exámenes. Tú marcas cuáles guardar."], ["Vista de semana", "En el calendario, elige «Semana»: cada día con sus clases, entregas y exámenes, más cómodo en el móvil."], ["Enlace para unirse a un grupo", "En un grupo → Grupo, «Invitar con un enlace»: quien lo abre entra en el grupo sin ser antes amigo de todos. Dura 14 días."], ["Silenciar un grupo", "En un grupo → Grupo → Avisos, apaga los avisos de ese grupo (chat, tareas y cambios del calendario). Sus exámenes te siguen avisando."], ["Quitar a alguien del grupo", "Quien creó el grupo puede quitar a un miembro desde Grupo → Miembros."], ["Por entregar y ya entregadas", "En la Agenda, «Por entregar» te pone todas las entregas que te faltan, también las que se te pasaron. Las entregadas quedan plegadas en «Ya entregadas»."], ["¿La entregaste?", "Si pasa la hora de una entrega y no la has marcado, Clarea te lo pregunta (a la mañana siguiente si era de noche)."], ["Importa fechas a un grupo", "Al importar fechas con tu IA, elige si van a tu calendario o al de un grupo, para que las vean todos."], ["Al actualizar, se guarda más", "Si un archivo cambia solo un poco, se guardan las explicaciones de lo que no cambió: la IA solo explica lo nuevo."], ["Examen de un archivo", "Abre un archivo en Código y toca «Examen de este archivo»: un test corto solo con sus preguntas."], ["Qué hay de nuevo en un repaso compartido", "Si vuelves a abrir un repaso que te pasaron y ha cambiado, Clarea te dice qué es nuevo y marca los archivos."]]}, {"v": "1.5", "date": "2026-11-12", "title": "Amigos y grupos", "items": [["Amigos en Clarea", "Añade amigos de tres formas: por su nombre de usuario (y aceptan), con su código de amigo o con un enlace de invitación. Está en el menú de tu perfil → «Amigos y grupos»."], ["Grupos con calendario compartido", "Crea un grupo con tus amigos: lo que apunte uno en el calendario del grupo, lo veis todos. Sale en tu calendario con el nombre y el color del grupo, y puedes ocultarlo cuando quieras."], ["Explicado fácil", "En el glosario de tus proyectos, cada concepto tiene ahora «Explicado fácil» y «Explicado técnico»."]]}, {"v": "1.4.4", "date": "2026-11-12", "title": "Claude, paso a paso", "items": [["Sin escribir nada en Claude", "«Enviar a Claude» abre Claude (la app si la tienes; si no, la web) con el mensaje ya escrito: solo pulsas enviar. Antes, un aviso que puedes quitar con «No volver a preguntar»."], ["Pregúntale a Claude", "En «Pregúntale a tu IA», con Claude conectado, tu pregunta se abre en Claude ya escrita y con tu código o tu pregunta de examen delante. Claude te responde allí, y la respuesta llega también a Clarea."], ["Solo Gemini como clave", "Para que todo se haga solo, Clarea usa ahora una única IA con clave: Gemini, gratis. Claude se usa con tu cuenta, con el conector."], ["Ves cómo va Claude", "Al enviar algo a Claude, Clarea te enseña cada paso: enviado, Claude lo ha abierto, cuántas partes lleva guardadas y cuánto le queda. Si Claude no empieza, te dice qué revisar."], ["Cómo se usa", "En Configuración, debajo del conector, los pasos para añadirlo en Claude y para usarlo."]]}, {"v": "1.4.3", "date": "2026-11-12", "title": "Claude con tu cuenta", "items": [["Conecta Claude con Clarea", "¿Usas Claude (gratis, Pro o Max)? En Configuración, conecta Clarea con Claude una vez. Luego toca «Enviar a Claude» en un proyecto, unas preguntas o Notas, y en Claude escribe «Prepara lo que tengo pendiente en Clarea»: Claude lo hace con tu cuenta y lo guarda en Clarea solo. Sin clave, sin copiar y pegar y sin saturaciones."], ["Si tu IA está saturada, cambia de modelo", "Al leer la hoja de Notas o tus fotos de preguntas, si el modelo está saturado Clarea lo reintenta una vez y sigue con otro modelo de tu misma IA (nunca cambia de IA). Te dice cuál usa en cada momento."], ["Cancelar", "Mientras tu IA lee, puedes cancelar."], ["Notas con tu chat de IA", "¿IA saturada o tienes Claude Pro o ChatGPT? Copia un mensaje, pégalo en tu chat (con las fotos o el PDF si los tienes) y pega aquí lo que responda."]]}, {"v": "1.4.2", "date": "2026-11-12", "title": "Para hoy y comparte cómo se evalúa", "items": [["Con tu chat de IA, en un solo mensaje", "¿Tienes Claude Pro, ChatGPT Plus o Gemini? Copia un solo mensaje, pégalo en tu chat y pega aquí su respuesta. Si se corta, dile «sigue» y pega lo nuevo: Clarea guarda cada parte y te dice lo que falta."], ["Para hoy", "En Inicio, lo que toca hoy: las entregas de hoy y mañana, el próximo examen con lo que necesitas sacar, y las preguntas que te toca repasar."], ["Avisos con lo que necesitas", "El aviso de un examen te dice también qué media necesitas en lo que falta para aprobar (o para tu objetivo)."], ["Comparte la hoja de Notas", "Crea un enlace con cómo se evalúa una asignatura (actividades, porcentajes y criterios) para tu clase. Tus notas no se comparten, y quien lo abre lo guarda en sus Notas con un toque."], ["Notas, en su sitio", "Las Notas de cada asignatura se abren desde el apartado «Notas»: ya no aparecen dentro de cada asignatura."], ["El nombre del evento, ya escrito", "Al elegir asignatura y tipo, el nombre («Examen teórico SM7») ya queda escrito. Puedes cambiarlo; si pones uno tuyo, Clarea no lo toca."], ["«Hoy» más fino", "«Desliza» solo sale cuando las clases no caben, y la clase de ahora y los exámenes ya no se ven más grandes que las demás."]]}, {"v": "1.4.1", "date": "2026-11-12", "title": "Tus notas, en todas partes", "items": [["La nota en el calendario", "Cuando apuntas la nota de un examen o una entrega, se ve ese día en el calendario, y en el detalle pone «Sacaste un 7,5» con la actividad de tus Notas."], ["Notas en el buscador", "Busca una actividad («A12», «examen 2»…) y Clarea te lleva a tus Notas."], ["Añade cómo se evalúa", "Si una asignatura tiene exámenes en el calendario y aún no tiene Notas, su página te lo recuerda."]]}, {"v": "1.4", "date": "2026-11-12", "title": "Notas, simulacros y tu IA en un chat", "items": [["Simulacro de examen", "Con las preguntas del profe: preguntas al azar, por escrito y con tiempo si quieres. Al entregar, tu IA lo corrige y te pone nota."], ["Pregúntale a tu IA", "Un chat dentro de cada proyecto y de cada pregunta de examen: pregunta lo que no entiendas y tu IA responde con tu código o con esa pregunta delante."], ["Notas", "Pega el enlace, el PDF o unas fotos de cómo se evalúa cada asignatura y tu IA saca las actividades con su porcentaje. Pon tus notas y Clarea te dice cuánto llevas y qué media necesitas en lo que falta para aprobar o para tu objetivo. También tienes, para consultar, la nota por fases, los criterios, cómo se recupera y los módulos."], ["Mi progreso", "Cómo vas en cada asignatura: preguntas dominadas, notas de simulacros y exámenes, los próximos exámenes con los días que faltan y un botón para repasar cada uno."], ["¿Qué has sacado?", "Cuando pasa un examen o una entrega del calendario, Clarea te pregunta la nota y la apunta en la actividad que toca de tus Notas."], ["¿Y si saco…?", "En Notas, pon notas imaginarias en lo que te falta y mira al momento cómo quedaría tu nota final."], ["Faltas en tus Notas", "Si la asignatura pide un mínimo de asistencia, Notas te avisa cuando tus faltas se acercan al límite."], ["Pregúntale a tu IA sobre tus notas", "Un chat en Notas con la hoja de evaluación y tus notas delante: «¿cuánto necesito en el próximo examen para un 7?»."], ["Chuleta para imprimir", "En tus preguntas de examen: todas con su respuesta corta, sus conceptos clave y el glosario de tus proyectos, en dos columnas para imprimir o guardar en PDF."], ["Atajos en el icono", "Con Clarea instalada, mantén pulsado su icono para ir directo a Notas, Calendario o Mi progreso."], ["Preguntas desde fotos o PDF", "Haz fotos a las preguntas del profe o sube el PDF: tu IA las pasa a texto y tú solo las revisas antes de guardarlas."], ["Comparte tus preguntas", "Crea un enlace para que tu clase estudie tus preguntas con sus explicaciones, sin cuenta ni clave de IA. Quien tenga cuenta puede guardarlas en su Clarea."], ["Avisos que no tapan", "Los avisos de abajo ya no tapan lo último de la página, y «Sincroniza tu cuenta» se cierra para siempre con la X."], ["Todo en Tareas", "«Tareas en segundo plano» enseña también las preguntas de examen que se preparan en la nube."], ["Configuración en Mi cuenta", "La Configuración (tu IA, sus claves, la nube y los avisos) está ahora dentro de Mi cuenta."], ["Horario y faltas, a mano", "El horario y las faltas de asistencia salen directamente en el inicio, en «Tu curso», junto al calendario y tu progreso. Tutoría queda como una asignatura más."], ["Más accesible en modo oscuro", "Mejor contraste en modo oscuro, revisado con pruebas automáticas que GitHub pasa en cada cambio."], ["Primera visita sin sustos", "Clarea ya no se recarga sola la primera vez que la abres (borraba lo que estabas escribiendo)."]]}, {"v": "1.3.1", "date": "2026-11-12", "title": "Todo en la nube", "items": [["Todo en la nube", "Proyectos y preguntas de examen se preparan en el servidor de Clarea por defecto: puedes cerrar la app y te avisa al terminar."], ["Avisos más limpios", "Con los avisos ya activados, la campana solo enseña tus notificaciones; se gestionan en Configuración."], ["Errores en español", "Si tu IA falla en la nube, Clarea te dice qué ha pasado y qué hacer."]]}, {"v": "1.3", "date": "2026-11-12", "title": "Avisos con la app cerrada", "items": [["Configuración", "Una página para elegir tu IA (Gemini, OpenRouter, Claude o ChatGPT), con su clave y su modelo. Se guarda en tu cuenta: igual en el móvil y en el ordenador."], ["Generar en la nube", "Actívalo en Configuración y podrás cerrar Clarea mientras se genera un proyecto: lo hace el servidor de Clarea y te avisa al móvil al terminar."], ["Preguntas de examen", "En cada asignatura, importa el .txt con las preguntas del profe: Clarea prepara la respuesta de cada una, sus conceptos clave y su dificultad, y te pone a prueba."], ["Estudia con tus resultados", "«Dónde fallas más» en los exámenes de práctica y tarjetas de repaso con el glosario."], ["Buscador", "Busca en asignaturas, profes, eventos, proyectos, archivos, conceptos y preguntas."], ["Comparte un repaso", "Un enlace para que tu clase vea las explicaciones y haga los exámenes de tu proyecto, sin cuenta."], ["Campana de notificaciones", "Arriba, entre el tema y tu perfil."], ["Si la IA está saturada", "Clarea cambia sola a otro modelo de la misma IA, te avisa, y nunca cambia de IA por su cuenta."], ["Avisos en el móvil", "Actívalos en la campana y Clarea te avisa el día antes y 30 minutos antes de cada entrega y examen, aunque esté cerrada. En iPhone, con Clarea instalada."], ["Generar con IA más rápido", "Con tu clave, el código se envía en partes mucho más grandes: muchas menos peticiones, así que tarda menos y gasta mucho menos uso gratis."], ["Mucho más uso gratis", "Con Gemini, Clarea usa ahora «Flash-Lite», que tiene unas 25 veces más uso gratis al día que «Flash»."], ["OpenRouter", "Una cuarta IA para generar: da acceso gratis a varios modelos, sin tarjeta."], ["Avisos de cada evento", "Al apuntar un evento eliges si quieres aviso y cuándo: el día antes, ese mismo día, 2 horas, 1 hora, 30 o 15 minutos antes."], ["Seguir con otro modelo", "Si un modelo de Gemini no tiene uso gratis o se ha gastado el de hoy, un botón cambia a otro y sigue donde se quedó."], ["Descargar mis datos", "En Mi cuenta: todo lo tuyo en un archivo, también como copia de seguridad."], ["Bienvenida", "Al empezar, unas pantallas cortas te enseñan qué puedes hacer con Clarea."], ["Abre antes", "El inicio ya no carga la parte de la IA hasta que la necesitas."]]}, {"v": "1.2", "date": "2026-11-12", "title": "Generación con IA más clara", "items": [["Detalles de la generación", "En «Tareas en segundo plano», toca la tarjeta de la IA para ver la IA y el modelo, cuándo empezó, cuántas partes van hechas y cuál está haciendo ahora."], ["Más espacio en el ordenador", "En pantallas grandes, el panel usa todo el ancho: sincronización a un lado, generación al otro y las partes en dos columnas."], ["Errores de Gemini claros", "Clarea distingue si Gemini está saturada, si has llegado al límite por minuto, si has gastado el uso gratis del día o si el modelo no tiene uso gratis, y te dice qué hacer."], ["Cuenta atrás real", "Cuando la IA tiene que esperar, ves los segundos que faltan para volver a intentarlo."]]}, {"v": "1.1", "date": "2026-11-12", "title": "Notificaciones, recordatorios e instalar", "items": [["Tareas en segundo plano", "Un apartado nuevo en el menú para ver lo que Clarea está haciendo: la sincronización y la generación con IA, parte por parte, con botón para pararla."], ["Notificaciones", "Los avisos de Clarea en un solo sitio, con los que no has leído marcados. Se guardan en tu cuenta, así que los ves en todos tus dispositivos."], ["Recordatorios", "Al abrir Clarea te avisa de las entregas y exámenes de hoy y de mañana."], ["Añadir a mi calendario", "Cada evento se puede guardar en el calendario del iPhone, de Google o de Outlook, con avisos el día antes que llegan aunque Clarea esté cerrada."], ["Instalar", "Un botón en el móvil para tener Clarea en la pantalla de inicio, con una guía para cada navegador."], ["Guía para la clave de IA", "Paso a paso para conseguir tu clave de Gemini, Claude o ChatGPT, y mensajes de error claros que dicen qué hacer."], ["Novedades", "Esta pantalla: lo nuevo de cada versión."], ["Más limpio", "El tema y tu perfil juntos en la barra de arriba, sin la barra flotante de la IA, y si borras un proyecto que se estaba generando, se cancela solo."]]}, {"v": "1.0", "date": "2026-11-12", "title": "Primera versión", "items": [["Cuentas", "Sincronización entre dispositivos y opción de recordar la sesión."], ["Clases", "DAW-2A y ASIX-2A (Jesuitas Clot) y 1.º DAW (La Salle), con su horario."], ["Hoy", "Las clases del día con hora de inicio y fin, entregas y exámenes."], ["Asignaturas", "Con sus profes, el horario y las faltas de asistencia."], ["Calendario", "Entregas y exámenes (práctico, teórico y de código), con notas, edición y aviso de horas ocupadas."], ["Proyectos", "Sube tu código (carpeta, .zip o GitHub) y Clarea te prepara un repaso: código explicado, historial de Git, glosario y exámenes, con tu propia IA."], ["App", "Se instala en el móvil, funciona sin conexión y tiene modo claro y oscuro."]]}];</script>

<style>
.clogo{display:inline-flex;align-items:center;gap:6px}
