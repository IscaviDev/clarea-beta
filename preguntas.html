<script>window.CLAREA_PUSH = {"url": "https://clarea-push.clarea.workers.dev", "key": "BFCmDhDzeeA-zo1OtcQMSYSlz-834PqEqDw1G3gEE9n1m90HRgG58GyISyHnzk8o87jduHTpFlCGP3Xu3YDW2cQ"}; window.CLAREA_VERSION = "20261113133729"; window.CLAREA_RELEASE = "1.6.5"; window.CLAREA_BETA = true; window.CLAREA_CHANGES = [{"v": "1.6.5", "date": "", "title": "Lo nuevo", "items": [["Ya no se cierra solo", "Mientras lees una pregunta, un proyecto o cualquier parte de Clarea, lo que tienes abierto sigue abierto y no te mueve de sitio, aunque llegue algo de tu otro dispositivo o la IA termine otra parte."]]}, {"v": "1.6.4", "date": "2026-11-13", "title": "Proyectos y preguntas para cualquier curso", "items": [["Proyectos con PDF, Word o apuntes", "Al crear un proyecto, elige «Documentos»: tu memoria, un trabajo o tus apuntes. La IA los explica por partes y te prepara el glosario y los exámenes."], ["Ensaya la defensa", "En Exámenes, «Ensayar la defensa»: tu IA te pregunta como un tribunal, una pregunta cada vez, y te dice qué está bien, qué falta y una nota."], ["Modo examen real", "En un examen de práctica, «Empezar en modo examen»: con tiempo límite y sin pausas. Al acabarse el tiempo, se corrige solo."], ["Tu IA sabe qué estudias", "Al preparar, corregir o leer las fotos de tus preguntas, tu IA tiene en cuenta tu curso y tu asignatura, sea cual sea."], ["Escucha la respuesta", "En cada pregunta, «Escuchar» te lee en voz alta la respuesta de examen: para repasar andando o en el bus."], ["Tarjetas rápidas", "En «Ponte a prueba», «Tarjetas rápidas»: ves la pregunta, tocas para ver la respuesta corta y pasas a la siguiente. Las que no sabes vuelven al final."]]}, {"v": "1.6.3", "date": "2026-11-13", "title": "El chat, arreglado", "items": [["El chat, bien puesto en el iPhone", "Ya no flota con un hueco negro arriba: va de la cabecera a las pestañas, y la caja para escribir y el botón de enviar se ven siempre."], ["Se nota que es un chat", "Fondo propio, tus mensajes en azul de Clarea y, si aún no hay mensajes, un aviso claro para saludar."]]}, {"v": "1.6.2", "date": "2026-11-13", "title": "El chat, a la manera de Clarea", "items": [["La cabecera no se mueve", "Arriba, Clarea se queda quieta: ya no rebota al deslizar ni salta al abrir el teclado en el iPhone."], ["El chat ocupa toda la pantalla", "Entre la barra de arriba y las pestañas, sin huecos. Al abrir el teclado no se mueve nada: solo suben los mensajes."], ["El chat, con el aspecto de Clarea", "Los mensajes, la lista de chats y la caja de escribir tienen los colores, la letra y los botones de Clarea, en claro y en oscuro."]]}, {"v": "1.6.1", "date": "2026-11-13", "title": "Chat con amigos y sin pedirte la sesión", "items": [["Dentro, no te pide nada", "Estando en Clarea, abrir un proyecto, unas preguntas o un aviso ya no te pide la contraseña ni Face ID."], ["«Recordarme» funciona siempre", "Con «Recordarme», abres Clarea y entras directamente, también si tienes Face ID activado."], ["Face ID, solo si quieres", "Face ID ya no te bloquea al abrir ni al volver. Sirve para volver a entrar sin escribir la contraseña si cierras sesión."], ["Arriba y abajo, siempre", "La cabecera de Clarea y las cinco pestañas se ven en todas las pantallas: en el chat, en las fotos, en Proyectos, en Preguntas y en Privacidad. Toca una pestaña y vas, aunque tengas algo abierto."], ["Cambia tu usuario", "En Yo → «Contraseña», cambia tu nombre de usuario sin perder nada: tu progreso, amigos y grupos siguen igual."], ["Un chat con cada amigo", "Escríbele a un amigo como en WhatsApp: mensajes, fotos con su asignatura, responder y la hoja de Notas. Entra desde su perfil («Enviar mensaje») o con «+ Nuevo» en Grupos."], ["Todos tus chats juntos", "En Grupos, los chats de tus grupos y de tus amigos, el más reciente arriba, con el último mensaje y los que no has leído."], ["Siempre a mano", "Dentro de un chat se siguen viendo la barra de arriba y las pestañas de abajo."]]}, {"v": "1.6", "date": "2026-11-13", "title": "Clarea, más ordenada", "items": [["Cinco pestañas abajo", "Inicio, Estudiar, Agenda, Grupos y Yo. Inicio solo tiene lo de hoy; lo demás está en su pestaña."], ["Más ordenada por dentro", "Todos los botones, letras y colores siguen la misma guía. Al pasar el ratón, solo cambia el color, y el idioma de las respuestas se elige con dos botones."], ["Proyectos y Preguntas, como el resto", "Ahora tienen los colores y la letra de Clarea, y las pestañas de abajo."], ["Tareas y deberes", "En Agenda → Tareas: apúntalas con asignatura y fecha, y márcalas como hechas. Las de hoy salen en Inicio («Por hacer») y en el calendario."], ["Un solo «Hoy» en Inicio", "Arriba tus clases y, debajo, «Por hacer»: tareas, entregas, exámenes cercanos y preguntas para repasar. Nada sale dos veces."], ["Chat de grupo", "Cada grupo tiene su chat. Al enviar una foto, Clarea te pregunta de qué asignatura es y sale marcada con ella."], ["Fotos por asignatura", "En cada grupo, y en Yo → Mi galería: eliges la asignatura y dentro tienes Exámenes, Apuntes, Ejercicios… Puedes crear tus propios tipos, con nombre y color."], ["Tareas de grupo", "Apunta una tarea en un grupo y la verán todos. Cada uno marca la suya como hecha."], ["Mensajes sin leer", "Un número en la pestaña Grupos y en cada grupo te dice cuántos mensajes no has visto."], ["Guarda fotos del grupo", "Abre una foto de un grupo y toca «Guardar en Mi galería»: se guarda en tus fotos, en su asignatura y su tipo."], ["Responder en el chat", "Mantén pulsado un mensaje y toca «Responder»: tu respuesta sale con el mensaje citado encima."], ["Una tarea desde el chat", "Mantén pulsado un mensaje y toca «Crear una tarea»: se apunta en el grupo, con su texto y, si es una foto, su asignatura."], ["Pasa las fotos", "Con una foto abierta, desliza a los lados para ver la anterior y la siguiente del mismo tipo."], ["Tu perfil, en una página", "Yo reúne tu cuenta, la sincronización, la configuración y el tema. Sin menús ni ventanas encima."], ["Avisos de amigos y grupos", "Te llega un aviso al móvil cuando alguien te manda una solicitud, acepta la tuya, te añade a un grupo o apunta algo en su calendario. Se pueden apagar en Grupos → Amigos."], ["Los exámenes del grupo te avisan", "Las entregas y exámenes de tus grupos te avisan el día antes y 30 minutos antes, aunque no hayas abierto Clarea desde que los apuntaron."], ["El perfil de tus amigos", "Toca a un amigo para ver los grupos que compartís y lo próximo en ellos, crear un grupo juntos o quitarlo."], ["Elige tu IA", "La primera vez, Clarea te deja elegir: Gemini (gratis, se hace solo) o tu cuenta de Claude (sin clave). Lo puedes cambiar en Configuración."], ["Pestaña ✦ IA más clara", "Dos caminos: «Generar» con Gemini o «Enviar a Claude». Copiar y pegar en tu chat sigue ahí, plegado en «Otras formas»."], ["Aviso cuando Claude termina", "Si tienes los avisos activados, te llega un aviso al móvil cuando Claude acaba lo que le enviaste."], ["Claude, en «Por hacer»", "Lo que le envías a Claude sale en Inicio, en «Por hacer», con cuántas partes lleva. Cuando termina, tócalo para verlo."], ["Todo a Claude de una vez", "¿Usas Claude? En Inicio, «Enviar a Claude lo pendiente» le manda en un solo mensaje todos tus proyectos y preguntas por preparar."], ["Guarda lo que te explica tu IA", "En «Pregúntale a tu IA», toca «Guardar para repasar»: la pregunta y la respuesta van a «Mis dudas» de esa asignatura y salen al repasar."], ["Cuánto Gemini gratis te queda", "En Yo → Configuración ves cuántas peticiones gratis de Gemini te quedan hoy (es una cuenta aproximada). Si no llegan para lo que falta, Clarea te avisa antes."], ["«Falté a esta clase»", "Toca una clase en Inicio o en el Horario y pulsa «Falté hoy»: Clarea suma sus horas a tus faltas. No se cuenta dos veces, y puedes deshacerlo al momento o quitarla luego. En Inicio, esa clase pone «Faltaste»."], ["Horario y faltas en cada asignatura", "En la página de cada asignatura, un bloque plegado te dice qué días y a qué hora toca, con qué profe y en qué aula, y cuántas horas de falta te quedan."], ["Tus faltas, día a día", "En Faltas, cada asignatura enseña los días que faltaste. Si te equivocaste, quita una con «Quitar»."], ["Aviso antes del límite", "Al apuntar una falta, si te acercas al límite de esa asignatura, Clarea te avisa de cuántas horas te quedan."], ["Faltas en el Horario", "Las clases a las que faltaste esta semana ponen «Faltaste» también en el Horario."], ["«Llegué tarde»", "En la hoja de cada clase, junto a «Falté», «Llegué tarde» apunta media hora. En Inicio y en el Horario pone «Tarde»."], ["Ahora y siguiente", "En Inicio, encima de tus clases de hoy: en qué clase estás y hasta cuándo, o cuál es la siguiente y en qué aula."], ["¿Faltaste hoy?", "Al acabar tu última clase, un aviso en el móvil para apuntar si faltaste o llegaste tarde. Se apaga en Configuración → Avisos."], ["Días sin clase", "En Agenda → Horario, guarda festivos y vacaciones. Esos días no salen clases en Inicio, no te llega «¿Faltaste hoy?» y no se apuntan faltas."], ["Tus faltas del domingo", "El aviso del domingo a las 20:00 te dice cuántas horas faltaste esa semana y en qué asignatura estás más cerca del límite."], ["Edita tus preguntas de examen", "En «Preguntas», pulsa «Editar preguntas» para corregir lo que se leyó mal, quitar las que sobran o añadir nuevas. Con clave de Gemini, las nuevas se preparan solas."], ["Tu IA te corrige al practicar", "En «Ponte a prueba», si escribes tu respuesta, tu IA te pone nota y te dice qué falta. El botón que propone sale marcado."], ["Repasa desde «Por hacer»", "Toca «Repasa X preguntas» en el inicio y empiezas la ronda directamente."], ["La IA prepara todo sola", "Con clave de Gemini ya no hace falta pulsar «Preparar» ni «Generar»: al importar preguntas, editarlas o crear un proyecto, tu IA empieza sola. Si pulsas «Parar», espera a que se lo pidas."], ["Añade preguntas desde fotos o PDF", "En «Editar preguntas», «Desde fotos o PDF»: tu IA las lee y las deja listas para revisar."], ["Tu última nota, a la vista", "Cada pregunta enseña la última nota que te puso tu IA (al practicar o en un simulacro), para ver cuáles flojean."], ["Simulacro con las que flojean", "En Simulacro, elige «Las que flojean»: salen primero las preguntas con nota baja de tu IA o las que aún no te sabes."], ["Responde hablando", "En «Ponte a prueba» y en Simulacro, pulsa «Dictar» y di tu respuesta: se escribe sola, como en un oral."], ["Clarea en tu calendario", "En el calendario, toca «Suscríbete»: tus entregas y exámenes (y los de tus grupos) salen solos en el calendario del iPhone o en Google Calendar, y se actualizan cuando cambias algo."], ["Los avisos que eliges, en todas partes", "Los avisos de cada evento (el día antes, 30 minutos antes…) son ahora los mismos en el móvil, dentro de Clarea y al añadir el evento a tu calendario."], ["Avisos de estudio", "El domingo a las 20:00, lo que tienes esa semana. Y la tarde antes de un examen, cuántas preguntas te quedan por repasar, con el repaso a un toque. Se quitan en Configuración."], ["Hoja compartida al día", "Si guardaste en Notas la hoja que te pasó un compañero y él la cambia, Clarea te avisa: «Hay una versión nueva». Un toque y la tienes, sin perder tus notas."], ["Actualiza el código de un proyecto", "¿Has cambiado tu proyecto? En sus ajustes (⚙), «Actualizar el código»: súbelo otra vez (GitHub, .zip o carpeta). Solo se vuelven a explicar los archivos que cambian."], ["Repasa tus fallos", "En Exámenes, «Repasar mis fallos» te pone solo las preguntas que fallaste. Cuando aciertas una, deja de salir. Y en las tarjetas salen primero los conceptos de esas preguntas."], ["Compartir sin tus claves", "Al compartir un proyecto, Clarea busca contraseñas y claves en tu código y las tapa con •••. Te enseña dónde estaban."], ["Mi progreso, más claro", "Ahora te lo dice con frases, por ejemplo: «Te sabes 12 de 38 preguntas»."], ["Entregada o por entregar", "En cada entrega, toca «Ya la he entregado»: se queda en el calendario marcada como entregada y ya no te avisa. Las que faltan pone «Por entregar»."], ["Importa fechas con tu IA", "En el calendario, «Impórtalas con tu IA»: pega el mensaje del profe o haz una foto, y tu IA saca las entregas y los exámenes. Tú marcas cuáles guardar."], ["Vista de semana", "En el calendario, elige «Semana»: cada día con sus clases, entregas y exámenes, más cómodo en el móvil."], ["Enlace para unirse a un grupo", "En un grupo → Grupo, «Invitar con un enlace»: quien lo abre entra en el grupo sin ser antes amigo de todos. Dura 14 días."], ["Silenciar un grupo", "En un grupo → Grupo → Avisos, apaga los avisos de ese grupo (chat, tareas y cambios del calendario). Sus exámenes te siguen avisando."], ["Quitar a alguien del grupo", "Quien creó el grupo puede quitar a un miembro desde Grupo → Miembros."], ["El chat, como WhatsApp", "Burbujas verdes (las tuyas) y blancas, el nombre de cada uno en su color, la hora en cada mensaje y la barra de escribir abajo. Toca el nombre del grupo para ver su información."], ["Por entregar y ya entregadas", "En la Agenda, «Por entregar» te pone todas las entregas que te faltan, también las que se te pasaron. Las entregadas quedan plegadas en «Ya entregadas»."], ["¿La entregaste?", "Si pasa la hora de una entrega y no la has marcado, Clarea te lo pregunta (a la mañana siguiente si era de noche)."], ["Importa fechas a un grupo", "Al importar fechas con tu IA, elige si van a tu calendario o al de un grupo, para que las vean todos."], ["Al actualizar, se guarda más", "Si un archivo cambia solo un poco, se guardan las explicaciones de lo que no cambió: la IA solo explica lo nuevo."], ["Examen de un archivo", "Abre un archivo en Código y toca «Examen de este archivo»: un test corto solo con sus preguntas."], ["Qué hay de nuevo en un repaso compartido", "Si vuelves a abrir un repaso que te pasaron y ha cambiado, Clarea te dice qué es nuevo y marca los archivos."], ["Cambia tu contraseña", "En Yo → «Contraseña». En tus otros dispositivos tendrás que entrar con la nueva."], ["Código de recuperación", "Crea un código y guárdalo. Si olvidas la contraseña, en la pantalla de entrada toca «¿Has olvidado la contraseña?» y pon una nueva con él."], ["Más protección en tu dispositivo", "La copia de tu contraseña que guarda el móvil para entrar sin internet ahora es mucho más difícil de adivinar."], ["Borrar la cuenta lo borra todo", "Al eliminar tu cuenta también se borran tus amigos, grupos y código. En tus otros dispositivos la sesión se cierra sola."], ["Face ID", "En Yo → «Contraseña», activa Face ID: te lo pide al abrir Clarea en ese móvil y al volver tras más de 5 minutos fuera, por si alguien lo coge."], ["Cerrar sesión en los demás", "¿Entraste en un ordenador del instituto? En Yo → «Contraseña», cierra tu cuenta en todos tus otros dispositivos a la vez."], ["Privacidad al día", "La página de Privacidad explica ahora todo lo que guarda Clarea, también amigos, grupos y Claude."], ["Examen unido a su actividad", "Al apuntar un examen o una entrega, elige a qué actividad de tus Notas corresponde. Cuando Clarea te pregunte qué has sacado, solo pones la nota."], ["La hoja de Notas, a tu grupo", "En «Compartir con tu clase», toca uno de tus grupos: la hoja llega a su chat y tus compañeros la guardan en sus Notas con un toque. Tus notas no se comparten."], ["¿Qué has sacado?", "Al día siguiente de un examen, a las 18:00, te llega un aviso para apuntar la nota. Al tocarlo, te la pide y va directa a tus Notas."], ["Tus avisos por defecto", "En Configuración → Avisos, elige qué avisos llevan tus eventos nuevos (por ejemplo, el día antes y 1 hora antes). También vale para los de tus grupos."], ["La hoja de Notas, en la nube", "Con tu clave de Gemini, Clarea lee la hoja de evaluación en la nube: puedes cerrar Clarea y te avisa al terminar. Se guarda sola en tus Notas."], ["Tarjetas de un archivo", "Abre un archivo en Código y toca «Tarjetas»: repasas solo los conceptos que salen en él."], ["Código nuevo en GitHub", "Si tu proyecto está en GitHub y subes commits nuevos, Clarea te avisa en Código y lo actualizas con un toque."], ["Más fácil de leer en oscuro", "En el chat «Pregúntale a tu IA», tus mensajes, quién responde (Claude o Gemini) y el botón «Abrir Claude» se leen mejor en modo oscuro."], ["Papelera", "¿Borraste algo sin querer? Eventos, tareas, proyectos, preguntas y notas se quedan 30 días en Yo → «Papelera», en todos tus dispositivos. Un toque en «Recuperar» y vuelve."], ["Tus dispositivos", "En Yo → «Contraseña», ves dónde tienes tu cuenta abierta (por ejemplo «Windows · Chrome · hace 5 min») y puedes cerrar uno solo."], ["Sincroniza al instante", "Con Clarea abierta en el móvil y en el PC, lo que cambias en uno aparece en el otro en unos segundos."], ["Aviso de nuevo inicio", "Si alguien entra en tu cuenta desde un dispositivo nuevo, te avisa en tus otros dispositivos (y en el móvil, si tienes los avisos activados)."], ["Copia cada semana", "Clarea guarda sola una copia de todo cada semana (las 4 últimas). En Yo → «Copias» eliges una fecha y todo vuelve como estaba."], ["¿Está todo subido?", "Si ves un punto naranja arriba, hay cambios que aún no están en tus otros dispositivos (o no hay internet). Tócalo para saber qué pasa."]]}, {"v": "1.5", "date": "2026-11-12", "title": "Amigos y grupos", "items": [["Amigos en Clarea", "Añade amigos de tres formas: por su nombre de usuario (y aceptan), con su código de amigo o con un enlace de invitación. Está en el menú de tu perfil → «Amigos y grupos»."], ["Grupos con calendario compartido", "Crea un grupo con tus amigos: lo que apunte uno en el calendario del grupo, lo veis todos. Sale en tu calendario con el nombre y el color del grupo, y puedes ocultarlo cuando quieras."], ["Explicado fácil", "En el glosario de tus proyectos, cada concepto tiene ahora «Explicado fácil» y «Explicado técnico»."]]}, {"v": "1.4.4", "date": "2026-11-12", "title": "Claude, paso a paso", "items": [["Sin escribir nada en Claude", "«Enviar a Claude» abre Claude (la app si la tienes; si no, la web) con el mensaje ya escrito: solo pulsas enviar. Antes, un aviso que puedes quitar con «No volver a preguntar»."], ["Pregúntale a Claude", "En «Pregúntale a tu IA», con Claude conectado, tu pregunta se abre en Claude ya escrita y con tu código o tu pregunta de examen delante. Claude te responde allí, y la respuesta llega también a Clarea."], ["Solo Gemini como clave", "Para que todo se haga solo, Clarea usa ahora una única IA con clave: Gemini, gratis. Claude se usa con tu cuenta, con el conector."], ["Ves cómo va Claude", "Al enviar algo a Claude, Clarea te enseña cada paso: enviado, Claude lo ha abierto, cuántas partes lleva guardadas y cuánto le queda. Si Claude no empieza, te dice qué revisar."], ["Cómo se usa", "En Configuración, debajo del conector, los pasos para añadirlo en Claude y para usarlo."]]}, {"v": "1.4.3", "date": "2026-11-12", "title": "Claude con tu cuenta", "items": [["Conecta Claude con Clarea", "¿Usas Claude (gratis, Pro o Max)? En Configuración, conecta Clarea con Claude una vez. Luego toca «Enviar a Claude» en un proyecto, unas preguntas o Notas, y en Claude escribe «Prepara lo que tengo pendiente en Clarea»: Claude lo hace con tu cuenta y lo guarda en Clarea solo. Sin clave, sin copiar y pegar y sin saturaciones."], ["Si tu IA está saturada, cambia de modelo", "Al leer la hoja de Notas o tus fotos de preguntas, si el modelo está saturado Clarea lo reintenta una vez y sigue con otro modelo de tu misma IA (nunca cambia de IA). Te dice cuál usa en cada momento."], ["Cancelar", "Mientras tu IA lee, puedes cancelar."], ["Notas con tu chat de IA", "¿IA saturada o tienes Claude Pro o ChatGPT? Copia un mensaje, pégalo en tu chat (con las fotos o el PDF si los tienes) y pega aquí lo que responda."]]}, {"v": "1.4.2", "date": "2026-11-12", "title": "Para hoy y comparte cómo se evalúa", "items": [["Con tu chat de IA, en un solo mensaje", "¿Tienes Claude Pro, ChatGPT Plus o Gemini? Copia un solo mensaje, pégalo en tu chat y pega aquí su respuesta. Si se corta, dile «sigue» y pega lo nuevo: Clarea guarda cada parte y te dice lo que falta."], ["Para hoy", "En Inicio, lo que toca hoy: las entregas de hoy y mañana, el próximo examen con lo que necesitas sacar, y las preguntas que te toca repasar."], ["Avisos con lo que necesitas", "El aviso de un examen te dice también qué media necesitas en lo que falta para aprobar (o para tu objetivo)."], ["Comparte la hoja de Notas", "Crea un enlace con cómo se evalúa una asignatura (actividades, porcentajes y criterios) para tu clase. Tus notas no se comparten, y quien lo abre lo guarda en sus Notas con un toque."], ["Notas, en su sitio", "Las Notas de cada asignatura se abren desde el apartado «Notas»: ya no aparecen dentro de cada asignatura."], ["El nombre del evento, ya escrito", "Al elegir asignatura y tipo, el nombre («Examen teórico SM7») ya queda escrito. Puedes cambiarlo; si pones uno tuyo, Clarea no lo toca."], ["«Hoy» más fino", "«Desliza» solo sale cuando las clases no caben, y la clase de ahora y los exámenes ya no se ven más grandes que las demás."]]}, {"v": "1.4.1", "date": "2026-11-12", "title": "Tus notas, en todas partes", "items": [["La nota en el calendario", "Cuando apuntas la nota de un examen o una entrega, se ve ese día en el calendario, y en el detalle pone «Sacaste un 7,5» con la actividad de tus Notas."], ["Notas en el buscador", "Busca una actividad («A12», «examen 2»…) y Clarea te lleva a tus Notas."], ["Añade cómo se evalúa", "Si una asignatura tiene exámenes en el calendario y aún no tiene Notas, su página te lo recuerda."]]}, {"v": "1.4", "date": "2026-11-12", "title": "Notas, simulacros y tu IA en un chat", "items": [["Simulacro de examen", "Con las preguntas del profe: preguntas al azar, por escrito y con tiempo si quieres. Al entregar, tu IA lo corrige y te pone nota."], ["Pregúntale a tu IA", "Un chat dentro de cada proyecto y de cada pregunta de examen: pregunta lo que no entiendas y tu IA responde con tu código o con esa pregunta delante."], ["Notas", "Pega el enlace, el PDF o unas fotos de cómo se evalúa cada asignatura y tu IA saca las actividades con su porcentaje. Pon tus notas y Clarea te dice cuánto llevas y qué media necesitas en lo que falta para aprobar o para tu objetivo. También tienes, para consultar, la nota por fases, los criterios, cómo se recupera y los módulos."], ["Mi progreso", "Cómo vas en cada asignatura: preguntas dominadas, notas de simulacros y exámenes, los próximos exámenes con los días que faltan y un botón para repasar cada uno."], ["¿Qué has sacado?", "Cuando pasa un examen o una entrega del calendario, Clarea te pregunta la nota y la apunta en la actividad que toca de tus Notas."], ["¿Y si saco…?", "En Notas, pon notas imaginarias en lo que te falta y mira al momento cómo quedaría tu nota final."], ["Faltas en tus Notas", "Si la asignatura pide un mínimo de asistencia, Notas te avisa cuando tus faltas se acercan al límite."], ["Pregúntale a tu IA sobre tus notas", "Un chat en Notas con la hoja de evaluación y tus notas delante: «¿cuánto necesito en el próximo examen para un 7?»."], ["Chuleta para imprimir", "En tus preguntas de examen: todas con su respuesta corta, sus conceptos clave y el glosario de tus proyectos, en dos columnas para imprimir o guardar en PDF."], ["Atajos en el icono", "Con Clarea instalada, mantén pulsado su icono para ir directo a Notas, Calendario o Mi progreso."], ["Preguntas desde fotos o PDF", "Haz fotos a las preguntas del profe o sube el PDF: tu IA las pasa a texto y tú solo las revisas antes de guardarlas."], ["Comparte tus preguntas", "Crea un enlace para que tu clase estudie tus preguntas con sus explicaciones, sin cuenta ni clave de IA. Quien tenga cuenta puede guardarlas en su Clarea."], ["Avisos que no tapan", "Los avisos de abajo ya no tapan lo último de la página, y «Sincroniza tu cuenta» se cierra para siempre con la X."], ["Todo en Tareas", "«Tareas en segundo plano» enseña también las preguntas de examen que se preparan en la nube."], ["Configuración en Mi cuenta", "La Configuración (tu IA, sus claves, la nube y los avisos) está ahora dentro de Mi cuenta."], ["Horario y faltas, a mano", "El horario y las faltas de asistencia salen directamente en el inicio, en «Tu curso», junto al calendario y tu progreso. Tutoría queda como una asignatura más."], ["Más accesible en modo oscuro", "Mejor contraste en modo oscuro, revisado con pruebas automáticas que GitHub pasa en cada cambio."], ["Primera visita sin sustos", "Clarea ya no se recarga sola la primera vez que la abres (borraba lo que estabas escribiendo)."]]}, {"v": "1.3.1", "date": "2026-11-12", "title": "Todo en la nube", "items": [["Todo en la nube", "Proyectos y preguntas de examen se preparan en el servidor de Clarea por defecto: puedes cerrar la app y te avisa al terminar."], ["Avisos más limpios", "Con los avisos ya activados, la campana solo enseña tus notificaciones; se gestionan en Configuración."], ["Errores en español", "Si tu IA falla en la nube, Clarea te dice qué ha pasado y qué hacer."]]}, {"v": "1.3", "date": "2026-11-12", "title": "Avisos con la app cerrada", "items": [["Configuración", "Una página para elegir tu IA (Gemini, OpenRouter, Claude o ChatGPT), con su clave y su modelo. Se guarda en tu cuenta: igual en el móvil y en el ordenador."], ["Generar en la nube", "Actívalo en Configuración y podrás cerrar Clarea mientras se genera un proyecto: lo hace el servidor de Clarea y te avisa al móvil al terminar."], ["Preguntas de examen", "En cada asignatura, importa el .txt con las preguntas del profe: Clarea prepara la respuesta de cada una, sus conceptos clave y su dificultad, y te pone a prueba."], ["Estudia con tus resultados", "«Dónde fallas más» en los exámenes de práctica y tarjetas de repaso con el glosario."], ["Buscador", "Busca en asignaturas, profes, eventos, proyectos, archivos, conceptos y preguntas."], ["Comparte un repaso", "Un enlace para que tu clase vea las explicaciones y haga los exámenes de tu proyecto, sin cuenta."], ["Campana de notificaciones", "Arriba, entre el tema y tu perfil."], ["Si la IA está saturada", "Clarea cambia sola a otro modelo de la misma IA, te avisa, y nunca cambia de IA por su cuenta."], ["Avisos en el móvil", "Actívalos en la campana y Clarea te avisa el día antes y 30 minutos antes de cada entrega y examen, aunque esté cerrada. En iPhone, con Clarea instalada."], ["Generar con IA más rápido", "Con tu clave, el código se envía en partes mucho más grandes: muchas menos peticiones, así que tarda menos y gasta mucho menos uso gratis."], ["Mucho más uso gratis", "Con Gemini, Clarea usa ahora «Flash-Lite», que tiene unas 25 veces más uso gratis al día que «Flash»."], ["OpenRouter", "Una cuarta IA para generar: da acceso gratis a varios modelos, sin tarjeta."], ["Avisos de cada evento", "Al apuntar un evento eliges si quieres aviso y cuándo: el día antes, ese mismo día, 2 horas, 1 hora, 30 o 15 minutos antes."], ["Seguir con otro modelo", "Si un modelo de Gemini no tiene uso gratis o se ha gastado el de hoy, un botón cambia a otro y sigue donde se quedó."], ["Descargar mis datos", "En Mi cuenta: todo lo tuyo en un archivo, también como copia de seguridad."], ["Bienvenida", "Al empezar, unas pantallas cortas te enseñan qué puedes hacer con Clarea."], ["Abre antes", "El inicio ya no carga la parte de la IA hasta que la necesitas."]]}, {"v": "1.2", "date": "2026-11-12", "title": "Generación con IA más clara", "items": [["Detalles de la generación", "En «Tareas en segundo plano», toca la tarjeta de la IA para ver la IA y el modelo, cuándo empezó, cuántas partes van hechas y cuál está haciendo ahora."], ["Más espacio en el ordenador", "En pantallas grandes, el panel usa todo el ancho: sincronización a un lado, generación al otro y las partes en dos columnas."], ["Errores de Gemini claros", "Clarea distingue si Gemini está saturada, si has llegado al límite por minuto, si has gastado el uso gratis del día o si el modelo no tiene uso gratis, y te dice qué hacer."], ["Cuenta atrás real", "Cuando la IA tiene que esperar, ves los segundos que faltan para volver a intentarlo."]]}, {"v": "1.1", "date": "2026-11-12", "title": "Notificaciones, recordatorios e instalar", "items": [["Tareas en segundo plano", "Un apartado nuevo en el menú para ver lo que Clarea está haciendo: la sincronización y la generación con IA, parte por parte, con botón para pararla."], ["Notificaciones", "Los avisos de Clarea en un solo sitio, con los que no has leído marcados. Se guardan en tu cuenta, así que los ves en todos tus dispositivos."], ["Recordatorios", "Al abrir Clarea te avisa de las entregas y exámenes de hoy y de mañana."], ["Añadir a mi calendario", "Cada evento se puede guardar en el calendario del iPhone, de Google o de Outlook, con avisos el día antes que llegan aunque Clarea esté cerrada."], ["Instalar", "Un botón en el móvil para tener Clarea en la pantalla de inicio, con una guía para cada navegador."], ["Guía para la clave de IA", "Paso a paso para conseguir tu clave de Gemini, Claude o ChatGPT, y mensajes de error claros que dicen qué hacer."], ["Novedades", "Esta pantalla: lo nuevo de cada versión."], ["Más limpio", "El tema y tu perfil juntos en la barra de arriba, sin la barra flotante de la IA, y si borras un proyecto que se estaba generando, se cancela solo."]]}, {"v": "1.0", "date": "2026-11-12", "title": "Primera versión", "items": [["Cuentas", "Sincronización entre dispositivos y opción de recordar la sesión."], ["Clases", "DAW-2A y ASIX-2A (Jesuitas Clot) y 1.º DAW (La Salle), con su horario."], ["Hoy", "Las clases del día con hora de inicio y fin, entregas y exámenes."], ["Asignaturas", "Con sus profes, el horario y las faltas de asistencia."], ["Calendario", "Entregas y exámenes (práctico, teórico y de código), con notas, edición y aviso de horas ocupadas."], ["Proyectos", "Sube tu código (carpeta, .zip o GitHub) y Clarea te prepara un repaso: código explicado, historial de Git, glosario y exámenes, con tu propia IA."], ["App", "Se instala en el móvil, funciona sin conexión y tiene modo claro y oscuro."]]}];</script>
<title>Preguntas · Clarea Beta</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* Layout: one narrow reading column; sticky 3-tab bar; resumen = VS Code-like tree whose files unfold into cards */
:root{
  --bg:#f5f3ef; --surface:#ffffff; --sunk:#efebe4; --fg:#1d2127; --muted:#5d6570; --line:#e1dcd2;
  --accent:#d4600a; --accent-ink:#a94b00; --accent-soft:#fbe9d9;
  --ok:#1f7a3f; --ok-soft:#e3f3e8; --err:#b3261e; --err-soft:#fbe7e5; --warn:#8a5a00; --warn-soft:#fdf1d8;
  --c-html:#e2582c; --c-js:#b89400; --c-css:#7656c4; --c-php:#6a6fb0; --c-json:#a87808; --c-git:#d9472f; --c-md:#2f77b8; --c-cfg:#5d6570;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171b; --surface:#1c2025; --sunk:#23282e; --fg:#e9e6e0; --muted:#9ba3ad; --line:#2d333a;
  --accent:#f28a2e; --accent-ink:#f6a45c; --accent-soft:#3a2614;
  --ok:#5fcf86; --ok-soft:#173222; --err:#ff8a80; --err-soft:#3b1b19; --warn:#f0c060; --warn-soft:#352a12;
  --c-html:#f07a52; --c-js:#e6c43a; --c-css:#a98bf0; --c-php:#9da2e0; --c-json:#e0b040; --c-git:#f0735c; --c-md:#6aaee8; --c-cfg:#9ba3ad;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171b; --surface:#1c2025; --sunk:#23282e; --fg:#e9e6e0; --muted:#9ba3ad; --line:#2d333a;
  --accent:#f28a2e; --accent-ink:#f6a45c; --accent-soft:#3a2614;
  --ok:#5fcf86; --ok-soft:#173222; --err:#ff8a80; --err-soft:#3b1b19; --warn:#f0c060; --warn-soft:#352a12;
  --c-html:#f07a52; --c-js:#e6c43a; --c-css:#a98bf0; --c-php:#9da2e0; --c-json:#e0b040; --c-git:#f0735c; --c-md:#6aaee8; --c-cfg:#9ba3ad;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);border-radius:4px;padding:.05em .3em;word-break:break-word}
pre{font-family:var(--f-mono);font-size:13px;line-height:1.45;background:var(--sunk);border-radius:8px;padding:10px 12px;margin:0;overflow-x:auto;white-space:pre}
pre code{background:none;padding:0;font-size:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header + tabs */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:18px 12px;display:flex;gap:12px;align-items:center}
.brick{flex:none;width:38px;height:38px}
.top h1{font-size:21px;font-weight:800;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:8px}
.tab{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 4px;font-size:13px;font-weight:600;line-height:1.2;cursor:pointer;min-width:0}
.tab small{display:block;font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab[aria-selected="true"] small{color:#fff;opacity:.85}
main .wrap{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
.sec-title{font-size:24px;font-weight:800}
.lead{color:var(--muted);margin:4px 0 0}

/* generic blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:17px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-weight:500}
ul.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.st{border-collapse:collapse;font-size:13px;min-width:520px;width:100%}
table.st th,table.st td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.st th{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}

/* flow diagram */
.flow{display:flex;flex-direction:column;gap:0;align-items:stretch}
.fnode{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px;cursor:pointer;text-align:left}
.fnode b{font-family:var(--f-mono);font-weight:500;color:var(--accent-ink)}
.fnode.srv{border-style:dashed}
.farrow{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:3px 0 3px 18px;border-left:2px solid var(--line);margin-left:16px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:16px;height:10px;border:1.5px solid var(--muted);border-radius:3px;display:inline-block}
.legend i.d{border-style:dashed}

/* tree */
.tree{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 0;font-size:15px}
.tree-head{display:flex;justify-content:space-between;align-items:center;padding:4px 14px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tree-head span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tree-head button{background:none;border:0;color:var(--accent-ink);font-size:13px;cursor:pointer;padding:4px}
.tree details>summary{list-style:none;cursor:pointer}
.tree details>summary::-webkit-details-marker{display:none}
.row{display:flex;align-items:center;gap:8px;min-height:38px;padding:4px 12px 4px calc(12px + var(--d,0) * 16px);width:100%;background:none;border:0;text-align:left;cursor:pointer;position:relative}
.row:hover{background:var(--sunk)}
.row .chev{width:12px;flex:none;color:var(--muted);transition:transform .15s;font-size:12px}
details[open]>summary .chev{transform:rotate(90deg)}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tag{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;flex:none}
.row.file[aria-expanded="true"]{background:var(--accent-soft)}
.ico{flex:none;width:26px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;font-weight:500;border-radius:4px;color:var(--c,var(--muted))}
.ico.folder{width:18px}
.ico.folder svg{width:18px;height:16px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--c-md);flex:none}
.dot.o{background:var(--accent)}

/* file card */
.card{margin:4px 12px 12px calc(12px + var(--d,0) * 16px);background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--c,var(--accent));border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .path{font-family:var(--f-mono);font-size:12px;color:var(--muted);word-break:break-all}
.card h3{font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip.role{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.m{font-family:var(--f-mono);border-color:var(--accent);color:var(--accent-ink)}
.chip.lock{border-color:var(--warn);color:var(--warn)}
.blk{display:flex;flex-direction:column;gap:6px;min-width:0}
.blk>h4{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.blk p{margin:0}
.items{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.item{padding:9px 11px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.item:first-child{border-top:0}
.item .n{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--accent-ink);word-break:break-word}
.item .t{font-size:14px}
.item.gh{background:var(--sunk);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 11px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:6px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px;min-width:0}
ol.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
ol.steps li>span{min-width:0}
.codes{display:flex;flex-direction:column;gap:5px}
.code{display:grid;grid-template-columns:46px 1fr;gap:8px;align-items:start;font-size:14px}
.code b{font-family:var(--f-mono);font-weight:500;font-size:13px;text-align:center;border-radius:5px;padding:1px 0;font-variant-numeric:tabular-nums}
.code b.s2{background:var(--ok-soft);color:var(--ok)}
.code b.s3{background:var(--sunk);color:var(--muted)}
.code b.s4{background:var(--err-soft);color:var(--err)}
.code b.s5{background:var(--warn-soft);color:var(--warn)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.link{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--fg)}
.link::before{content:"→ ";color:var(--accent)}
.tip{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.tip strong:first-child{color:var(--accent-ink)}

/* exams */
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pill{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.exam-head h3{font-size:20px}
.part{font-family:var(--f-display);font-size:16px;font-weight:600;margin-top:4px;color:var(--accent-ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.q .qn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.q .qt{font-weight:500}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;cursor:pointer;font-size:15px;min-width:0}
.opt .l{font-family:var(--f-mono);font-weight:500;color:var(--muted);flex:none}
.opt>span:last-child{min-width:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--err);background:var(--err-soft)}
.fb{font-size:14px;color:var(--muted)}
.qa{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:15px}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.small{padding:6px 11px;font-size:13px}
.score{font-family:var(--f-display);font-size:18px}
.sol{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.sol p{margin:0}
.ans{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ok)}
.ans b{font-family:var(--f-mono);background:var(--ok-soft);border-radius:5px;padding:0 7px}
.solgroup{display:flex;flex-direction:column;gap:10px}
.solgroup>summary{cursor:pointer;list-style:none;font-family:var(--f-display);font-size:19px;font-weight:600;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;justify-content:space-between;align-items:center}
.solgroup>summary::-webkit-details-marker{display:none}
.solgroup>summary::after{content:"+";font-family:var(--f-mono);color:var(--accent)}
.solgroup[open]>summary::after{content:"−"}
.solgroup[open]>summary{margin-bottom:10px}
.solbody{display:flex;flex-direction:column;gap:10px}
.mcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mcgrid div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;font-family:var(--f-mono);font-size:14px}
.mcgrid div b{color:var(--ok)}
.qmini{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (min-width:640px){.mcgrid{grid-template-columns:repeat(8,1fr)}}

.lbl{border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.lbl>summary{cursor:pointer;list-style:none;padding:9px 12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink);display:flex;justify-content:space-between}
.lbl>summary::-webkit-details-marker{display:none}
.lbl>summary::after{content:"+"}
.lbl[open]>summary::after{content:"−"}
.lbl[open]>summary{border-bottom:1px solid var(--line)}
.lbl>.items{border:0;border-radius:0}
.lblbody{display:flex;flex-direction:column}
.lb{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;min-width:0}
.lb:first-child{border-top:0}
.lb pre{font-size:12px}
.lb p{margin:0;font-size:14.5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);border-radius:10px;padding:4px}
.segb{border:0;background:none;border-radius:7px;padding:9px 4px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2}
.segb[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qtype{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--sunk);color:var(--muted)}
.qtype.w{background:var(--accent-soft);color:var(--accent-ink)}
.ta{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;resize:vertical;min-height:96px}
.ta:focus{border-color:var(--accent);outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.solsec{font-size:15px;font-family:var(--f-mono);font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.seg.two{grid-template-columns:1fr 1fr}
.ghnav{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ghb{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 8px;font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.ghb[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ggrid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.ggrid{grid-template-columns:1fr 1fr}}
.gcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:var(--bg);min-width:0}
.gcard b{font-family:var(--f-display);font-size:15px}
.gcard span{font-size:14px}
.gname{font-family:var(--f-mono);font-size:15px;background:var(--sunk);border-radius:8px;padding:10px 12px;word-break:break-word}
.gname .gp{color:var(--accent-ink);font-weight:500}
.gname.msg .gp{background:var(--accent);color:#fff;border-radius:4px;padding:0 5px;margin-right:6px}
.btag,.ptag,.ctag{font-family:var(--f-mono);font-size:12px;border-radius:999px;padding:2px 9px;cursor:pointer;border:1.5px solid var(--b,var(--line));background:var(--surface);color:var(--fg);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.btag::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--b);margin-right:6px;vertical-align:1px}
.ptag{border-color:var(--accent);color:var(--accent-ink)}
.ctag{border-radius:5px;border-color:var(--line);background:var(--sunk)}
.gmap{display:flex;flex-direction:column}
.gmrow{display:grid;grid-template-columns:28px 1fr;gap:8px;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0}
.gmline{position:relative;min-height:52px}
.gmline::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:3px;background:var(--fg);opacity:.85}
.gmline i{position:absolute;left:3px;top:16px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--b)}
.gmline::after{content:"";position:absolute;left:16px;top:21px;width:12px;height:3px;background:var(--b)}
.gmbody{display:flex;flex-direction:column;padding:8px 10px;margin:4px 0;border-radius:8px;border-left:4px solid var(--b);background:var(--bg);min-width:0}
.gmname{font-family:var(--f-mono);font-size:13px;font-weight:500;word-break:break-word}
.gmmeta{font-size:12.5px;color:var(--muted)}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gstats div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column}
.gstats b{font-family:var(--f-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.gstats span{font-size:12px;color:var(--muted)}
.gbr,.gpr{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--b);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin-top:80px}
.gbrhead,.gprhead{display:flex;gap:10px;align-items:center;min-width:0}
.gbrhead>div,.gprhead>div{min-width:0;flex:1}
.gnum{flex:none;width:30px;height:30px;border-radius:50%;background:var(--b);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--f-display)}
.gbrname{font-family:var(--f-mono);font-size:15px;font-weight:500;word-break:break-word}
.gflow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--bg);border-radius:8px;padding:10px 12px}
.gnode{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:14px}
.gnode small{color:var(--muted);font-size:12px;width:100%}
.garrow{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:2px 0 2px 10px;border-left:2px dashed var(--b);margin-left:6px}
.gfiles{display:flex;flex-direction:column;gap:4px}
.gfile{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12.5px;min-width:0}
.gfn{font-family:var(--f-mono);word-break:break-all}
.gdiff{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.add{color:var(--ok)}.del{color:var(--err)}
.gbar{grid-column:1/-1;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--ok);opacity:.7}
.gclist{display:flex;flex-direction:column;gap:6px}
.gcl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;text-align:left;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--b);border-radius:7px;padding:7px 10px;cursor:pointer;font-size:13.5px;min-width:0}
.gcl span{min-width:0}
.gcl small{grid-column:2;color:var(--muted);font-size:12px}
.tl{display:flex;flex-direction:column}
.tlr{display:grid;grid-template-columns:40px 1fr;min-width:0;scroll-margin-top:80px;border-radius:8px}
.tlg{position:relative}
.tlg .lm{position:absolute;left:8px;top:0;bottom:0;width:3px;background:var(--fg);opacity:.85}
.tlg .lb{position:absolute;left:26px;top:0;bottom:0;width:3px;background:var(--b)}
.tlg .dot{position:absolute;top:16px;width:15px;height:15px;border-radius:50%}
.tlg .dot.m{left:2px;background:var(--surface);border:3.5px solid var(--fg)}
.tlg .dot.b{left:20px;background:var(--b);border:3px solid var(--surface)}
.tlr.merge .tlg .lm::after{content:"";position:absolute;left:3px;top:21px;width:26px;height:3px;background:var(--b)}
.tlc{padding:10px 0 16px;display:flex;flex-direction:column;gap:6px;min-width:0;border-bottom:1px solid var(--line)}
.tlmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.tlmeta code{font-size:12.5px;color:var(--fg)}
.kind{font-family:var(--f-mono);text-transform:uppercase;font-size:10px;letter-spacing:.06em;background:var(--sunk);border-radius:999px;padding:1px 7px}
.tlmsg{font-family:var(--f-mono);font-size:13.5px;font-weight:500;word-break:break-word}
.tles{font-size:14px;color:var(--muted)}

.tlr.merge .tlc{background:linear-gradient(90deg,var(--sunk),transparent);padding-left:8px;border-radius:0 8px 8px 0}
.gprn{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--b);flex:none}
.gprt{font-weight:600}
.gstate{flex:none;font-size:12px;font-weight:600;background:#8250df;color:#fff;border-radius:999px;padding:3px 10px}
.gdir{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);border-radius:8px;padding:10px 12px}
.garr{font-size:20px;color:var(--muted)}
.gkv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gkv div{display:flex;flex-direction:column;gap:3px;align-items:flex-start;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px}

.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 4px transparent}}

.ncode{padding:10px 12px 10px 0}
.ncode .cl{display:block;min-height:1.45em}
.ncode .ln{display:inline-block;position:sticky;left:0;width:3.2em;padding-right:.7em;margin-right:.8em;text-align:right;color:var(--accent-ink);font-weight:500;background:var(--sunk);border-right:1.5px solid var(--line);user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums}
.lbnote{margin:0;padding:8px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.card>.blk,.card>.lbl,.card>.tip{margin-top:4px}
.card>.blk{padding-top:12px;border-top:1px solid var(--line)}
.card .blk>h4{color:var(--fg);font-size:12px;display:flex;align-items:center;gap:8px}
.card .blk>h4::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--c,var(--accent));flex:none}
.hint2{margin:0;font-size:13.5px;color:var(--muted)}
.cdesc{display:flex;flex-direction:column;gap:1px;min-width:0}
.cname{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted)}
.lnref{align-self:flex-start;font-family:var(--f-mono);font-size:11.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:0 6px;margin-top:2px}
.code{padding:6px 0;border-bottom:1px dashed var(--line)}
.code:last-child{border-bottom:0}
.chip.lines{font-family:var(--f-mono);border-color:var(--c,var(--accent));color:var(--fg)}
.what{display:flex;flex-direction:column;gap:8px;font-size:15.5px}

details.acc>summary::-webkit-details-marker,details.grp>summary::-webkit-details-marker,details.fn>summary::-webkit-details-marker,details.lbk>summary::-webkit-details-marker{display:none}
.acct{font-weight:600;font-size:15px;flex:1;min-width:0}

.fnn{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--accent-ink);word-break:break-word}

.nbtn{position:relative;width:42px;height:42px;border:0;background:none;color:var(--fg);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:color .2s ease}
.nbtn svg{width:21px;height:21px}
.nbtn .ubadge{top:0;right:-2px}
.npop{position:absolute;right:-60px;top:calc(100% + 8px);z-index:40;width:min(380px,calc(100vw - 24px));max-height:min(70vh,560px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.22);overflow:hidden}
.nphead{display:flex;align-items:baseline;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.nphead b{font-size:15.5px}.nphead small{font-size:12.5px;color:var(--accent);font-weight:700}
.npbody{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.npbody .ntlist{border:0;border-radius:10px}
@media (max-width:480px){.npop{position:fixed;left:12px;right:12px;top:calc(56px + env(safe-area-inset-top,0px));width:auto}}
@media (prefers-reduced-motion: no-preference){.npop{animation:cl-pop .18s cubic-bezier(.2,.8,.2,1) both;transform-origin:top right}}
@media (hover:hover) and (pointer:fine){.nbtn:hover{color:var(--accent)}}

/* close: always at the top right of every window */
.topx{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:2}
.topx svg{width:16px;height:16px}
@media (hover:hover) and (pointer:fine){.topx:hover{border-color:var(--accent);color:var(--accent)}}
.authcard>.topx + .authlogo,.authcard>.topx + .insthead{padding-right:44px}
.bgcloud{background:color-mix(in srgb,var(--accent) 10%,transparent)}.bgcloud b{color:var(--accent)}
/* narrow phones: the profile shows only its initial (the name is in the menu), so the bar never goes off the screen */
.uwho{margin:0;padding:8px 12px 10px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px}.uwho b{color:var(--fg)}
.authlogo h1 .betatag{font:800 11px/1 system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:#b4561b;border-radius:999px;padding:4px 8px;vertical-align:4px;margin-left:4px}
/* «Pregúntale a tu IA» */
.chatw{position:fixed;inset:0;z-index:115;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center}
.chatp{width:100%;max-width:640px;height:min(88vh,760px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media (min-width:700px){.chatw{align-items:center}.chatp{border-radius:18px}}
.chath{position:relative;display:flex;align-items:center;gap:10px;padding:14px 60px 12px 16px;border-bottom:1px solid var(--line)}
.chath div{display:flex;flex-direction:column;gap:2px;min-width:0}.chath b{font-size:16px}.chath small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatx{top:10px}
.chatm{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:10px}
.chathint{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.chatb{max-width:88%;padding:10px 12px;border-radius:14px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.chatb.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chatb.me{color:#14171b}}
:root[data-theme="dark"] .chatb.me{color:#14171b}   /* orange in dark: dark text for AA */
.chatb.ai{align-self:flex-start;background:var(--sunk);color:var(--fg);border-bottom-left-radius:4px}
.chatb pre{margin:6px 0;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.chatb code{font-size:.92em;background:var(--bg);padding:0 4px;border-radius:4px}
.chatb.wait{display:flex;gap:4px}.chatb.wait i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:chatdot 1s infinite ease-in-out}
.chatb.wait i:nth-child(2){animation-delay:.15s}.chatb.wait i:nth-child(3){animation-delay:.3s}
@keyframes chatdot{50%{opacity:.25;transform:translateY(-3px)}}
.chatclear{align-self:center;border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;padding:4px}
.chatf{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.chatf textarea{flex:1;font:inherit;font-size:16px;resize:none;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--bg);color:var(--fg);max-height:120px}
.chatf .btn{flex:none;align-self:flex-end}
/* ===== the Clarea header and the five tabs, ALWAYS visible (design rule): every full-screen layer
   (viewer, search, pickers, sheets, dialogs, the Claude chat) lives between them. --hdr / --tabs: their real height, measured below ===== */
:root{--hdr:calc(58px + env(safe-area-inset-top,0px));--tabs:0px;--kb:0px;--vvtop:0px}
/* the header never moves: fixed (not sticky), no elastic bounce, and with the iOS keyboard it follows what you see (--vvtop).
   The tabs stay at the bottom (under the keyboard). A box to write goes at bottom:max(var(--tabs),var(--kb)). */
html,body{overscroll-behavior-y:none}
.cbar{position:fixed!important;top:0;left:0;right:0;transform:translateY(var(--vvtop))}
body:has(>.cbar),body:has(>header.cbar){padding-top:var(--hdr)}
.tabs{top:var(--hdr)!important}
.xfilter{top:calc(var(--hdr) + 70px)!important}
.sheetbg,.pkw,.welc,.srch,.phv,.chatw,.cdlg{top:var(--hdr)!important;bottom:var(--tabs)!important}
.phv .phtop{padding-top:10px!important}
.phv .phbot{padding-bottom:14px!important}
body:has(.tabbar) .chatf{padding-bottom:12px}

.qnotes{font:inherit;font-size:14px;min-height:70px;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);color:var(--fg);resize:vertical}
.qnone{color:var(--muted);font-size:14px}
/* practice */
.pr{display:flex;flex-direction:column;gap:12px}
.prtop{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted);font-weight:700}
.prq{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.prq b{font-size:18px;line-height:1.4}
.prq textarea{font:inherit;font-size:15px;min-height:130px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--fg);resize:vertical}
.prbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.prbtns .btn{padding-inline:6px}
.prfound span.ok{background:rgba(46,157,91,.18);color:#196b3a}.prfound span.no{background:rgba(192,57,43,.13);color:#b3362c}
.prstart{display:flex;flex-direction:column;gap:10px}
.prstart .qfil{flex-wrap:wrap;overflow:visible}
.prend{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 16px}
.prend b{font-size:21px}
@media (min-width:860px){.qb{padding-left:56px}.prq{padding:22px}}

.simclock{font-variant-numeric:tabular-nums;font-size:16px;color:var(--fg);background:var(--sunk);border-radius:8px;padding:4px 10px}
.prbtns.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.simh{display:flex;justify-content:space-between;align-items:center;font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:11px 14px;cursor:pointer}
.simh span{font-size:14px;color:var(--muted)}.simh b{font-size:17px}
.prq details.qsec>summary{cursor:pointer;list-style:none}.prq details.qsec>summary::-webkit-details-marker{display:none}
.qask{align-self:flex-start;font-size:13.5px;padding:8px 12px}
/* edit the questions */
.qedtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qedtop .sec-title{margin:0}
.qedl{display:flex;flex-direction:column;gap:8px}
.qedi{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.qedi .qn{margin-top:4px}
.qedi textarea,.qedadd textarea{flex:1;min-width:0;font:inherit;font-size:14.5px;line-height:1.45;min-height:64px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--fg);resize:vertical}
.qedx{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.qedx:hover{color:#b3362c;border-color:#b3362c}
.qedx svg{width:16px;height:16px}
.qedadd{display:flex;flex-direction:column;gap:6px}
.qedadd textarea{min-height:90px}
.qlbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.qedph{position:relative;display:inline-flex;align-items:center;cursor:pointer;overflow:hidden}
.qedph input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.qedph.busy{opacity:.7;cursor:default}
/* the AI's mark in «Ponte a prueba» */
.prmark{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qmic{display:inline-flex;align-items:center;gap:6px;align-self:flex-start}
.qmic svg{width:16px;height:16px;flex:none}
.qmic.on{border-color:var(--accent);color:var(--accent-ink)}
.qcard{min-height:150px;justify-content:center}
.qcard>b{font-size:19px}
.psheet .qsec>span{font-size:13.5px;font-weight:600}

  S.qs.forEach(q => { const l = levelOf(q); if (l) c[l]++; if (knownOf(q.n)) c.dominadas++; else c.repasar++; });
  return c;
}

// photos or a PDF with more questions: your AI copies them as text into «Añadir preguntas», to check before saving
const b64Of = buf => { const a = new Uint8Array(buf); let s = ""; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
async function shrinkImg(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
    const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight)), cv = document.createElement("canvas");
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL("image/jpeg", 0.85).split(",")[1];
  } finally { URL.revokeObjectURL(url); }
}
async function edPhotos(inp){
  const list = [...inp.files].slice(0, 10), files = []; inp.value = ""; edSync();
  const say = (t, err) => { if (!ED) return; ED.busy = false; ED.msg = {t, err}; render(true); };
  if (!window.CLAI || !CLAI.ready()) return say('Para leer fotos o PDF, pon tu clave gratis de Gemini en <a href="configuracion">Configuración</a>.', true);
  ED.busy = true; ED.msg = {t: "Tu IA está leyendo " + (list.length > 1 ? "los " + list.length + " archivos" : "el archivo") + "…"}; render(true);
  for (const f of list){
    try {
      if (/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)){ if (f.size > 15e6) return say("El PDF es demasiado grande (máximo 15 MB).", true); files.push({mime: "application/pdf", b64: b64Of(await f.arrayBuffer()), name: f.name}); }
      else files.push({mime: "image/jpeg", b64: await shrinkImg(f), name: f.name || "foto.jpg"});
    } catch(x){ return say("No se ha podido leer «" + esc(f.name) + "».", true); }
  }
  let qs = [];
  try {
    const out = await CLAI.callSmart('Estas fotos o este PDF tienen preguntas de examen de ' + S.subj + (S.subjName ? ' (' + S.subjName + ')' : '') + (CLAI.qCourse(S) ? ', del curso «' + CLAI.qCourse(S) + '»' : '') + '.\n'
      + 'Cópialas tal cual, en su idioma y en orden, sin responderlas ni cambiar las palabras. Si una pregunta ocupa varias líneas, júntala en una. Si el profe añade una pista o aclaración, déjala detrás de la pregunta. No copies números de página, cabeceras ni el nombre del alumno.\n\n'
      + 'Responde solo con JSON, sin texto alrededor. Forma exacta:\n{"questions":["texto de la pregunta"]}', true,
      {files, onSwitch: (m, was) => { if (ED){ ED.msg = {t: "«" + esc(was) + "» estaba saturado: sigo con «" + esc(m) + "»…"}; render(true); } }});
    const data = CLAI.parseJSON(out);
    qs = (data && Array.isArray(data.questions) ? data.questions : []).map(q => String(q && typeof q === "object" ? q.q || q.text || q.question || "" : q || "").replace(/\s+/g, " ").replace(/^\s*\d+\s*[.)-]\s*/, "").trim()).filter(Boolean).slice(0, 120);
  } catch(x){
    const m = String(x && x.message || x);

  say("✓ " + qs.length + " pregunta" + (qs.length > 1 ? "s leídas" : " leída") + ". Revísala" + (qs.length > 1 ? "s" : "") + " en «Añadir preguntas» y pulsa Guardar.");
}
function edSync(){
  if (!ED) return;
  document.querySelectorAll("[data-qedq]").forEach(t => { const x = ED.qs[+t.dataset.qedq]; if (x) x.text = t.value; });
  const a = document.querySelector("[data-qedadd]"); if (a) ED.add = a.value;
}
// «1. …», «2) …»: numbered lines start a question and the lines after them continue it; without numbers, one per line
function parseAdd(text){
  const lines = String(text || "").replace(/\r/g, "").split("\n").map(l => l.trim()).filter(Boolean), out = [];
  const num = /^(\d{1,3})\s*[.)\-:º]\s*(.*)$/;
  if (!lines.some(l => num.test(l))) return lines.map(l => l.slice(0, 1000));
  lines.forEach(l => { const m = l.match(num); if (m){ if (m[2].trim()) out.push(m[2].trim()); } else if (out.length) out[out.length - 1] += " " + l; });
  return out.map(l => l.slice(0, 1000));
}
function edSave(){
  edSync(); load();
  const all = (lget("clarea-qsets") || {}).list || [], me = all.find(x => x.id === SID); if (!me) return;
  const keep = ED.qs.map(x => Object.assign({}, x, {text: x.text.replace(/\s+/g, " ").trim()})).filter(x => x.text), add = parseAdd(ED.add);

  const kept = new Set(keep.map(x => x.n)); let changed = 0;
  S.qs.forEach(q => { if (!kept.has(q.n)){ delete AI.items[q.n]; delete PG.mine[q.n]; } });
  const qs = keep.map(x => { const q = S.qs.find(y => y.n === x.n); if (!q) return null;
    if (x.text === qText(q).replace(/\s+/g, " ").trim()) return q;
    changed++; delete AI.items[q.n]; return Object.assign({}, q, {q: x.text}); }).filter(Boolean);

  let next = Math.max(0, ...S.qs.map(q => +q.n || 0), ...Object.keys(AI.items).map(Number), ...Object.keys(PG.mine).map(Number)) + 1;
  add.forEach(t => qs.push({n: next++, q: t}));

  if (AI.cloud && (changed || add.length || qs.length !== S.qs.length)){ CLAI.cloudCancel(AI.cloud); AI.cloud = null; }
  if (changed || add.length) delete AI.paused;                         // new questions: prepared by themselves again
  saveAI(); savePG(); ED = null; render(); window.scrollTo(0, 0);
  const todo = changed + add.length;
  if (window.clareaToast) window.clareaToast(!todo ? "Guardado." : window.CLAI && CLAI.ready() ? "Guardado. " + (todo > 1 ? "Las " + todo + " preguntas nuevas o cambiadas se preparan solas" : "La pregunta nueva o cambiada se prepara sola") + " con tu IA." : "Guardado. Prepara su explicación en «✦ IA».");
}
function qItem(q){

  let b = '';

  if (it){
    if (it.q && it.q !== q.q) b += '<div class="qsec"><small>Tal como venía</small><p class="qnone">' + esc(q.q) + '</p></div>';
    if (it.short) b += '<div class="qsec"><small>En pocas palabras</small><p class="qshort">' + fmt(it.short) + '</p></div>';
    if (it.answer) b += '<div class="qsec"><small>Respuesta de examen</small><p>' + fmt(it.answer) + '</p></div>';
    if (it.points && it.points.length) b += '<div class="qsec"><small>Ideas que no pueden faltar</small><ul>' + it.points.map(x => '<li>' + fmt(x) + '</li>').join("") + '</ul></div>';
    if (it.keyTerms && it.keyTerms.length) b += '<div class="qsec"><small>Conceptos que debes nombrar</small><div class="qkeys">' + it.keyTerms.map(x => '<span>' + esc(x) + '</span>').join("") + '</div></div>';
    if (it.example) b += '<div class="qsec"><small>Ejemplo</small><pre>' + esc(it.example) + '</pre></div>';
    if (it.mistakes && it.mistakes.length) b += '<div class="qsec"><small>Errores típicos</small><ul>' + it.mistakes.map(x => '<li>' + fmt(x) + '</li>').join("") + '</ul></div>';
    if (it.tip) b += '<div class="qsec"><small>Para recordarla</small><p class="qtip">' + fmt(it.tip) + '</p></div>';
    if (it.why) b += '<div class="qsec"><small>Por qué es ' + (LV[ai] || "").toLowerCase() + '</small><p class="qnone">' + esc(it.why) + '</p></div>';
  } else b += '<p class="qnone">Aún no tiene explicación. Prepárala en la pestaña «✦ IA».</p>';
  b += '<div class="qa">' + spkBtn(q) + '<button type="button" class="btn ghostbtn qask" data-qask="' + q.n + '">Pregúntale a tu IA sobre esta pregunta</button></div>';
  b += '<div class="qmine"><small>Para mí es</small>' + Object.keys(LV).map(l => '<button data-mylv="' + q.n + '|' + l + '" class="' + l + (my === l ? ' on' : '') + '" aria-pressed="' + (my === l) + '">' + LV[l] + '</button>').join("") + '</div>';
  b += '<label class="qsec"><small>Mis notas</small><textarea class="qnotes" data-notes="' + q.n + '" placeholder="Lo que te dijo el profe, cómo lo explicarías tú…">' + esc(m.notes || "") + '</textarea></label>';
  return '<details class="qi' + (knownOf(q.n) ? ' known' : '') + '" data-qn="' + q.n + '"><summary><span class="qn">' + posOf(q) + '</span><span class="qtx"><b>' + esc(qText(q)) + '</b><span class="qtags">'
    + (ai ? '<span class="lv ' + ai + '">' + LV[ai] + '</span>' : '') + (my && my !== ai ? '<span class="lv mine ' + my + '">' + LV[my] + '</span>' : '') + (m.ai ? '<span class="lv ' + (m.ai.s >= 7 ? 'facil' : m.ai.s >= 5 ? 'media' : 'dificil') + '" title="La última nota que te puso tu IA">Tu IA: ' + m.ai.s.toLocaleString("es-ES") + '</span>' : '') + (knownOf(q.n) ? '<span class="lv facil">Dominada</span>' : '')
    + '</span></span></summary><div class="qb">' + b + '</div></details>';
}

/* ===================== «Ponte a prueba»: answer, compare, and grade yourself ===================== */
const PR = {deck: null, i: 0, show: false, ok: 0, mode: "repaso"};
const normT = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function termFound(term, u){ const t = normT(term).replace(/[«»()]/g, "").trim(); if (!t) return false; if (u.includes(t)) return true; const ws = t.split(/[^a-z0-9ñ_$]+/).filter(w => w.length >= 4); return ws.length > 0 && ws.filter(w => u.includes(w.slice(0, Math.max(4, Math.min(6, w.length))))).length / ws.length >= 0.6; }
function deckFor(mode){

function applyChunk(part, data){
  const items = data && Array.isArray(data.items) ? data.items : null; if (!items) throw new Error("Falta «items» en la respuesta.");
  let got = 0;
  part.forEach(q => {
    const it = items.find(x => +x.n === +q.n); if (!it || !it.answer) return;
    const arr = (a, n, l) => (Array.isArray(a) ? a : []).map(x => String(x).slice(0, l)).filter(Boolean).slice(0, n);
    AI.items[q.n] = {q: String(it.q || q.q).slice(0, 400), level: ["facil","media","dificil"].includes(it.level) ? it.level : "media", why: String(it.why || "").slice(0, 300),
      short: String(it.short || "").slice(0, 600), answer: String(it.answer).slice(0, 4000), points: arr(it.points, 8, 400), keyTerms: arr(it.keyTerms, 8, 60),
      example: String(it.example || "").slice(0, 1500), mistakes: arr(it.mistakes, 4, 400), tip: String(it.tip || "").slice(0, 500)}; got++;
  });
  if (!got) throw new Error("La respuesta no traía ninguna de estas preguntas.");
  saveAI();
}

  try {
    const cl = await CLAI.cloudSubmit({title: S.name, url: "preguntas.html?id=" + encodeURIComponent(SID), parts: todo.map(p => ({id: chunkId(p), text: qPrompt(p)}))});

  } catch(e){ RUN.sending = false; RUN.msg = {err: true, t: "No se ha podido preparar en la nube (" + (e.message || e) + "). Se hace aquí, con Clarea abierta."}; render(true); return runAI(true); }

let pollT = 0;
async function pollCloud(){
  clearTimeout(pollT); load(); const cl = AI.cloud; if (!cl) return;
  try {
    const have = chunks().filter(chunkDone).map(chunkId);
    const g = await CLAI.cloudFetch(cl, have);
    load();
    if (g.gone){ AI.cloud = null; saveAI(); render(true); return; }
    let err = null;
    g.parts.forEach(x => { const part = chunks().find(p => chunkId(p) === x.id); if (!part) return;
      if (x.res){ try { applyChunk(part, CLAI.parseJSON(x.res)); load(); } catch(e){ err = "Una parte no se ha podido leer: " + (e.message || e); } }
      else if (x.st === "err" || x.st === "stop") err = CLAI.errEs(x.err) || "Una parte no se ha podido preparar."; });
    load();                                                                // (applyChunk saved the answers)
    const wait = g.parts.find(x => x.st === "wait");
    AI.cloudNow = wait ? (wait.err ? "La IA no ha respondido bien: se reintentará" : "Preparando…") : null;
    if (g.switched) AI.cloudSw = g.switched;
    if (g.done){
      CLAI.cloudCancel(AI.cloud); AI.cloud = null; AI.cloudNow = null;
      RUN.msg = g.fatal ? {err: true, t: CLAI.errEs(g.fatal)} : err ? {err: true, t: err} : {ok: true, t: "Listo: todas las preguntas tienen su explicación."};
      if (window.clareaNotify && !g.fatal && !err) window.clareaNotify({kind: "ok", title: "Preguntas preparadas", body: "«" + S.name + "» de " + S.subj + " ya tiene sus respuestas.", url: "preguntas.html?id=" + encodeURIComponent(SID)});
    }
    saveAI(); render(true);
  } catch(e){ /* no internet: later */ }

}
async function runAI(here){
  if (!here && CLAI.cloudOn && CLAI.cloudOn() && CLAI.ready()) return runCloud();
  if (RUN.on || !CLAI.ready()) return;
  RUN.on = true; RUN.stop = false; RUN.msg = null; render(true); wakeTry();
  if (window.clareaToast) window.clareaToast("Preparando. Mantén Clarea abierta: si la cierras, se pausa y sigues luego.");
  try {
    for (const part of chunks()){
      if (RUN.stop) break; if (chunkDone(part)) continue;
      RUN.cur = chunkId(part); RUN.wait = null; render(true);
      let text = null;
      for (let tries = 0; text === null; tries++){
        try { text = await CLAI.callAI(qPrompt(part), true, (s, er) => { RUN.wait = s ? {until: Date.now() + s * 1000, why: er && er.why} : null; paintRun(); }); }
        catch(e){
          // still saturated after the retries: another model (twice at most), and say so
          const busy = e.status === 503 || e.status === 529 || (e.status === 429 && !e.quotaKind) || /saturad|overloaded|high demand|muy solicitado/i.test((e.why || "") + " " + (e.detail || "") + " " + e.message);
          const cf = CLAI.cfg(), from = cf.models && cf.models[cf.prov];
          const next = busy && tries < 2 ? await CLAI.nextModel((RUN.tried = (RUN.tried || []).concat([from]))).catch(() => null) : null;
          if (!next) throw e;
          cf.models[cf.prov] = next; CLAI.cfgSet(cf);
          const t = CLAI.PROV[cf.prov].t + " estaba saturada", b = "Clarea ha cambiado de «" + from + "» a «" + next + "» para seguir preparando «" + S.name + "».";
          if (window.clareaNotify) window.clareaNotify({kind: "info", title: t, body: b, url: "preguntas.html?id=" + encodeURIComponent(SID)});
          if (window.clareaToast) window.clareaToast(t + ": sigo con «" + next + "».");
        }
      }
      load(); applyChunk(part, CLAI.parseJSON(text));
    }
    RUN.msg = RUN.stop ? {t: "Parado. Lo que ya estaba hecho se queda guardado."} : {ok: true, t: "Listo: todas las preguntas tienen su explicación."};
  } catch(e){ RUN.msg = {err: true, t: e instanceof TypeError ? "No se ha podido conectar. ¿Hay internet?" : (e.message || String(e))}; }
  RUN.on = false; RUN.cur = null; RUN.wait = null; try { RUN.wake && RUN.wake.release(); } catch(e){}
  if (window.clareaNotify && RUN.msg && RUN.msg.ok) window.clareaNotify({kind: "ok", title: "Preguntas preparadas", body: "«" + S.name + "» de " + S.subj + " ya tiene todas sus respuestas.", url: "preguntas.html?id=" + encodeURIComponent(SID)});
  render(true);
}

<script>
/* offline cache + "Actualizar" banner when a new version has been downloaded */
(function () {
  if (!("serviceWorker" in navigator)) return;
  var reloading = false, shown = false;
  function banner(worker) {
    if (shown || !worker) return; shown = true;
    var b = document.createElement("div");
    b.className = "updbar"; b.setAttribute("role", "status");
    b.innerHTML = '<div><b>Hay una versión nueva de Clarea</b><span>Toca «Actualizar» para usarla ahora.</span></div><button type="button" class="updgo">Actualizar</button><button type="button" class="updno" aria-label="Ahora no">✕</button>';
    document.body.appendChild(b);
    b.querySelector(".updgo").addEventListener("click", function () {
      b.querySelector(".updgo").textContent = "Actualizando…";
      worker.postMessage({type: "SKIP_WAITING"});
      setTimeout(function () { if (!reloading) location.reload(); }, 3000);
    });
    b.querySelector(".updno").addEventListener("click", function () { b.classList.add("closing"); setTimeout(function () { b.remove(); shown = false; }, 220); });
  }
  // reload only when a NEW version takes over; the very first install must not reload (it would wipe what is being typed)
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function () { if (!hadController) { hadController = true; return; } if (reloading) return; reloading = true; location.reload(); });
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").then(function (reg) {
      function watch(w) { if (!w) return; w.addEventListener("statechange", function () { if (w.state === "installed" && navigator.serviceWorker.controller) banner(w); }); }
      if (reg.waiting && navigator.serviceWorker.controller) banner(reg.waiting);
      watch(reg.installing);
      reg.addEventListener("updatefound", function () { watch(reg.installing); });
      // look for a new version now and every time the app comes back to the screen
      reg.update().catch(function () {});
      // manual check from the account menu
      window.clareaCheckUpdate = function (say) {
        if (reg.waiting) { banner(reg.waiting); return; }
        say("Buscando actualizaciones…");
        reg.update().then(function () {
          setTimeout(function () {
            if (reg.waiting) banner(reg.waiting);
            else if (reg.installing) say("Descargando la versión nueva…");
            else say("Ya tienes la última versión.");
          }, 1500);
        }).catch(function () { say("Sin conexión: no se puede comprobar ahora."); });
      };
      document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") reg.update().catch(function () {}); });
    }).catch(function () {});
  });
})();
</script>
