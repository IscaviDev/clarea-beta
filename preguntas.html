gado al límite por minuto, si has gastado el uso gratis del día o si el modelo no tiene uso gratis, y te dice qué hacer."], ["Cuenta atrás real", "Cuando la IA tiene que esperar, ves los segundos que faltan para volver a intentarlo."]]}, {"v": "1.1", "date": "2026-11-12", "title": "Notificaciones, recordatorios e instalar", "items": [["Tareas en segundo plano", "Un apartado nuevo en el menú para ver lo que Clarea está haciendo: la sincronización y la generación con IA, parte por parte, con botón para pararla."], ["Notificaciones", "Los avisos de Clarea en un solo sitio, con los que no has leído marcados. Se guardan en tu cuenta, así que los ves en todos tus dispositivos."], ["Recordatorios", "Al abrir Clarea te avisa de las entregas y exámenes de hoy y de mañana."], ["Añadir a mi calendario", "Cada evento se puede guardar en el calendario del iPhone, de Google o de Outlook, con avisos el día antes que llegan aunque Clarea esté cerrada."], ["Instalar", "Un botón en el móvil para tener Clarea en la pantalla de inicio, con una guía para cada navegador."], ["Guía para la clave de IA", "Paso a paso para conseguir tu clave de Gemini, Claude o ChatGPT, y mensajes de error claros que dicen qué hacer."], ["Novedades", "Esta pantalla: lo nuevo de cada versión."], ["Más limpio", "El tema y tu perfil juntos en la barra de arriba, sin la barra flotante de la IA, y si borras un proyecto que se estaba generando, se cancela solo."]]}, {"v": "1.0", "date": "2026-11-12", "title": "Primera versión", "items": [["Cuentas", "Sincronización entre dispositivos y opción de recordar la sesión."], ["Clases", "DAW-2A y ASIX-2A (Jesuitas Clot) y 1.º DAW (La Salle), con su horario."], ["Hoy", "Las clases del día con hora de inicio y fin, entregas y exámenes."], ["Asignaturas", "Con sus profes, el horario y las faltas de asistencia."], ["Calendario", "Entregas y exámenes (práctico, teórico y de código), con notas, edición y aviso de horas ocupadas."], ["Proyectos", "Sube tu código (carpeta, .zip <style>
/* Layout: one narrow reading column; sticky 3-tab bar; resumen = VS Code-like tree whose files unfold into cards */
:root{
  --bg:#f5f3ef; --surface:#ffffff; --sunk:#efebe4; --fg:#1d2127; --muted:#5d6570; --line:#e1dcd2;
  --accent:#d4600a; --accent-ink:#a94b00; --accent-soft:#fbe9d9;
  --ok:#1f7a3f; --ok-soft:#e3f3e8; --err:#b3261e; --err-soft:#fbe7e5; --warn:#8a5a00; --warn-soft:#fdf1d8;
  --c-html:#e2582c; --c-js:#b89400; --c-css:#7656c4; --c-php:#6a6fb0; --c-json:#a87808; --c-git:#d9472f; --c-md:#2f77b8; --c-cfg:#5d6570;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171b; --surface:#1c2025; --sunk:#23282e; --fg:#e9e6e0; --muted:#9ba3ad; --line:#2d333a;
  --accent:#f28a2e; --accent-ink:#f6a45c; --accent-soft:#3a2614;
  --ok:#5fcf86; --ok-soft:#173222; --err:#ff8a80; --err-soft:#3b1b19; --warn:#f0c060; --warn-soft:#352a12;
  --c-html:#f07a52; --c-js:#e6c43a; --c-css:#a98bf0; --c-php:#9da2e0; --c-json:#e0b040; --c-git:#f0735c; --c-md:#6aaee8; --c-cfg:#9ba3ad;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171b; --surface:#1c2025; --sunk:#23282e; --fg:#e9e6e0; --muted:#9ba3ad; --line:#2d333a;
  --accent:#f28a2e; --accent-ink:#f6a45c; --accent-soft:#3a2614;
  --ok:#5fcf86; --ok-soft:#173222; --err:#ff8a80; --err-soft:#3b1b19; --warn:#f0c060; --warn-soft:#352a12;
  --c-html:#f07a52; --c-js:#e6c43a; --c-css:#a98bf0; --c-php:#9da2e0; --c-json:#e0b040; --c-git:#f0735c; --c-md:#6aaee8; --c-cfg:#9ba3ad;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);border-radius:4px;padding:.05em .3em;word-break:break-word}
pre{font-family:var(--f-mono);font-size:13px;line-height:1.45;background:var(--sunk);border-radius:8px;padding:10px 12px;margin:0;overflow-x:auto;white-space:pre}
pre code{background:none;padding:0;font-size:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header + tabs */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:18px 12px;display:flex;gap:12px;align-items:center}
.brick{flex:none;width:38px;height:38px}
.top h1{font-size:21px;font-weight:800;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:8px}
.tab{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 4px;font-size:13px;font-weight:600;line-height:1.2;cursor:pointer;min-width:0}
.tab small{display:block;font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab[aria-selected="true"] small{color:#fff;opacity:.85}
main .wrap{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
.sec-title{font-size:24px;font-weight:800}
.lead{color:var(--muted);margin:4px 0 0}

/* generic blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:17px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);font-weight:500}
ul.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.st{border-collapse:collapse;font-size:13px;min-width:520px;width:100%}
table.st th,table.st td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.st th{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}

/* flow diagram */
.flow{display:flex;flex-direction:column;gap:0;align-items:stretch}
.fnode{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px;cursor:pointer;text-align:left}
.fnode b{font-family:var(--f-mono);font-weight:500;color:var(--accent-ink)}
.fnode.srv{border-style:dashed}
.farrow{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:3px 0 3px 18px;border-left:2px solid var(--line);margin-left:16px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:16px;height:10px;border:1.5px solid var(--muted);border-radius:3px;display:inline-block}
.legend i.d{border-style:dashed}

/* tree */
.tree{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 0;font-size:15px}
.tree-head{display:flex;justify-content:space-between;align-items:center;padding:4px 14px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tree-head span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tree-head button{background:none;border:0;color:var(--accent-ink);font-size:13px;cursor:pointer;padding:4px}
.tree details>summary{list-style:none;cursor:pointer}
.tree details>summary::-webkit-details-marker{display:none}
.row{display:flex;align-items:center;gap:8px;min-height:38px;padding:4px 12px 4px calc(12px + var(--d,0) * 16px);width:100%;background:none;border:0;text-align:left;cursor:pointer;position:relative}
.row:hover{background:var(--sunk)}
.row .chev{width:12px;flex:none;color:var(--muted);transition:transform .15s;font-size:12px}
details[open]>summary .chev{transform:rotate(90deg)}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tag{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;flex:none}
.row.file[aria-expanded="true"]{background:var(--accent-soft)}
.ico{flex:none;width:26px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10px;font-weight:500;border-radius:4px;color:var(--c,var(--muted))}
.ico.folder{width:18px}
.ico.folder svg{width:18px;height:16px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--c-md);flex:none}
.dot.o{background:var(--accent)}

/* file card */
.card{margin:4px 12px 12px calc(12px + var(--d,0) * 16px);background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--c,var(--accent));border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .path{font-family:var(--f-mono);font-size:12px;color:var(--muted);word-break:break-all}
.card h3{font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip.role{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.m{font-family:var(--f-mono);border-color:var(--accent);color:var(--accent-ink)}
.chip.lock{border-color:var(--warn);color:var(--warn)}
.blk{display:flex;flex-direction:column;gap:6px;min-width:0}
.blk>h4{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.blk p{margin:0}
.items{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.item{padding:9px 11px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.item:first-child{border-top:0}
.item .n{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--accent-ink);word-break:break-word}
.item .t{font-size:14px}
.item.gh{background:var(--sunk);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 11px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:6px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14px;min-width:0}
ol.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}

/* ---------- hover (computers and tablets with a mouse) ---------- */
@media (hover:hover) and (pointer:fine){
  .scard:hover,.tdi:hover,.tt .cl:hover{box-shadow:0 8px 22px rgba(0,0,0,.2);filter:brightness(1.04)}
  .lcard:hover,.authimp:hover,.thbtn:hover,.ubtn:hover,.authknown button:hover{border-color:var(--accent)}
  .lcard:hover{box-shadow:0 6px 18px rgba(0,0,0,.12)}
  details.fr2:hover{border-color:var(--accent)}
  .btn:hover,.updgo:hover{filter:brightness(1.1);box-shadow:0 4px 14px rgba(31,95,191,.35)}
  .authtabs button:not([aria-pressed="true"]):hover{background:var(--surface)}
  .authalt:hover,.updno:hover,.pweye:hover{color:var(--fg);background:var(--sunk)}
  .back:hover,.rback:hover,.xback:hover{text-decoration:underline;text-underline-offset:3px}
  .tab:not([aria-selected="true"]):hover,.segb:not([aria-pressed="true"]):hover,.ghb:not([aria-pressed="true"]):hover,.xdiff:hover,.xex:hover,.xresume:hover,.opt:hover,.row.file:hover,.fnode:hover,.use:hover,.guse2:hover{border-color:var(--accent)}
  details>summary:hover{color:var(--accent-ink,inherit)}
}
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion: no-preference){
  .scard,.tdi,.tt .cl,.lcard,details.fr2,.thbtn svg,.back,.rback,.xback{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease,border-color .2s ease,filter .2s ease,background-color .2s ease,color .2s ease}
  .scard:hover,.tdi:hover,.tt .cl:hover{transform:translateY(-3px)}
  .lcard:hover,.xdiff:hover,.xex:hover{transform:translateY(-2px)}
  .btn:hover,.updgo:hover{transform:translateY(-1px)}
  .back:hover,.rback:hover,.xback:hover{transform:translateX(-3px)}
  .scard:hover:active,.tdi:hover:active,.lcard:hover:active,.btn:hover:active{transform:scale(.97)}
}

.authrem{display:flex;align-items:flex-start;gap:10px;font-size:14px;font-weight:600;cursor:pointer;flex-direction:row!important}
.authrem input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--clarea-blue,#1f5fbf);flex:none}
.authrem span{display:flex;flex-direction:column;gap:2px}
.authrem small{font-size:12px;font-weight:500;color:var(--muted)}
.akrow{display:flex;gap:6px;align-items:stretch}
.akrow [data-pick]{flex:1}
.authknown button b{display:flex;flex-direction:column}
.authknown button b small{font-size:11.5px;font-weight:500;color:var(--muted)}
.akforget{flex:none;width:44px!important;justify-content:center;padding:0!important;color:var(--muted)!important}
.authcredit a{color:var(--accent);font-weight:700}
.umenu .udel{color:#d9534f}
.deli{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(192,57,43,.14);color:#d9534f}
.deli svg{width:24px;height:24px}
.btn.btndel{background:#c0392b}

.acav{width:44px;height:44px;border-radius:50%;flex:none;background:var(--accent);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
.acrows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.acrows>div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--bg)}
.acrows>div+div{border-top:1px solid var(--line)}
.acrows span{font-size:12px;color:var(--muted);font-weight:600}
.acrows b{font-size:14px}
button.aclink{font:inherit;font-weight:700;font-size:15px;text-align:left;cursor:pointer;width:100%}
.aclink{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 8px;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);font-weight:700;font-size:15px}
.aclink small{grid-column:1;font-size:12.5px;font-weight:500;color:var(--muted)}
.aclink span{grid-row:1/3;grid-column:2;color:var(--muted);font-size:20px}
.acdanger{border:1px dashed rgba(192,57,43,.45);border-radius:12px}
.acdanger>summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:13.5px;font-weight:700;color:var(--muted)}
.acdanger>summary::-webkit-details-marker{display:none}
.acdanger>summary{display:flex;align-items:center;justify-content:space-between}
.acdanger>summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s ease;margin-right:4px}
.acdanger[open]>summary::after{transform:rotate(45deg)}
.acdanger>div{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.acdanger p{margin:0;font-size:13px;color:var(--muted)}
.acdel{align-self:flex-start;border:1.5px solid #c0392b;background:none;color:#d9534f;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer}
.ghostbtn{background:var(--sunk)!important;color:var(--fg)!important}
.btn.btndel:disabled{opacity:.45;cursor:not-allowed}

/* ---------- AI generation notice (every page) ---------- */
.aipill{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:105;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-left:5px solid var(--clarea-orange,#b4561b);border-radius:14px;padding:10px 10px 10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.aipi{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--sunk)}
.aipi.ok{background:rgba(46,157,91,.18);color:#2e9d5b}.aipi.bad{background:rgba(192,57,43,.15);color:#d9534f}
.aipi.spin{border:3px solid var(--line);border-top-color:var(--clarea-orange,#b4561b);background:none;animation:aispin 1s linear infinite}
@keyframes aispin{to{transform:rotate(360deg)}}
.aipt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.aipt b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aipt small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aipbar{display:block;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:3px}
.aipbar>i{display:block;height:100%;background:var(--clarea-orange,#b4561b);transition:width .3s ease}
.aipgo{flex:none;border-radius:9px;background:var(--clarea-orange,#b4561b);color:#fff;font-weight:700;font-size:13.5px;padding:8px 12px;text-decoration:none}
.aipx{flex:none;width:30px;height:30px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer}
body:has(.updbar) .aipill{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion: no-preference){.aipill{animation:upd-in .3s cubic-bezier(.2,.8,.2,1) both}}

/* hover on the rows of "Mi cuenta" */
.aclink,.acdel,.acdanger>summary{transition:border-color .2s ease,background-color .2s ease,color .2s ease,transform .2s ease}
@media (hover:hover) and (pointer:fine){
  .aclink:hover{border-color:var(--accent);background:var(--surface)}
  .aclink:hover span{color:var(--accent)}
  .acdanger>summary:hover{color:var(--fg)}
  .acdel:hover{background:rgba(192,57,43,.12)}
}
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion: no-preference){.aclink:hover{transform:translateY(-1px)}}
.aclink:active{transform:scale(.98)}

/* ---------- account button: work going on + unread notices ---------- */
.ubtn{position:relative}
.ubtn i{position:relative}
.ubtn.aibusy i::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:var(--clarea-orange,#b4561b);border-right-color:var(--clarea-orange,#b4561b);animation:aispin 1s linear infinite}
.ubadge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--clarea-orange,#b4561b);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);font-style:normal}
.mcount{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--clarea-orange,#b4561b);color:#fff;font-size:11.5px;font-weight:800;vertical-align:1px}
/* ---------- «Tareas en segundo plano» and «Notificaciones» ---------- */
.bgic{background:var(--sunk);color:var(--accent)}
.bgic svg{width:24px;height:24px}
.bgsect{margin:4px 0 -4px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bgbody{display:flex;flex-direction:column;gap:12px}
.bgcard{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px}
.bgempty{color:var(--muted);font-size:14px;line-height:1.45}
.bghead{display:flex;align-items:center;gap:10px}
.bghead .sdot{margin:0 4px}
.bgt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bgt b{font-size:15px;line-height:1.3}
.bgt small{font-size:13px;color:var(--muted);line-height:1.35}
.bgbar{display:block;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bgbar>i{display:block;height:100%;background:var(--clarea-orange,#b4561b);transition:width .3s ease}
.bgparts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.bgparts li{display:flex;align-items:center;gap:9px;font-size:13.5px}
.bgparts li span{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:var(--sunk);color:var(--muted)}
.bgparts li.ok span{background:rgba(46,157,91,.18);color:#2e9d5b}
.bgparts li.err span{background:rgba(192,57,43,.15);color:#d9534f}
.bgparts li.run span{border:2px solid var(--line);border-top-color:var(--clarea-orange,#b4561b);background:none;animation:aispin 1s linear infinite}
.bgparts li.ok,.bgparts li.wait{color:var(--muted)}
.bgacts{display:flex;gap:8px;flex-wrap:wrap}
.bgbtn{flex:none;font:inherit;font-size:13.5px;font-weight:700;border-radius:9px;padding:8px 12px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.bgbtn.main{background:#b4561b;border-color:transparent;color:#fff}  /* the deep orange in both themes: the light one of dark mode looks washed out under white text */
.ntlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.ntrow{display:flex;gap:10px;padding:11px 12px;text-decoration:none;color:var(--fg);position:relative}
.ntrow+.ntrow{border-top:1px solid var(--line)}
.ntrow.new{background:color-mix(in srgb,var(--accent) 8%,var(--bg))}
.ntrow.new::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.ntrow .aipi{width:26px;height:26px;font-size:13px;margin-top:1px}
.ntrow time{display:block;font-size:12px;color:var(--muted);margin-top:3px}
@media (hover:hover) and (pointer:fine){.bgbtn:hover{border-color:var(--accent)}.bgbtn.main:hover{filter:brightness(1.08)}a.ntrow:hover{background:var(--sunk)}}

/* ---------- theme + profile in one bubble ---------- */
.ucombo{margin-left:auto;flex:none;display:flex;align-items:center;gap:2px;padding:3px 3px 3px 0}
.ucombo .thbtn{margin-left:0;width:30px;height:34px;border:0;background:none}
.ucombo .ubar{margin-left:0;padding-left:3px;border-left:1px solid var(--line)}
.ucombo .ubtn{border:0;background:none;padding:3px 10px 3px 4px}
/* hover: no boxes, only the item itself reacts (the icon and the name go to the accent) */
.ucombo .thbtn svg,.ucombo .ubtn i,.ucombo .ubtn span{transition:transform .2s cubic-bezier(.2,.8,.2,1),color .2s ease}
@media (hover:hover) and (pointer:fine){.ucombo .thbtn:hover{color:var(--accent)}.ucombo .ubtn:hover span{color:var(--accent)}}

/* ---------- «Instalar» (only on phones and tablets, only in the browser) ---------- */
.instbtn{margin-left:auto;flex:none;display:flex;align-items:center;gap:5px;height:42px;border:0;background:none;border-radius:999px;padding:0 7px 0 13px;font:inherit;font-size:13.5px;font-weight:700;color:var(--fg);cursor:pointer}
.instbtn svg{width:18px;height:18px;color:var(--accent)}
.instbtn + .ucombo{margin-left:auto}  /* equal free space on both sides: «Instalar» sits centred between the logo and the profile */
/* narrow phones: just the icon, and long names get cut with «…» instead of pushing out of the screen */
@media (max-width:389px){.instbtn span{display:none}.instbtn{width:42px;padding:0 0 0 6px;justify-content:center}}
.instbtn + .ucombo{flex:0 1 auto;min-width:0}.instbtn + .ucombo .ubar,.instbtn + .ucombo .ubtn{min-width:0}
.insthead{display:flex;align-items:center;gap:12px}
.insthead img{width:52px;height:52px;border-radius:12px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.insthead h1{font-size:20px;font-weight:800}
.insthead p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.inststeps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.inststeps li{counter-increment:st;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:11px 12px;font-size:15px;line-height:1.35}
.inststeps li::before{content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.inststeps .ik{display:inline-flex;align-items:center;justify-content:center;vertical-align:-6px;width:28px;height:24px;margin:0 2px;border-radius:7px;background:var(--sunk);color:#0a84ff}
.inststeps .ik svg{width:17px;height:17px}

.instnote{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
.instarrow{position:fixed;z-index:121;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:none}
.instarrow svg{width:24px;height:24px}
.instarrow.down{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.instarrow.up{top:calc(10px + env(safe-area-inset-top,0px))}
.instarrow.mid{left:calc(50% - 23px)}.instarrow.right{right:18px}
@media (prefers-reduced-motion: no-preference){.instarrow.down{animation:instdn 1s ease-in-out infinite}.instarrow.up{animation:instup 1s ease-in-out infinite}}
@keyframes instdn{50%{transform:translateY(8px)}}
@keyframes instup{50%{transform:translateY(-8px)}}
@media (hover:hover) and (pointer:fine){.instbtn:hover{color:var(--accent)}}

.instchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.instchips::-webkit-scrollbar{display:none}
.instchips button{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;font-size:13.5px;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:7px 12px;cursor:pointer}
.instchips button small{font-size:10.5px;font-weight:600;color:var(--muted)}
.instchips button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg))}
.instchips button.on small{color:var(--accent)}
.instarrow[hidden]{display:none}
@media (hover:hover) and (pointer:fine){.instchips button:hover{border-color:var(--accent)}}
.aipi.cal{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}.aipi.cal svg{width:15px;height:15px}

/* «Tareas en segundo plano»: the AI card opens its details */
.bgcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.bgsum{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"ic t chev" "ic more more";align-items:center;gap:2px 10px;width:100%;font:inherit;text-align:left;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-radius:10px}
.bgsum>.aipi{grid-area:ic}.bgsum>.bgt{grid-area:t}
.bgchev{grid-area:chev;width:9px;height:9px;margin:0 6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .2s ease}
.bgcard.open .bgchev{transform:rotate(-135deg) translateY(-2px)}
.bgmore{grid-area:more;font-size:12.5px;font-weight:700;color:var(--accent)}
.bgdet{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.bgkv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bgkv>div{background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.bgkv small,.bgnow small{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.bgkv b{font-size:14px;overflow-wrap:anywhere}
.bgnow{margin:0;display:flex;flex-direction:column;gap:2px;font-size:14px;font-weight:600}
.bgparts li em{font-style:normal;min-width:0;overflow-wrap:anywhere}
@media (hover:hover) and (pointer:fine){.bgsum:hover .bgt b,.bgsum:hover .bgmore{color:var(--accent)}}
/* PC: the panel uses the width of the screen */
@media (min-width:900px){
  .authcard.bgwide{max-width:min(1100px,94vw)}
  .bgwide .bgbody{display:grid;grid-template-columns:minmax(280px,1fr) 2.2fr;gap:12px 22px;align-items:start}
  .bgwide .bgparts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 22px}
  .bgwide .bgkv{grid-template-columns:repeat(4,minmax(0,1fr))}
  .bgwide>.ghostbtn{align-self:center;min-width:240px}
}
.bglast{font-weight:500;font-size:13px;color:var(--muted);overflow-wrap:anywhere}

.ntmsg{margin:0;font-size:13px;color:#d9534f}

/* the menu item of the background tasks, while something is working */
.umenu button.mbusy{position:relative;padding-left:34px;background:color-mix(in srgb,var(--clarea-orange,#b4561b) 10%,transparent)}
.umenu button.mbusy small{color:var(--clarea-orange,#b4561b);font-weight:600}
.mspin{position:absolute;left:11px;top:13px;width:14px;height:14px;border-radius:50%;border:2px solid color-mix(in srgb,var(--clarea-orange,#b4561b) 30%,transparent);border-top-color:var(--clarea-orange,#b4561b);animation:aispin 1s linear infinite}
.bgkeep{margin:0;padding:9px 11px;border-radius:10px;background:color-mix(in srgb,var(--clarea-orange,#b4561b) 10%,transparent);font-size:13px;line-height:1.45;color:var(--fg)}
.bgkeep b{color:var(--clarea-orange,#b4561b)}

.bgwake{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer}
.bgwake span{flex:1;display:flex;flex-direction:column;gap:1px}.bgwake b{font-size:14px}.bgwake small{font-size:12.5px;color:var(--muted)}
.bgwake i{flex:none;width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background-color .2s ease}
.bgwake i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.bgwake.on i{background:var(--accent)}.bgwake.on i::after{transform:translateX(16px)}

/* the bell: notices in a dropdown */
.nwrap{position:relative;display:flex}
.nbtn{position:relative;width:34px;height:34px;border:0;background:none;color:var(--fg);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:color .2s ease}
.nbtn svg{width:19px;height:19px}
.nbtn .ubadge{top:0;right:-2px}
.npop{position:absolute;right:-60px;top:calc(100% + 8px);z-index:40;width:min(380px,calc(100vw - 24px));max-height:min(70vh,560px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.22);overflow:hidden}
.nphead{display:flex;align-items:baseline;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.nphead b{font-size:15.5px}.nphead small{font-size:12.5px;color:var(--accent);font-weight:700}
.npbody{overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.npbody .ntlist{border:0;border-radius:10px}
@media (max-width:480px){.npop{position:fixed;left:12px;right:12px;top:calc(56px + env(safe-area-inset-top,0px));width:auto}}
@media (prefers-reduced-motion: no-preference){.npop{animation:cl-pop .18s cubic-bezier(.2,.8,.2,1) both;transform-origin:top right}}

/* close: always at the top right of every window */

function qItem(q){
  const it = AI.items[q.n], m = PG.mine[q.n] || {}, ai = it && it.level, my = m.lv;
  let b = '';
  if (q.hint) b += '<div class="qsec"><small>Pista del profe</small><p class="qhint">' + esc(q.hint) + '</p></div>';
  if (it){
    if (it.q && it.q !== q.q) b += '<div class="qsec"><small>Tal como venía</small><p class="qnone">' + esc(q.q) + '</p></div>';
    if (it.short) b += '<div class="qsec"><small>En pocas palabras</small><p class="qshort">' + fmt(it.short) + '</p></div>';
    if (it.answer) b += '<div class="qsec"><small>Respuesta de examen</small><p>' + fmt(it.answer) + '</p></div>';
    if (it.points && it.points.length) b += '<div class="qsec"><small>Ideas que no pueden faltar</small><ul>' + it.points.map(x => '<li>' + fmt(x) + '</li>').join("") + '</ul></div>';
    if (it.keyTerms && it.keyTerms.length) b += '<div class="qsec"><small>Conceptos que debes nombrar</small><div class="qkeys">' + it.keyTerms.map(x => '<span>' + esc(x) + '</span>').join("") + '</div></div>';
    if (it.example) b += '<div class="qsec"><small>Ejemplo</small><pre>' + esc(it.example) + '</pre></div>';
    if (it.mistakes && it.mistakes.length) b += '<div class="qsec"><small>Errores típicos</small><ul>' + it.mistakes.map(x => '<li>' + fmt(x) + '</li>').join("") + '</ul></div>';
    if (it.tip) b += '<div class="qsec"><small>Para recordarla</small><p class="qtip">' + fmt(it.tip) + '</p></div>';
    if (it.why) b += '<div class="qsec"><small>Por qué es ' + (LV[ai] || "").toLowerCase() + '</small><p class="qnone">' + esc(it.why) + '</p></div>';
  } else b += '<p class="qnone">Aún no tiene explicación. Prepárala en la pestaña «✦ IA».</p>';
  b += '<button type="button" class="btn ghostbtn qask" data-qask="' + q.n + '">Pregúntale a tu IA sobre esta pregunta</button>';
  b += '<div class="qmine"><small>Para mí es</small>' + Object.keys(LV).map(l => '<button data-mylv="' + q.n + '|' + l + '" class="' + l + (my === l ? ' on' : '') + '" aria-pressed="' + (my === l) + '">' + LV[l] + '</button>').join("") + '</div>';
  b += '<label class="qsec"><small>Mis notas</small><textarea class="qnotes" data-notes="' + q.n + '" placeholder="Lo que te dijo el profe, cómo lo explicarías tú…">' + esc(m.notes || "") + '</textarea></label>';
  return '<details class="qi' + (knownOf(q.n) ? ' known' : '') + '" data-qn="' + q.n + '"><summary><span class="qn">' + q.n + '</span><span class="qtx"><b>' + esc(qText(q)) + '</b><span class="qtags">'
    + (ai ? '<span class="lv ' + ai + '">' + LV[ai] + '</span>' : '') + (my && my !== ai ? '<span class="lv mine ' + my + '">' + LV[my] + '</span>' : '') + (knownOf(q.n) ? '<span class="lv facil">Dominada</span>' : '')
    + '</span></span></summary><div class="qb">' + b + '</div></details>';
}

/* ===================== «Ponte a prueba»: answer, compare, and grade yourself ===================== */
const PR = {deck: null, i: 0, show: false, ok: 0, mode: "repaso"};
const normT = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function termFound(term, u){ const t = normT(term).replace(/[«»()]/g, "").trim(); if (!t) return false; if (u.includes(t)) return true; const ws = t.split(/[^a-z0-9ñ_$]+/).filter(w => w.length >= 4); return ws.length > 0 && ws.filter(w => u.includes(w.slice(0, Math.max(4, Math.min(6, w.length))))).length / ws.length >= 0.6; }
function deckFor(mode){
  let qs = S.qs.slice();
  if (mode === "repaso") qs = qs.filter(q => dueOf(q.n)).sort((a, b) => ((PG.mine[a.n] || {}).box || 0) - ((PG.mine[b.n] || {}).box || 0));
  else if (mode === "dificil") qs = qs.filter(q => levelOf(q) === "dificil" || (levelOf(q) === "media" && !knownOf(q.n)));
  else if (mode === "falladas") qs = qs.filter(q => !knownOf(q.n) && (PG.mine[q.n] || {}).seen);
  else qs.sort(() => Math.random() - 0.5);
  return qs.slice(0, 12);
}
function viewPractice(){
  if (!PR.deck){
    const modes = [["repaso","Lo que toca repasar", deckFor("repaso").length], ["dificil","Las difíciles", deckFor("dificil").length], ["falladas","Las que fallé", deckFor("falladas").length], ["azar","Al azar", Math.min(12, S.qs.length)]];
    return '<div class="prstart"><h2 class="sec-title">Ponte a prueba</h2><p class="hint2">Te sale una pregunta: respóndela por escrito o en voz alta, mira la respuesta modelo y di si la sabías. Las que fallas vuelven antes; las que sabes, más adelante.</p>'
      + '<div class="qfil">' + modes.map(m => '<button data-prmode="' + m[0] + '" class="' + (PR.mode === m[0] ? 'on' : '') + '"' + (m[2] ? '' : ' disabled') + '>' + m[1] + '<small>' + m[2] + '</small></button>').join("") + '</div>'
      + '<button class="btn" data-prgo>Empezar</button></div>';
  }
  if (PR.i >= PR.deck.length) return '<div class="prend"><b>¡Ronda terminada!</b><p class="hint2">Sabías ' + PR.ok + ' de ' + PR.deck.length + '.</p><button class="btn" data-prgo>Otra ronda</button><button class="btn ghostbtn" data-prexit>Volver</button></div>';
  const q = PR.deck[PR.i], it = AI.items[q.n], ans = PR.ans || "";
  let h = '<div class="pr"><div class="prtop"><span>Pregunta ' + (PR.i + 1) + ' de ' + PR.deck.length + '</span><button class="btn ghostbtn small" data-prexit>Salir</button></div>'
    + '<div class="prq"><b>' + esc(qText(q)) + '</b>' + (levelOf(q) ? '<span class="lv ' + levelOf(q) + '" style="align-self:flex-start">' + LV[levelOf(q)] + '</span>' : '')
    + (PR.show ? (ans ? '<div class="qsec"><small>Tu respuesta</small><p>' + esc(ans) + '</p></div>' : '') : '<textarea id="prans" placeholder="Escribe tu respuesta (opcional)…">' + esc(ans) + '</textarea>') + '</div>';
  if (!PR.show) return h + '<button class="btn" data-prshow>Ver la respuesta</button></div>';
  if (it){
    const u = normT(ans), K = it.keyTerms || [];
    h += '<div class="prq">' + (it.short ? '<div class="qsec"><small>En pocas palabras</small><p class="qshort">' + fmt(it.short) + '</p></div>' : '') + '<div class="qsec"><small>Respuesta de examen</small><p>' + fmt(it.answer || "") + '</p></div>'
      + (K.length ? '<div class="qsec"><small>' + (ans ? 'Conceptos que has nombrado' : 'Conceptos que debes nombrar') + '</small><div class="qkeys prfound">' + K.map(k => '<span class="' + (ans ? (termFound(k, u) ? 'ok' : 'no') : '') + '">' + (ans ? (termFound(k, u) ? '✓ ' : '✗ ') : '') + esc(k) + '</span>').join("") + '</div></div>' : '') + '</div>';
  } else h += '<p class="qnone">Esta pregunta aún no tiene respuesta preparada (pestaña «✦ IA»).</p>';
  return h + '<div class="prbtns"><button class="btn ghostbtn" data-prgrade="0">No la sabía</button><button class="btn ghostbtn" data-prgrade="1">Más o menos</button><button class="btn" data-prgrade="2">La sabía</button></div></div>';
}
function grade(g){
  const q = PR.deck[PR.i], m = mine(q.n);
  m.box = g === 2 ? Math.min(4, (m.box || 0) + 1) : g === 1 ? Math.max(1, m.box || 0) : 0; m.seen = Date.now();
  if (g === 2) PR.ok++;
  savePG(); PR.i++; PR.show = false; PR.ans = ""; render(); window.scrollTo(0, 0);
}


/* ===================== «Simulacro»: an exam like the real one, corrected by your AI ===================== */
const SIM = {n: 5, mins: 0, cur: null, view: null, timer: 0};
function simStart(){
  const pool = S.qs.slice().sort(() => Math.random() - 0.5).slice(0, Math.min(SIM.n === 99 ? S.qs.length : SIM.n, S.qs.length));
  SIM.cur = {at: Date.now(), ends: SIM.mins ? Date.now() + SIM.mins * 60000 : 0, qs: pool.map(q => q.n), ans: {}};
  SIM.view = null; render(); simTick();
}
function simTick(){
  clearInterval(SIM.timer);
  if (!SIM.cur || !SIM.cur.ends) return;
  SIM.timer = setInterval(() => { const el = document.getElementById("simclock"); const left = SIM.cur ? SIM.cur.ends - Date.now() : 0;
    if (left <= 0){ clearInterval(SIM.timer); if (SIM.cur) simHandIn(true); return; }
    if (el) el.textContent = Math.floor(left / 60000) + ":" + String(Math.floor(left % 60000 / 1000)).padStart(2, "0"); }, 1000);
}
function simSaveAnswers(){ if (!SIM.cur) return; document.querySelectorAll("[data-simans]").forEach(t => { SIM.cur.ans[t.dataset.simans] = t.value; }); }
// without an AI: the key concepts said decide the mark
function simLocalGrade(q, ans){
  const it = AI.items[q.n], K = (it && it.keyTerms) || [], u = normT(ans || "");
  if (!ans || !ans.trim()) return {score: 0, fb: "Sin responder."};
  if (!K.length) return {score: null, fb: "Sin respuesta modelo para comparar: prepárala en «✦ IA»."};
  const got = K.filter(k => termFound(k, u));
  return {score: Math.round(got.length / K.length * 100) / 10, fb: got.length === K.length ? "Nombras todos los conceptos clave." : "Te faltan: " + K.filter(k => !got.includes(k)).join(", ") + "."};
}
async function simHandIn(timeUp){

  SIM.cur = null; SIM.view = {grading: true, timeUp}; render(); window.scrollTo(0, 0);
  const qs = cur.qs.map(n => S.qs.find(q => q.n === n)).filter(Boolean);
  let marks = qs.map(q => simLocalGrade(q, cur.ans[q.n])), byAI = false;
  if (window.CLAI && CLAI.ready() && qs.some(q => (cur.ans[q.n] || "").trim())){
    try {
      const prompt = 'Eres el profesor de ' + S.subj + ' y corriges un examen de DAW. Pon una nota de 0 a 10 a cada respuesta, con criterio de examen real: lo que dice bien, lo que falta y lo que está mal. ' + (S.lang === "ca" ? "Escribe en catalán." : "Escribe en español.") + '\n\nResponde SOLO con un objeto JSON válido, sin texto antes ni después y sin ```. Forma exacta:\n{"items":[{"n":1,"score":7.5,"feedback":"2-4 frases: qué está bien, qué falta, qué corregir"}]}\n\n'
        + qs.map(q => { const it = AI.items[q.n] || {}; return "Pregunta " + q.n + ": " + (it.q || q.q) + "\nRespuesta modelo: " + (it.answer || "(sin respuesta modelo)") + "\nConceptos clave: " + (it.keyTerms || []).join(", ") + "\nRespuesta del alumno: " + ((cur.ans[q.n] || "").trim() || "(en blanco)"); }).join("\n\n");
      const j = CLAI.parseJSON(await CLAI.callAI(prompt, true));
      let n = 0;
      marks = qs.map((q, i) => { const it = (Array.isArray(j.items) ? j.items : []).find(x => +x.n === +q.n); if (!it) return marks[i]; n++; return {score: Math.max(0, Math.min(10, +it.score || 0)), fb: String(it.feedback || "").slice(0, 900)}; });
      byAI = n > 0;
    } catch(e){ /* the AI could not: the local marks stay */ }
  }
  const scored = marks.filter(m => m.score !== null), nota = scored.length ? Math.round(scored.reduce((a, m) => a + m.score, 0) / qs.length * 10) / 10 : null;
  load(); PG.sims = (PG.sims || []).concat([{at: cur.at, mins: Math.round((Date.now() - cur.at) / 60000), nota, byAI, items: qs.map((q, i) => ({n: q.n, ans: (cur.ans[q.n] || "").slice(0, 4000), score: marks[i].score, fb: marks[i].fb}))}]).slice(-30);
  // what went badly comes back sooner in «Ponte a prueba»
  qs.forEach((q, i) => { const m = mine(q.n), sc = marks[i].score; if (sc === null) return; m.box = sc >= 8 ? Math.min(4, (m.box || 0) + 1) : sc >= 5 ? Math.max(1, m.box || 0) : 0; m.seen = Date.now(); });
  savePG(); SIM.view = {result: PG.sims.length - 1, timeUp}; render(); window.scrollTo(0, 0);
}

/* ===================== ✦ IA: prepare every answer (with your key, or copying into your chat) ===================== */
const CHUNK = 5;
const chunks = () => { const out = []; for (let i = 0; i < S.qs.length; i += CHUNK) out.push(S.qs.slice(i, i + CHUNK)); return out; };
const chunkId = part => "c" + part[0].n + "-" + part[part.length - 1].n;
const chunkDone = part => part.every(q => AI.items[q.n]);
function qPrompt(part){
  const lang = S.lang === "ca" ? "en catalán" : "en español";
  return 'Eres profesor de Desarrollo de Aplicaciones Web (DAW). Un estudiante prepara el examen de ' + S.subj + (S.subjName ? ' (' + S.subjName + ')' : '') + '. El profesor les ha dado estas preguntas, que son las que caerán en el examen. Algunas tienen faltas de ortografía o están a medias: entiéndelas como mejor encaje en la asignatura.\n\n'
    + 'Responde SOLO con un objeto JSON válido, sin texto antes ni después y sin ```. Forma exacta:\n{"items":[{"n":1,"q":"la pregunta bien escrita","level":"facil|media|dificil","why":"por qué tiene esa dificultad, 1 frase","short":"la respuesta en 1-2 frases","answer":"la respuesta completa para el examen: 5-10 frases bien organizadas, con definiciones y el porqué","points":["3 a 6 ideas que no pueden faltar"],"keyTerms":["3 a 6 conceptos o palabras clave que el profe espera leer"],"example":"un ejemplo concreto o un trozo de código corto, si ayuda (si no, vacío)","mistakes":["1 a 3 errores típicos o confusiones"],"tip":"un truco para recordarla"}]}\n\n'
    + 'Reglas:\n- Una entrada por cada pregunta, con su mismo número "n".\n- Todo ' + lang + '. Los nombres de código entre « » (por ejemplo «let», «Express»).\n- "level": facil = definición directa; media = hay que explicar o comparar; dificil = varios conceptos, ejemplos o razonamiento.\n- Si la pregunta trae una pista del profe, úsala.\n\nPreguntas:\n'
    + part.map(q => q.n + ". " + q.q + (q.hint ? "  [Pista del profe: " + q.hint + "]" : "")).join("\n");
}
function applyChunk(part, data){
  const items = data && Array.isArray(data.items) ? data.items : null; if (!items) throw new Error("Falta «items» en la respuesta.");
  let got = 0;
  part.forEach(q => {
    const it = items.find(x => +x.n === +q.n); if (!it || !it.answer) return;
    const arr = (a, n, l) => (Array.isArray(a) ? a : []).map(x => String(x).slice(0, l)).filter(Boolean).slice(0, n);
    AI.items[q.n] = {q: String(it.q || q.q).slice(0, 400), level: ["facil","media","dificil"].includes(it.level) ? it.level : "media", why: String(it.why || "").slice(0, 300),
      short: String(it.short || "").slice(0, 600), answer: String(it.answer).slice(0, 4000), points: arr(it.points, 8, 400), keyTerms: arr(it.keyTerms, 8, 60),
      example: String(it.example || "").slice(0, 1500), mistakes: arr(it.mistakes, 4, 400), tip: String(it.tip || "").slice(0, 500)}; got++;
  });
  if (!got) throw new Error("La respuesta no traía ninguna de estas preguntas.");
  saveAI();
}
const RUN = {on: false, stop: false, msg: null, cur: null, wait: null};
const wakeTry = async () => { try { if ("wakeLock" in navigator && localStorage.getItem("clarea-wake") !== "0") RUN.wake = await navigator.wakeLock.request("screen"); } catch(e){} };
/* in the cloud: the server prepares them (Clarea can be closed); here the answers are collected */
async function runCloud(){
  const todo = chunks().filter(p => !chunkDone(p));
  if (!todo.length) return;
  RUN.msg = null; RUN.sending = true; render(true);
  try {
    const cl = await CLAI.cloudSubmit({title: S.name, url: "preguntas.html?id=" + encodeURIComponent(SID), parts: todo.map(p => ({id: chunkId(p), text: qPrompt(p)}))});
    load(); AI.cloud = cl; saveAI();
    if (window.clareaToast) window.clareaToast(cl.push ? "Preparando en la nube: ya puedes cerrar Clarea. Te avisaremos al terminar." : "Preparando en la nube: puedes cerrar Clarea (activa los avisos en la campana para que te avise).");
  } catch(e){ RUN.sending = false; RUN.msg = {err: true, t: "No se ha podido preparar en la nube (" + (e.message || e) + "). Se hace aquí, con Clarea abierta."}; render(true); return runAI(true); }
  RUN.sending = false; render(true); pollCloud();
}
let pollT = 0;
async function pollCloud(){
  clearTimeout(pollT); load(); const cl = AI.cloud; if (!cl) return;
  try {
    const have = chunks().filter(chunkDone).map(chunkId);
    const g = await CLAI.cloudFetch(cl, have);
    load();
    if (g.gone){ AI.cloud = null; saveAI(); render(true); return; }
    let err = null;
    g.parts.forEach(x => { const part = chunks().find(p => chunkId(p) === x.id); if (!part) return;
      if (x.res){ try { applyChunk(part, CLAI.parseJSON(x.res)); load(); } catch(e){ err = "Una parte no se ha podido leer: " + (e.message || e); } }
      else if (x.st === "err" || x.st === "stop") err = CLAI.errEs(x.err) || "Una parte no se ha podido preparar."; });
    load();                                                                // (applyChunk saved the answers)
    const wait = g.parts.find(x => x.st === "wait");

<script>
/* offline cache + "Actualizar" banner when a new version has been downloaded */
(function () {
  if (!("serviceWorker" in navigator)) return;
  var reloading = false, shown = false;
  function banner(worker) {
    if (shown || !worker) return; shown = true;
    var b = document.createElement("div");
    b.className = "updbar"; b.setAttribute("role", "status");
    b.innerHTML = '<div><b>Hay una versión nueva de Clarea</b><span>Toca «Actualizar» para usarla ahora.</span></div><button type="button" class="updgo">Actualizar</button><button type="button" class="updno" aria-label="Ahora no">✕</button>';
    document.body.appendChild(b);
    b.querySelector(".updgo").addEventListener("click", function () {
      b.querySelector(".updgo").textContent = "Actualizando…";
      worker.postMessage({type: "SKIP_WAITING"});
      setTimeout(function () { if (!reloading) location.reload(); }, 3000);
    });
    b.querySelector(".updno").addEventListener("click", function () { b.classList.add("closing"); setTimeout(function () { b.remove(); shown = false; }, 220); });
  }
  // reload only when a NEW version takes over; the very first install must not reload (it would wipe what is being typed)
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function () { if (!hadController) { hadController = true; return; } if (reloading) return; reloading = true; location.reload(); });
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").then(function (reg) {
      function watch(w) { if (!w) return; w.addEventListener("statechange", function () { if (w.state === "installed" && navigator.serviceWorker.controller) banner(w); }); }
      if (reg.waiting && navigator.serviceWorker.controller) banner(reg.waiting);
      watch(reg.installing);
      reg.addEventListener("updatefound", function () { watch(reg.installing); });
      // look for a new version now and every time the app comes back to the screen
      reg.update().catch(function () {});
      // manual check from the account menu
      window.clareaCheckUpdate = function (say) {
        if (reg.waiting) { banner(reg.waiting); return; }
        say("Buscando actualizaciones…");
        reg.update().then(function () {
          setTimeout(function () {
            if (reg.waiting) banner(reg.waiting);
            else if (reg.installing) say("Descargando la versión nueva…");
            else say("Ya tienes la última versión.");
          }, 1500);
        }).catch(function () { say("Sin conexión: no se puede comprobar ahora."); });
      };
      document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") reg.update().catch(function () {}); });
    }).catch(function () {});
  });
})();
</script>
